<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%" style="background:#042F2A; border-radius:16px; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075433"/>
      <stop offset="100%" stop-color="#042823"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="#042F2A" rx="16"/>
  <circle cx="800" cy="80" r="160" fill="#075433" opacity="0.4"/>
  <circle cx="80" cy="400" r="120" fill="#075433" opacity="0.3"/>

  <!-- Top Badge -->
  <rect x="48" y="36" width="230" height="32" rx="16" fill="#0D4539"/>
  <text x="163" y="57" fill="#9FE7BD" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">TENURE CALCULATION LAB</text>

  <!-- Main Display Card -->
  <rect x="48" y="86" width="784" height="230" rx="16" fill="url(#cardGrad)" stroke="#1B6349" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="80" y="128" fill="#D3E5DE" font-size="14" font-weight="600" letter-spacing="0.5">EMPLOYMENT SERVICE AUDIT</text>
  
  <text x="80" y="200" fill="#FFFFFF" font-size="64" font-family="'JetBrains Mono', monospace" font-weight="800">3,112</text>
  <text x="295" y="194" fill="#FF9A77" font-size="28" font-weight="700">TOTAL CALENDAR DAYS</text>

  <line x1="80" y1="230" x2="800" y2="230" stroke="#1B6349" stroke-width="1"/>
  
  <text x="80" y="265" fill="#9FE7BD" font-size="14" font-weight="600">Start Date: <tspan fill="#FFFFFF" font-weight="700">March 15, 2018</tspan></text>
  <text x="440" y="265" fill="#9FE7BD" font-size="14" font-weight="600">Reference Date: <tspan fill="#FFFFFF" font-weight="700">September 24, 2026</tspan></text>
  <text x="80" y="295" fill="#D3E5DE" font-size="13">Inclusive Tenure: 3,113 Days | Calendar Span: 3,112 Days | Leap Days: 2 (2020, 2024)</text>

  <!-- 3 Summary Badges Below -->
  <rect x="48" y="336" width="248" height="88" rx="12" fill="#073B32" stroke="#1B6349" stroke-width="1"/>
  <text x="70" y="366" fill="#9FE7BD" font-size="12" font-weight="700" letter-spacing="0.5">YEARS &amp; MONTHS</text>
  <text x="70" y="400" fill="#FFFFFF" font-size="19" font-weight="700">8 Yrs, 6 Mos, 9 Days</text>

  <rect x="316" y="336" width="248" height="88" rx="12" fill="#073B32" stroke="#1B6349" stroke-width="1"/>
  <text x="338" y="366" fill="#9FE7BD" font-size="12" font-weight="700" letter-spacing="0.5">ESTIMATED WORKDAYS</text>
  <text x="338" y="400" fill="#FFFFFF" font-size="19" font-weight="700">~2,223 Weekdays</text>

  <rect x="584" y="336" width="248" height="88" rx="12" fill="#073B32" stroke="#1B6349" stroke-width="1"/>
  <text x="606" y="366" fill="#FF9A77" font-size="12" font-weight="700" letter-spacing="0.5">TOTAL WEEKS</text>
  <text x="606" y="400" fill="#FFFFFF" font-size="19" font-weight="700">444 Wks + 4 Days</text>
</svg>