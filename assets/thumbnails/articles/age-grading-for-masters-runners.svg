<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#042F2A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="thumbNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B233A" />
      <stop offset="100%" stop-color="#042F2A" />
    </linearGradient>
    <linearGradient id="thumbMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FE7BD" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="thumbCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF754D" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="thumbShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background decorative tracks -->
  <g opacity="0.15">
    <path d="M 0 550 C 400 350, 880 350, 1280 550" stroke="#9FE7BD" stroke-width="28" fill="none" />
    <path d="M 0 600 C 400 400, 880 400, 1280 600" stroke="#9FE7BD" stroke-width="28" fill="none" />
    <path d="M 0 650 C 400 450, 880 450, 1280 650" stroke="#9FE7BD" stroke-width="28" fill="none" />
  </g>

  <!-- Left Main Content Area -->
  <g transform="translate(100, 140)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="310" height="42" rx="21" fill="rgba(159,231,189,0.15)" stroke="#9FE7BD" stroke-width="1.5" />
    <text x="155" y="27" font-size="14" font-weight="700" fill="#9FE7BD" letter-spacing="1.5" text-anchor="middle">BIOLOGICAL &amp; HEALTH • GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="110" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Age Grading for</text>
    <text x="0" y="174" font-size="54" font-weight="900" fill="#9FE7BD" letter-spacing="-1">Masters Runners</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="228" font-size="22" font-weight="500" fill="#D3E5DE">How Age-Adjusted Performance Works &amp; Longitudinal Tracking</text>

    <!-- 3 Core Badges -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="160" height="48" rx="10" fill="#0B233A" stroke="rgba(159,231,189,0.3)" stroke-width="1" />
      <text x="80" y="29" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ages 35–80+</text>

      <rect x="176" y="0" width="170" height="48" rx="10" fill="#0B233A" stroke="rgba(159,231,189,0.3)" stroke-width="1" />
      <text x="261" y="29" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">WMA Factors</text>

      <rect x="362" y="0" width="180" height="48" rx="10" fill="#0B233A" stroke="rgba(159,231,189,0.3)" stroke-width="1" />
      <text x="452" y="29" font-size="15" font-weight="700" fill="#9FE7BD" text-anchor="middle">Lifelong PRs</text>
    </g>
  </g>

  <!-- Right Visual Feature Card -->
  <g transform="translate(760, 120)" filter="url(#thumbShadow)">
    <rect x="0" y="0" width="420" height="480" rx="24" fill="#0B233A" stroke="#9FE7BD" stroke-width="2" />
    
    <!-- Card Inner Top -->
    <rect x="30" y="30" width="360" height="170" rx="16" fill="#042F2A" stroke="rgba(159,231,189,0.2)" stroke-width="1" />
    <text x="50" y="65" font-size="14" font-weight="700" fill="#9FE7BD">CHRONO PACE VS AGE FACTOR</text>
    <text x="50" y="115" font-size="44" font-weight="900" fill="#FFFFFF" font-family="Courier, monospace">21:30</text>
    <text x="50" y="145" font-size="14" fill="#D3E5DE">Male • Age 56 • 5K Road Race</text>
    <rect x="50" y="156" width="180" height="26" rx="6" fill="#075433" />
    <text x="140" y="174" font-size="13" font-weight="700" fill="#9FE7BD" text-anchor="middle">Clock: +1:15 slower</text>

    <!-- Card Inner Bottom Age Grade Metric -->
    <rect x="30" y="224" width="360" height="220" rx="16" fill="url(#thumbNavy)" stroke="rgba(159,231,189,0.4)" stroke-width="1.5" />
    <text x="50" y="260" font-size="14" font-weight="700" fill="#D3E5DE">WMA AGE-GRADED SCORE</text>
    <text x="50" y="325" font-size="64" font-weight="900" fill="#9FE7BD">73.5%</text>
    <rect x="50" y="345" width="220" height="32" rx="8" fill="url(#thumbCoral)" />
    <text x="160" y="367" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">+1.7% RELATIVE GAIN</text>
    <text x="50" y="415" font-size="13.5" fill="#D3E5DE">Outperformed demographic aging curve!</text>
  </g>
</svg>
