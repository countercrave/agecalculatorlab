<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="10K Age Grading Explained: How Age Grade Works">
  <defs>
    <linearGradient id="thumbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="50%" stop-color="#075433"/>
      <stop offset="100%" stop-color="#0B233A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8F5"/>
    </linearGradient>
    <filter id="cardSh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#thumbBg)"/>

  <!-- Decorative Wave / Track Grid -->
  <g opacity="0.15" stroke="#9FE7BD" stroke-width="2" fill="none">
    <path d="M-100,520 C350,520 550,380 900,420 C1150,450 1280,360 1380,360"/>
    <path d="M-100,560 C350,560 550,420 900,460 C1150,490 1280,400 1380,400"/>
    <path d="M-100,600 C350,600 550,460 900,500 C1150,530 1280,440 1380,440"/>
    <circle cx="1100" cy="180" r="240" stroke="#9FE7BD" stroke-dasharray="6 8"/>
  </g>

  <!-- Distance Pill -->
  <g transform="translate(80, 70)">
    <rect width="360" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="#9FE7BD" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#FF754D"/>
    <text x="42" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">10,000 METERS · 6.214 MILES ROAD</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="185" font-family="'Fraunces', Georgia, serif" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="-1">10K Age Grading Explained</text>
  <text x="80" y="235" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#D3E5DE">How age &amp; finish time determine your age-graded percentage</text>

  <!-- 3 Interactive Cards -->
  <g transform="translate(80, 290)" filter="url(#cardSh)">
    <!-- Card 1: Open Standard -->
    <g transform="translate(0, 0)">
      <rect width="350" height="350" rx="16" fill="url(#cardGrad)"/>
      <rect x="0" y="0" width="350" height="8" rx="4" fill="#075433"/>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#52796F" letter-spacing="1.2">WMA ROAD BENCHMARKS</text>
      <text x="28" y="88" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="700" fill="#0B233A">Open World Standards</text>
      <g transform="translate(28, 120)">
        <rect width="294" height="80" rx="10" fill="#F4F8F5" stroke="#D3E5DE"/>
        <text x="20" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">Open Men: 26:24.00</text>
        <text x="20" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#4A635A">1,584 sec · Rhonex Kipruto baseline</text>
      </g>
      <g transform="translate(28, 215)">
        <rect width="294" height="80" rx="10" fill="#F4F8F5" stroke="#D3E5DE"/>
        <text x="20" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">Open Women: 29:14.00</text>
        <text x="20" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#4A635A">1,754 sec · Yalemzerf Yehualaw baseline</text>
      </g>
    </g>

    <!-- Card 2: Worked 45:00 Example -->
    <g transform="translate(380, 0)">
      <rect width="350" height="350" rx="16" fill="url(#cardGrad)"/>
      <rect x="0" y="0" width="350" height="8" rx="4" fill="#FF754D"/>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FF754D" letter-spacing="1.2">SAME TIME · THREE AGES</text>
      <text x="28" y="88" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="700" fill="#0B233A">45:00 10K Time</text>
      <g transform="translate(28, 115)">
        <rect width="294" height="58" rx="8" fill="#FFFFFF" stroke="#E2DDD0"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0B233A">Male Age 25</text>
        <text x="16" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Factor 1.0000</text>
        <text x="278" y="37" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#075433" text-anchor="end">58.67%</text>
      </g>
      <g transform="translate(28, 185)">
        <rect width="294" height="58" rx="8" fill="#FFFDFB" stroke="#FF754D" stroke-width="1.5"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0B233A">Male Age 45</text>
        <text x="16" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Factor 0.9320 · Eq: 41:56</text>
        <text x="278" y="37" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#FF754D" text-anchor="end">62.94%</text>
      </g>
      <g transform="translate(28, 255)">
        <rect width="294" height="58" rx="8" fill="#FFFFFF" stroke="#E2DDD0"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0B233A">Male Age 65</text>
        <text x="16" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Factor 0.7680 · Eq: 34:34</text>
        <text x="278" y="37" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#075433" text-anchor="end">76.37%</text>
      </g>
    </g>

    <!-- Card 3: Formula & Standard -->
    <g transform="translate(760, 0)">
      <rect width="360" height="350" rx="16" fill="url(#cardGrad)"/>
      <rect x="0" y="0" width="360" height="8" rx="4" fill="#0B233A"/>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#0B233A" letter-spacing="1.2">MATHEMATICAL FORMULA</text>
      <text x="28" y="88" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="700" fill="#0B233A">Verified Calculation</text>
      <g transform="translate(28, 120)">
        <rect width="304" height="105" rx="10" fill="#042F2A"/>
        <text x="152" y="38" font-family="'Inter', monospace" font-size="14" font-weight="700" fill="#9FE7BD" text-anchor="middle">Age Grade (%) =</text>
        <text x="152" y="64" font-family="'Inter', monospace" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">(Age Standard / 10K Time) × 100</text>
        <text x="152" y="88" font-family="'Inter', monospace" font-size="12" fill="#D3E5DE" text-anchor="middle">Or: (Open Std / Adj Time) × 100</text>
      </g>
      <g transform="translate(28, 245)">
        <rect width="304" height="60" rx="8" fill="#F4F8F5" stroke="#D3E5DE"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">Age Calculator Lab Standard</text>
        <text x="16" y="46" font-family="'Inter', sans-serif" font-size="11.5" fill="#4A635A">Calibrated against 2025 WMA road datasets</text>
      </g>
    </g>
  </g>
</svg>