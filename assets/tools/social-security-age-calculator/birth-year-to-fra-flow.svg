<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="auto" style="max-width:920px;font-family:'Inter',system-ui,sans-serif;background:#042f2a;border-radius:12px;border:1px solid #1e684c;box-shadow:0 8px 24px rgba(0,0,0,0.25)">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
    <filter id="fShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="380" rx="12" fill="url(#flowBg)"/>

  <!-- Title Badge -->
  <rect x="280" y="20" width="360" height="34" rx="17" fill="#0b3d2b" stroke="#9fe7bd" stroke-width="1.5"/>
  <text x="460" y="42" fill="#9fe7bd" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FULL RETIREMENT AGE LOOKUP LOGIC</text>

  <!-- Step 1: Input DOB -->
  <g transform="translate(60, 90)" filter="url(#fShadow)">
    <rect width="200" height="110" rx="10" fill="#063826" stroke="#20a67b" stroke-width="2"/>
    <text x="100" y="28" fill="#9fe7bd" font-size="10" font-weight="700" text-anchor="middle">STEP 1: DATE OF BIRTH</text>
    <text x="100" y="58" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">Enter DOB</text>
    <text x="100" y="82" fill="#d3e5de" font-size="11" text-anchor="middle">Extract Birth Year</text>
    <text x="100" y="98" fill="#ffd180" font-size="11" text-anchor="middle">e.g., June 15, 1960</text>
  </g>

  <!-- Arrow 1 -> Step 2 -->
  <path d="M 260 145 L 340 145" fill="none" stroke="#9fe7bd" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="340,140 350,145 340,150" fill="#9fe7bd"/>

  <!-- Step 2: January 1 Decision Node -->
  <g transform="translate(350, 80)" filter="url(#fShadow)">
    <rect width="220" height="130" rx="10" fill="#08472f" stroke="#ffd180" stroke-width="2"/>
    <text x="110" y="26" fill="#ffd180" font-size="10" font-weight="700" text-anchor="middle">STEP 2: JANUARY 1 CHECK</text>
    <text x="110" y="52" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Born on Jan 1?</text>
    <text x="110" y="76" fill="#d3e5de" font-size="11" text-anchor="middle">YES: Use previous year</text>
    <text x="110" y="94" fill="#9fe7bd" font-size="11" text-anchor="middle">NO: Use exact birth year</text>
    <text x="110" y="114" fill="#ff855f" font-size="10" font-weight="600" text-anchor="middle">(Official SSA Ruling)</text>
  </g>

  <!-- Arrow 2 -> Step 3 -->
  <path d="M 570 145 L 650 145" fill="none" stroke="#9fe7bd" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="650,140 660,145 650,150" fill="#9fe7bd"/>

  <!-- Step 3: Match SSA Schedule -->
  <g transform="translate(660, 90)" filter="url(#fShadow)">
    <rect width="200" height="110" rx="10" fill="#063826" stroke="#20a67b" stroke-width="2"/>
    <text x="100" y="28" fill="#9fe7bd" font-size="10" font-weight="700" text-anchor="middle">STEP 3: SSA SCHEDULE</text>
    <text x="100" y="58" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">FRA Schedule</text>
    <text x="100" y="82" fill="#d3e5de" font-size="11" text-anchor="middle">1943–1954 → 66 yrs</text>
    <text x="100" y="98" fill="#ffd180" font-size="11" text-anchor="middle">1960+ → 67 yrs</text>
  </g>

  <!-- Downward Arrow to Final Milestone Output Card -->
  <path d="M 460 210 L 460 255" fill="none" stroke="#ffd180" stroke-width="2.5"/>
  <polygon points="455,255 460,265 465,255" fill="#ffd180"/>

  <!-- Final Output Card -->
  <g transform="translate(210, 265)" filter="url(#fShadow)">
    <rect width="500" height="85" rx="10" fill="#0d4734" stroke="#ffd180" stroke-width="2"/>
    <text x="250" y="28" fill="#ffd180" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ESTIMATED RETIREMENT MILESTONES</text>
    <text x="250" y="54" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">Full Retirement Age + Key Milestone Calendar Dates</text>
    <text x="250" y="74" fill="#9fe7bd" font-size="12" text-anchor="middle">Age 62 (Early Claiming) • FRA (Unreduced) • Age 70 (Maximum Credits)</text>
  </g>
</svg>