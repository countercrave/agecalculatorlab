<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="office-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="plaque-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="desk-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Office Interior Wall -->
  <rect width="800" height="600" fill="url(#office-wall)" />

  <!-- Background Office Window & Subtle City View -->
  <g transform="translate(60, 40)">
    <rect width="320" height="240" rx="4" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="4" />
    <line x1="160" y1="0" x2="160" y2="240" stroke="#cbd5e1" stroke-width="3" />
    <line x1="0" y1="120" x2="320" y2="120" stroke="#cbd5e1" stroke-width="3" />
    <!-- City silhouettes -->
    <rect x="20" y="80" width="35" height="155" fill="#bae6fd" />
    <rect x="70" y="50" width="45" height="185" fill="#93c5fd" />
    <rect x="130" y="110" width="50" height="125" fill="#bae6fd" />
    <rect x="195" y="70" width="40" height="165" fill="#93c5fd" />
    <rect x="250" y="95" width="55" height="140" fill="#bae6fd" />
  </g>

  <!-- Subtle Workplace Milestone Banner on Wall -->
  <g transform="translate(440, 60)">
    <rect width="300" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#desk-shadow)" />
    <circle cx="35" cy="35" r="18" fill="#fef3c7" />
    <text x="35" y="42" font-size="20" text-anchor="middle">&#127942;</text>
    <text x="70" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">SERVICE RECOGNITION</text>
    <text x="70" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Celebrating Dedication &amp; Leadership</text>
  </g>

  <!-- Modern Office Desk Surface -->
  <rect x="0" y="340" width="800" height="260" fill="url(#wood-desk)" />
  <rect x="0" y="340" width="800" height="12" fill="#f59e0b" opacity="0.3" />

  <!-- Laptop on Left Desk -->
  <g transform="translate(60, 240)">
    <!-- Screen -->
    <rect x="15" y="0" width="220" height="140" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    <rect x="25" y="10" width="200" height="120" rx="2" fill="#0b1329" />
    <!-- Screen content: Service Dashboard greeting -->
    <text x="125" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COMPANY INTRANET</text>
    <text x="125" y="65" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&#127881; Happy Work Anniversary!</text>
    <text x="125" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Thank you for 8 Years of Service</text>
    <rect x="55" y="98" width="140" height="16" rx="8" fill="#10b981" />
    <text x="125" y="110" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CLAIM MILESTONE AWARD</text>
    <!-- Keyboard base -->
    <polygon points="0,140 250,140 270,165 -20,165" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
    <rect x="80" y="144" width="90" height="12" rx="2" fill="#94a3b8" opacity="0.5" />
  </g>

  <!-- Center Piece: Elegant Acrylic / Crystal Service Award Plaque -->
  <g transform="translate(350, 180)" filter="url(#desk-shadow)">
    <!-- Base block -->
    <rect x="10" y="210" width="180" height="30" rx="4" fill="#1e293b" />
    <rect x="25" y="215" width="150" height="8" rx="2" fill="url(#gold-foil)" />
    <!-- Glass upright hexagon plaque -->
    <polygon points="100,0 180,50 180,210 20,210 20,50" fill="url(#plaque-glass)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Gold Medallion Ribbon -->
    <circle cx="100" cy="55" r="28" fill="url(#gold-foil)" />
    <circle cx="100" cy="55" r="22" fill="#ffffff" />
    <text x="100" y="62" fill="#b45309" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">&#10029;</text>
    <!-- Inscription -->
    <text x="100" y="105" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="13" font-weight="bold" text-anchor="middle">HONORARY TENURE</text>
    <text x="100" y="125" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" letter-spacing="1" text-anchor="middle">PRESENTED IN APPRECIATION</text>
    <text x="100" y="150" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">8 YEARS</text>
    <text x="100" y="172" fill="#334155" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OF EXCELLENCE</text>
    <line x1="50" y1="185" x2="150" y2="185" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="200" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">2018 &#8211; 2026</text>
  </g>

  <!-- Right Desk: Stand-up Calendar with Milestone Date -->
  <g transform="translate(600, 230)" filter="url(#desk-shadow)">
    <!-- Calendar base easel -->
    <polygon points="20,160 160,160 140,20 40,20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Spiral bound top rings -->
    <rect x="35" y="14" width="110" height="12" rx="4" fill="#0284c7" />
    <g fill="#ffffff">
      <circle cx="50" cy="20" r="3" />
      <circle cx="70" cy="20" r="3" />
      <circle cx="90" cy="20" r="3" />
      <circle cx="110" cy="20" r="3" />
      <circle cx="130" cy="20" r="3" />
    </g>
    <!-- Calendar Page -->
    <rect x="40" y="26" width="100" height="125" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="40" y="26" width="100" height="28" fill="#ef4444" />
    <text x="90" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MARCH 2026</text>
    <text x="90" y="95" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" text-anchor="middle">15</text>
    <text x="90" y="118" fill="#059669" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">&#127881; ANNIVERSARY</text>
    <text x="90" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">8 Years Completed</text>
  </g>
</svg>