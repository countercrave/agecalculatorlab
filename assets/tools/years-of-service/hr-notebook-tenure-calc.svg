<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Paper texture & desk background -->
    <linearGradient id="desk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f7f3eb" />
    </linearGradient>
    <filter id="shadow-sheet" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="sticky-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Wooden / Slate Executive Desk Backdrop -->
  <rect width="1200" height="675" fill="url(#desk-bg)" />

  <!-- Pen resting beside notebook -->
  <g transform="translate(1075, 160) rotate(14)">
    <rect x="-6" y="0" width="12" height="340" rx="6" fill="#1e293b" />
    <rect x="-4" y="20" width="8" height="45" fill="#d97706" />
    <path d="M-6,340 L6,340 L0,370 Z" fill="#94a3b8" />
    <path d="M-2,360 L2,360 L0,370 Z" fill="#0f172a" />
    <!-- Clip -->
    <rect x="5" y="30" width="4" height="80" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Notebook Sheet -->
  <g transform="translate(120, 45)" filter="url(#shadow-sheet)">
    <rect width="900" height="585" rx="8" fill="url(#paper-grad)" stroke="#e2d9cc" stroke-width="1.5" />

    <!-- Notebook Spiral Holes on Left Margin -->
    <g fill="#475569" opacity="0.3">
      <circle cx="28" cy="40" r="7" />
      <circle cx="28" cy="95" r="7" />
      <circle cx="28" cy="150" r="7" />
      <circle cx="28" cy="205" r="7" />
      <circle cx="28" cy="260" r="7" />
      <circle cx="28" cy="315" r="7" />
      <circle cx="28" cy="370" r="7" />
      <circle cx="28" cy="425" r="7" />
      <circle cx="28" cy="480" r="7" />
      <circle cx="28" cy="535" r="7" />
    </g>

    <!-- Red Margin Line -->
    <line x1="95" y1="0" x2="95" y2="585" stroke="#f87171" stroke-width="1.5" opacity="0.7" />

    <!-- Horizontal Notebook Ruled Lines -->
    <g stroke="#93c5fd" stroke-width="0.8" opacity="0.55">
      <line x1="95" y1="70" x2="880" y2="70" />
      <line x1="95" y1="110" x2="880" y2="110" />
      <line x1="95" y1="150" x2="880" y2="150" />
      <line x1="95" y1="190" x2="880" y2="190" />
      <line x1="95" y1="230" x2="880" y2="230" />
      <line x1="95" y1="270" x2="880" y2="270" />
      <line x1="95" y1="310" x2="880" y2="310" />
      <line x1="95" y1="350" x2="880" y2="350" />
      <line x1="95" y1="390" x2="880" y2="390" />
      <line x1="95" y1="430" x2="880" y2="430" />
      <line x1="95" y1="470" x2="880" y2="470" />
      <line x1="95" y1="510" x2="880" y2="510" />
      <line x1="95" y1="550" x2="880" y2="550" />
    </g>

    <!-- Header Handwritten in Ink -->
    <text x="130" y="62" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif" font-size="22" font-weight="bold">HR Service Tenure Audit &#8212; Manual Verification</text>
    <text x="680" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Ref: ACL-EMP-2026</text>

    <!-- Employee Information -->
    <g transform="translate(130, 80)">
      <text x="0" y="24" fill="#0f172a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold">JOINED (Start Date):</text>
      <text x="240" y="24" fill="#1d4ed8" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">15 March 2018</text>

      <text x="0" y="64" fill="#0f172a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold">TODAY (Reference):</text>
      <text x="240" y="64" fill="#1d4ed8" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">23 September 2026</text>
    </g>

    <!-- Step by Step Decomposition -->
    <g transform="translate(130, 190)">
      <text x="0" y="25" fill="#475569" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">STEP-BY-STEP CALENDAR BREAKDOWN:</text>

      <!-- Step 1 -->
      <text x="20" y="65" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="17">1) 15-03-2018 &#8594; 15-03-2026</text>
      <text x="340" y="65" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 8 Complete Years</text>
      <text x="590" y="65" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>

      <!-- Step 2 -->
      <text x="20" y="105" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="17">2) 15-03-2026 &#8594; 15-09-2026</text>
      <text x="340" y="105" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 6 Remaining Months</text>
      <text x="590" y="105" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>

      <!-- Step 3 -->
      <text x="20" y="145" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="17">3) 15-09-2026 &#8594; 23-09-2026</text>
      <text x="340" y="145" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 8 Remaining Days</text>
      <text x="590" y="145" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>
    </g>

    <!-- Final Result Box with Hand-Drawn Circled Ink -->
    <g transform="translate(130, 370)">
      <rect x="0" y="0" width="670" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="30" y="42" fill="#1e40af" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">TOTAL SERVICE TENURE:</text>
      <text x="30" y="75" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="28" font-weight="bold">8 Years, 6 Months, 8 Days</text>

      <!-- Hand-drawn style circle oval around "EXACT CALENDAR SERVICE" -->
      <g transform="translate(420, 15)">
        <ellipse cx="105" cy="30" rx="100" ry="26" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="250 8" transform="rotate(-3 105 30)" />
        <ellipse cx="107" cy="32" rx="98" ry="24" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" transform="rotate(-2 105 30)" />
        <text x="105" y="28" fill="#b91c1c" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EXACT CALENDAR</text>
        <text x="105" y="46" fill="#b91c1c" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SERVICE</text>
      </g>
    </g>

    <!-- Footnote on Notebook -->
    <g transform="translate(130, 490)">
      <text x="0" y="20" fill="#047857" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold">&#10003; 100% Calendar Accurate (Not approximated as 3,114 &#247; 365)</text>
      <text x="0" y="44" fill="#64748b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="13">Decimal Equiv = 8.53 Years &#8226; Next Anniv = 15-03-2027 (9 Years)</text>
    </g>

    <!-- Yellow Sticky Note Overlapping Page -->
    <g transform="translate(640, 95) rotate(4)" filter="url(#sticky-shadow)">
      <rect width="180" height="150" rx="3" fill="#fef08a" stroke="#fde047" stroke-width="1" />
      <path d="M0,0 L30,0 L0,30 Z" fill="#eab308" opacity="0.3" />
      <text x="90" y="30" fill="#854d0e" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&#128204; HR CHECKLIST</text>
      <text x="15" y="60" fill="#713f12" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="12">&#10003; 5-Yr Vesting: Passed</text>
      <text x="15" y="85" fill="#713f12" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="12">&#10003; Gratuity Met (5+ Yrs)</text>
      <text x="15" y="110" fill="#713f12" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="12">&#8594; Next: 10-Yr Sabbatical</text>
      <text x="15" y="130" fill="#b45309" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="11" font-style="italic">(In 1.47 years)</text>
    </g>
  </g>
</svg>