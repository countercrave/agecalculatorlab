<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Computer Vision Facial Landmark Mesh Analysis">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF9"/>
      <stop offset="100%" stop-color="#F4F8F5"/>
    </linearGradient>
    <filter id="visSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B233A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#visBg)"/>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#52796F" letter-spacing="1.2">COMPUTER VISION ARCHITECTURE</text>
    <text x="0" y="68" font-family="'Fraunces', Georgia, serif" font-size="36" font-weight="700" fill="#0B233A">How Algorithms Identify Visible Facial Features</text>
    <text x="0" y="98" font-family="'Inter', sans-serif" font-size="16" fill="#4A635A">Geometric landmark mapping, skin tone variance, and texture gradient extraction</text>
  </g>

  <!-- Left: Face Landmark Mesh Diagram -->
  <g transform="translate(80, 160)" filter="url(#visSh)">
    <rect width="520" height="440" rx="16" fill="#FFFFFF" stroke="#E2DDD0" stroke-width="1.5"/>

    <!-- Mesh Visualization -->
    <g transform="translate(260, 200)">
      <!-- Oval Contour -->
      <path d="M-90,-110 C-110,0 -80,100 0,140 C80,100 110,0 90,-110 C60,-140 -60,-140 -90,-110 Z" fill="#F4F8F5" stroke="#075433" stroke-width="2"/>
      
      <!-- Triangular Mesh Lines across face -->
      <g stroke="#9FE7BD" stroke-width="1" opacity="0.8">
        <line x1="-90" y1="-110" x2="-40" y2="-70"/>
        <line x1="-40" y1="-70" x2="0" y2="-120"/>
        <line x1="0" y1="-120" x2="40" y2="-70"/>
        <line x1="40" y1="-70" x2="90" y2="-110"/>

        <line x1="-40" y1="-70" x2="-40" y2="-30"/>
        <line x1="40" y1="-70" x2="40" y2="-30"/>
        <line x1="-40" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="40" y2="-30"/>

        <line x1="-40" y1="-30" x2="0" y2="15"/>
        <line x1="40" y1="-30" x2="0" y2="15"/>
        <line x1="-80" y1="0" x2="-40" y2="-30"/>
        <line x1="80" y1="0" x2="40" y2="-30"/>

        <line x1="-80" y1="0" x2="-35" y2="60"/>
        <line x1="80" y1="0" x2="35" y2="60"/>
        <line x1="-35" y1="60" x2="0" y2="15"/>
        <line x1="35" y1="60" x2="0" y2="15"/>

        <line x1="-35" y1="60" x2="0" y2="75"/>
        <line x1="35" y1="60" x2="0" y2="75"/>
        <line x1="-35" y1="60" x2="0" y2="140"/>
        <line x1="35" y1="60" x2="0" y2="140"/>
      </g>

      <!-- Key Facial Points -->
      <circle cx="-40" cy="-30" r="5" fill="#075433"/>
      <circle cx="40" cy="-30" r="5" fill="#075433"/>
      <circle cx="0" cy="15" r="5" fill="#FF754D"/>
      <circle cx="0" cy="75" r="5" fill="#FF754D"/>
      <circle cx="-35" cy="60" r="4" fill="#0B233A"/>
      <circle cx="35" cy="60" r="4" fill="#0B233A"/>
      <circle cx="0" cy="140" r="5" fill="#075433"/>
    </g>

    <!-- Overlay Tag -->
    <g transform="translate(30, 24)">
      <rect width="180" height="26" rx="6" fill="#F4F8F5" stroke="#D3E5DE"/>
      <text x="90" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#075433" text-anchor="middle">68 FACIAL LANDMARKS</text>
    </g>

    <text x="260" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#52796F" text-anchor="middle">Figure: Normalized landmark mesh capturing facial symmetry and contours</text>
  </g>

  <!-- Right: 3 Key Metric Breakdown Cards -->
  <g transform="translate(630, 160)" filter="url(#visSh)">
    <rect width="490" height="440" rx="16" fill="#FFFFFF" stroke="#E2DDD0" stroke-width="1.5"/>

    <g transform="translate(32, 32)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#52796F" letter-spacing="1.2">ESTIMATION VARIABLES</text>
      <text x="0" y="48" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700" fill="#0B233A">Three Visual Signals Examined</text>

      <!-- Metric 1: Skin Texture &amp; Contrast -->
      <g transform="translate(0, 75)">
        <rect width="426" height="85" rx="10" fill="#F4F8F5" stroke="#D3E5DE"/>
        <text x="20" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">1. Skin Smoothness &amp; Gradient Magnitude</text>
        <text x="20" y="54" font-family="'Inter', sans-serif" font-size="12" fill="#4A635A">Analyzes fine lines, furrow depth, and epidermal texture</text>
        <text x="20" y="72" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#0B233A">Sobel filter high-frequency edge density score</text>
      </g>

      <!-- Metric 2: Midface Volume &amp; Contours -->
      <g transform="translate(0, 175)">
        <rect width="426" height="85" rx="10" fill="#FFFDFB" stroke="#FF754D" stroke-width="1.5"/>
        <text x="20" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FF754D">2. Facial Geometry &amp; Soft-Tissue Volume</text>
        <text x="20" y="54" font-family="'Inter', sans-serif" font-size="12" fill="#4A635A">Cheekbone elevation, jawline firmness, and eye spacing</text>
        <text x="20" y="72" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#0B233A">Proportion ratios normalized against anthropometry data</text>
      </g>

      <!-- Metric 3: Lighting &amp; Angle Calibration -->
      <g transform="translate(0, 275)">
        <rect width="426" height="85" rx="10" fill="#F4F8F5" stroke="#D3E5DE"/>
        <text x="20" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">3. Lighting Consistency &amp; Yaw/Pitch Correction</text>
        <text x="20" y="54" font-family="'Inter', sans-serif" font-size="12" fill="#4A635A">Filters out harsh overhead shadows and directional glare</text>
        <text x="20" y="72" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#0B233A">Generates dynamic confidence range (e.g. ±3 years)</text>
      </g>
    </g>
  </g>
</svg>