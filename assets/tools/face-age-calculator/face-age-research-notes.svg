<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Calibrated Research Audit Worksheet for Face Age Estimation">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#DFD9CE"/>
    </linearGradient>
    <filter id="noteShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#deskBg)"/>

  <!-- Printed Portrait Card (Left Desk) -->
  <g transform="translate(65, 70) rotate(-2.5)" filter="url(#noteShadow)">
    <rect width="320" height="440" rx="12" fill="#FFFFFF" stroke="#D3CABE" stroke-width="1.5"/>
    
    <!-- Photo Mat -->
    <rect x="25" y="25" width="270" height="310" rx="4" fill="#F4F8F5" stroke="#CBD5E1"/>
    
    <!-- Face Silhouette on Mat -->
    <ellipse cx="160" cy="165" rx="65" ry="92" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="135" cy="145" r="7" fill="#64748B"/>
    <circle cx="185" cy="145" r="7" fill="#64748B"/>
    <path d="M160,145 L160,180 L168,180" stroke="#64748B" stroke-width="2" fill="none"/>
    <path d="M140,210 Q160,225 180,210" stroke="#64748B" stroke-width="2" fill="none"/>

    <!-- Callout 1: Periorbital lines -->
    <path d="M85,128 L125,142" stroke="#EF4444" stroke-width="1.8" fill="none"/>
    <circle cx="125" cy="142" r="3" fill="#EF4444"/>
    <rect x="28" y="112" width="76" height="22" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="66" y="127" font-family="'Inter', sans-serif" font-size="11" font-weight="750" fill="#991B1B" text-anchor="middle">Periorbital</text>

    <!-- Callout 2: Smile lines -->
    <path d="M232,216 L182,212" stroke="#EF4444" stroke-width="1.8" fill="none"/>
    <circle cx="182" cy="212" r="3" fill="#EF4444"/>
    <rect x="216" y="206" width="76" height="22" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="254" y="221" font-family="'Inter', sans-serif" font-size="11" font-weight="750" fill="#991B1B" text-anchor="middle">Smile lines</text>

    <!-- Photo Label -->
    <text x="160" y="372" font-family="'Inter', sans-serif" font-size="13" font-weight="750" fill="#0B233A" text-anchor="middle">Subject A · Neutral Studio Light</text>
    <text x="160" y="394" font-family="'Inter', monospace" font-size="11.5" fill="#64748B" text-anchor="middle">1080×1350px · Front-Facing</text>
  </g>

  <!-- Open Research Journal (Center-Right Desk) -->
  <g transform="translate(425, 48)" filter="url(#noteShadow)">
    <rect width="720" height="578" rx="16" fill="#FDFCF7" stroke="#D8D2C4" stroke-width="2"/>
    
    <!-- Red Margin Line -->
    <line x1="72" y1="28" x2="72" y2="550" stroke="#F87171" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Ruled lines (58px intervals) -->
    <g stroke="#E6E0D4" stroke-width="1">
      <line x1="72" y1="102" x2="685" y2="102"/>
      <line x1="72" y1="160" x2="685" y2="160"/>
      <line x1="72" y1="218" x2="685" y2="218"/>
      <line x1="72" y1="276" x2="685" y2="276"/>
      <line x1="72" y1="334" x2="685" y2="334"/>
      <line x1="72" y1="392" x2="685" y2="392"/>
      <line x1="72" y1="450" x2="685" y2="450"/>
      <line x1="72" y1="508" x2="685" y2="508"/>
    </g>

    <!-- Journal Header -->
    <text x="96" y="60" font-family="'Fraunces', Georgia, serif" font-size="23" font-weight="700" fill="#042F2A">Face Age Estimation Audit Notes</text>
    <text x="96" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="750" fill="#52796F" letter-spacing="0.8">CALIBRATED SAMPLE PORTRAIT EVALUATION · AGE CALCULATOR LAB</text>

    <!-- Row 1: Chronological Age -->
    <text x="96" y="138" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#075433" letter-spacing="0.5">01 · CHRONOLOGICAL AGE</text>
    <text x="325" y="138" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#0B233A">Subject actual age = 38 (Date of Birth)</text>

    <!-- Row 2: Lighting &amp; Exposure Test -->
    <text x="96" y="196" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#075433" letter-spacing="0.5">02 · LIGHTING &amp; EXPOSURE</text>
    <text x="325" y="196" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#0B233A">Diffuse light softens shadows (−3 yrs perceived)</text>

    <!-- Row 3: Texture &amp; Edge Gradient -->
    <text x="96" y="254" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#075433" letter-spacing="0.5">03 · TEXTURE GRADIENT</text>
    <text x="325" y="254" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#0B233A">Low midface frequency gradient (youthful volume)</text>

    <!-- Row 4: Estimated Apparent Age -->
    <text x="96" y="312" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#C2410C" letter-spacing="0.5">04 · ESTIMATED APPARENT</text>
    <text x="325" y="312" font-family="'Inter', sans-serif" font-size="17" font-weight="850" fill="#042F2A">34 years</text>
    <rect x="415" y="293" width="118" height="26" rx="6" fill="#075433"/>
    <text x="474" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#9FE7BD" text-anchor="middle" letter-spacing="0.6">RANGE: 31–37</text>

    <!-- Row 5: Difference from Actual -->
    <text x="96" y="370" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#075433" letter-spacing="0.5">05 · DIFFERENCE FROM ACTUAL</text>
    <text x="325" y="370" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#C2410C">−4 years (Appears 4 years younger)</text>

    <!-- Row 6: Privacy Verification -->
    <text x="96" y="428" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#075433" letter-spacing="0.5">06 · PRIVACY VERIFICATION</text>
    <text x="325" y="428" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#0B233A">Client-side only. Zero cloud transfers.</text>

    <!-- Row 7: Core Principle -->
    <text x="96" y="486" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#52796F" letter-spacing="0.5">07 · CORE PRINCIPLE</text>
    <text x="325" y="486" font-family="'Inter', sans-serif" font-size="13.5" fill="#4A635A">Appearance estimate only. Not biological age.</text>

    <!-- Privacy Stamp -->
    <g transform="translate(450, 508) rotate(-3)">
      <rect width="210" height="38" rx="6" fill="#F4F8F5" stroke="#075433" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="105" y="24" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#075433" text-anchor="middle" letter-spacing="1.2">CLIENT PRIVACY VERIFIED</text>
    </g>
  </g>
</svg>