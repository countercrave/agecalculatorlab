<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Handwritten Research Desk Visual for Face Age Estimation">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#DFD9CE"/>
    </linearGradient>
    <filter id="noteShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#deskBg)"/>

  <!-- Printed Portrait Card (Left Desk) -->
  <g transform="translate(80, 80) rotate(-3)" filter="url(#noteShadow)">
    <rect width="320" height="420" rx="10" fill="#FFFFFF" stroke="#D3CABE" stroke-width="1.5"/>
    
    <!-- Photo Mat -->
    <rect x="25" y="25" width="270" height="300" fill="#F4F8F5" stroke="#CBD5E1"/>
    
    <!-- Face Silhouette on Mat -->
    <ellipse cx="160" cy="160" rx="65" ry="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="135" cy="140" r="8" fill="#64748B"/>
    <circle cx="185" cy="140" r="8" fill="#64748B"/>
    <path d="M160,140 L160,175 L168,175" stroke="#64748B" stroke-width="2" fill="none"/>
    <path d="M140,205 Q160,220 180,205" stroke="#64748B" stroke-width="2" fill="none"/>

    <!-- Handwritten Arrows on Photo -->
    <path d="M70,120 Q100,130 125,138" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="35" y="115" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="700" fill="#B91C1C">Periorbital</text>

    <path d="M250,210 Q215,215 185,210" stroke="#EF4444" stroke-width="2" fill="none"/>
    <text x="210" y="235" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="700" fill="#B91C1C">Smile lines</text>

    <!-- Photo Label -->
    <text x="160" y="360" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0B233A" text-anchor="middle">Subject A · Neutral Studio Light</text>
    <text x="160" y="382" font-family="'Inter', monospace" font-size="11.5" fill="#64748B" text-anchor="middle">1080×1350px · Front-Facing</text>
  </g>

  <!-- Open Research Journal (Center-Right Desk) -->
  <g transform="translate(440, 50)" filter="url(#noteShadow)">
    <rect width="700" height="575" rx="16" fill="#FDFCF7" stroke="#D8D2C4" stroke-width="2"/>
    
    <!-- Red Margin Line -->
    <line x1="80" y1="30" x2="80" y2="545" stroke="#F87171" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Ruled lines -->
    <g stroke="#E2DDD0" stroke-width="1">
      <line x1="80" y1="90" x2="660" y2="90"/>
      <line x1="80" y1="145" x2="660" y2="145"/>
      <line x1="80" y1="200" x2="660" y2="200"/>
      <line x1="80" y1="255" x2="660" y2="255"/>
      <line x1="80" y1="310" x2="660" y2="310"/>
      <line x1="80" y1="365" x2="660" y2="365"/>
      <line x1="80" y1="420" x2="660" y2="420"/>
      <line x1="80" y1="475" x2="660" y2="475"/>
      <line x1="80" y1="530" x2="660" y2="530"/>
    </g>

    <!-- Title -->
    <text x="105" y="72" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" fill="#0B233A">Face Age Estimation Audit Notes — Age Calculator Lab</text>

    <!-- Note 1 -->
    <text x="105" y="128" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#075433">1. Chronological vs Apparent Age:</text>
    <text x="360" y="128" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#0B233A">Subject actual age = 38 (Date of Birth)</text>

    <!-- Note 2 -->
    <text x="105" y="183" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#075433">2. Lighting &amp; Exposure Test:</text>
    <text x="360" y="183" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#0B233A">Diffuse light softens shadows (-3 yrs perceived)</text>

    <!-- Note 3 -->
    <text x="105" y="238" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#075433">3. Texture &amp; Edge Gradient:</text>
    <text x="360" y="238" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#0B233A">Low midface frequency gradient (youthful volume)</text>

    <!-- Note 4 -->
    <text x="105" y="293" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#FF754D">4. Estimated Apparent Age:</text>
    <text x="360" y="293" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#042F2A">34 years </text>
    <rect x="440" y="270" width="120" height="32" rx="6" fill="#075433"/>
    <text x="500" y="292" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#9FE7BD" text-anchor="middle">RANGE: 31–37</text>

    <!-- Note 5 -->
    <text x="105" y="348" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#075433">5. Difference from Actual:</text>
    <text x="360" y="348" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FF754D">−4 years (Appears 4 years younger)</text>

    <!-- Note 6 -->
    <text x="105" y="403" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#075433">6. Privacy Verification:</text>
    <text x="360" y="403" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#0B233A">Client-side only. Zero cloud transfers.</text>

    <!-- Note 7 -->
    <text x="105" y="458" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#0B233A">7. Core Principle:</text>
    <text x="360" y="458" font-family="'Inter', sans-serif" font-size="14.5" fill="#4A635A">Appearance estimate only. Not biological age.</text>

    <!-- Stamp -->
    <g transform="translate(480, 480) rotate(-5)">
      <rect width="180" height="42" rx="6" fill="none" stroke="#075433" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="90" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#075433" text-anchor="middle" letter-spacing="1.5">CLIENT PRIVACY VERIFIED</text>
    </g>
  </g>
</svg>