<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="8" stdDeviation="12" flood-color="#3A3022" flood-opacity="0.2"/>
    </filter>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Wooden Desk Background -->
  <rect width="800" height="600" fill="#F3EFEA"/>
  <!-- Warm wood texture tone -->
  <rect width="800" height="600" fill="#D8CAB8" opacity="0.25"/>

  <!-- Ruler on desk -->
  <g transform="translate(60, 40) rotate(-6)">
    <rect width="680" height="34" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1" opacity="0.85" filter="url(#deskShadow)"/>
    <line x1="50" y1="40" x2="50" y2="52" stroke="#92400E" stroke-width="1"/>
    <line x1="100" y1="40" x2="100" y2="58" stroke="#92400E" stroke-width="1.5"/>
    <line x1="150" y1="40" x2="150" y2="52" stroke="#92400E" stroke-width="1"/>
    <line x1="200" y1="40" x2="200" y2="58" stroke="#92400E" stroke-width="1.5"/>
    <line x1="250" y1="40" x2="250" y2="52" stroke="#92400E" stroke-width="1"/>
    <line x1="300" y1="40" x2="300" y2="58" stroke="#92400E" stroke-width="1.5"/>
    <line x1="350" y1="40" x2="350" y2="52" stroke="#92400E" stroke-width="1"/>
    <line x1="400" y1="40" x2="400" y2="58" stroke="#92400E" stroke-width="1.5"/>
    <line x1="450" y1="40" x2="450" y2="52" stroke="#92400E" stroke-width="1"/>
    <line x1="500" y1="50" x2="500" y2="58" stroke="#92400E" stroke-width="1.5"/>
  </g>

  <!-- Open Spiral Study Notebook -->
  <g transform="translate(90, 80)" filter="url(#deskShadow)">
    <!-- Base Page Paper -->
    <rect width="620" height="470" rx="6" fill="#FFFFFF" stroke="#D5D0C7" stroke-width="1"/>
    <rect width="620" height="470" rx="6" fill="url(#gridPattern)"/>

    <!-- Left Margin Red Line -->
    <line x1="90" y1="0" x2="90" y2="470" stroke="#F87171" stroke-width="1.5" opacity="0.6"/>

    <!-- Spiral Rings on Left edge -->
    <g fill="#475569">
      <rect x="-8" y="40" width="16" height="6" rx="3"/>
      <rect x="-8" y="90" width="16" height="6" rx="3"/>
      <rect x="-8" y="140" width="16" height="6" rx="3"/>
      <rect x="-8" y="190" width="16" height="6" rx="3"/>
      <rect x="-8" y="240" width="16" height="6" rx="3"/>
      <rect x="-8" y="290" width="16" height="6" rx="3"/>
      <rect x="-8" y="340" width="16" height="6" rx="3"/>
      <rect x="-8" y="390" width="16" height="6" rx="3"/>
      <rect x="-8" y="430" width="16" height="6" rx="3"/>
    </g>

    <!-- Handwritten Heading -->
    <text x="120" y="55" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#0F172A">SSC CGL 2026 — AGE CHECK</text>
    <line x1="120" y1="65" x2="460" y2="65" stroke="#0F172A" stroke-width="2"/>

    <!-- Highlighted Note Box -->
    <rect x="120" y="85" width="460" height="34" rx="4" fill="#FEF08A" opacity="0.7"/>
    <text x="135" y="107" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#854D0E">RULE: Use 10th/Matriculation Certificate DOB only!</text>

    <!-- Work Sheet Lines & Data -->
    <text x="120" y="155" font-family="'Courier New', monospace" font-size="16" fill="#334155">1. Candidate DOB:</text>
    <text x="320" y="155" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#1E40AF">12 / 07 / 1999</text>

    <text x="120" y="195" font-family="'Courier New', monospace" font-size="16" fill="#334155">2. Age Crucial Date:</text>
    <text x="320" y="195" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#1E40AF">01 / 08 / 2026</text>

    <text x="120" y="235" font-family="'Courier New', monospace" font-size="16" fill="#334155">3. Calculated Age:</text>
    <text x="320" y="235" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#059669">27 Years, 20 Days ✓</text>

    <line x1="120" y1="260" x2="570" y2="260" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="120" y="295" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#0F172A">4. Post-Wise Verification Matrix:</text>

    <!-- Table in notebook -->
    <g transform="translate(120, 310)">
      <rect width="450" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4"/>
      <line x1="0" y1="30" x2="450" y2="30" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="120" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="330" y1="0" x2="330" y2="120" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Headers -->
      <text x="15" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#475569">POST CADRE</text>
      <text x="215" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#475569">AGE BAND</text>
      <text x="345" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#475569">STATUS</text>

      <!-- Row 1 -->
      <text x="15" y="52" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">Auditor / Accountant</text>
      <text x="215" y="52" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">18–27 Yrs</text>
      <text x="345" y="52" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#DC2626">❌ Overage (UR)</text>

      <!-- Row 2 -->
      <text x="15" y="80" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">ASO / CBI Sub-Insp.</text>
      <text x="215" y="80" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">20–30 Yrs</text>
      <text x="345" y="80" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#16A34A">✓ Eligible</text>

      <!-- Row 3 -->
      <text x="15" y="108" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">Inspector (Excise/IT)</text>
      <text x="215" y="108" font-family="'Courier New', monospace" font-size="13" fill="#1E293B">18–30 Yrs</text>
      <text x="345" y="108" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#16A34A">✓ Eligible</text>
    </g>
  </g>

  <!-- Pen resting on notebook -->
  <g transform="translate(630, 220) rotate(22)">
    <rect width="14" height="240" rx="7" fill="#0284C7" filter="url(#deskShadow)"/>
    <rect x="2" y="30" width="10" height="15" fill="#E2E8F0"/>
    <polygon points="7,255 2,240 12,240" fill="#94A3B8"/>
    <circle cx="7" cy="256" r="1.5" fill="#0F172A"/>
  </g>
</svg>