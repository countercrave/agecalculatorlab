<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="corridorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#winBg)"/>

  <!-- Title Block -->
  <g transform="translate(100, 75)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="1.5">DOB ELIGIBILITY CORRIDOR CONCEPT</text>
    <text x="0" y="34" font-family="'Fraunces', Georgia, serif" font-size="32" font-weight="700" fill="#FFFFFF">How SSC CGL Converts Age Limits into DOB Windows</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="15" fill="#94A3B8">Official SSC notices specify cutoff birth dates rather than simple year math to eliminate ambiguity</text>
  </g>

  <!-- 4 Horizontal Bands Visualization -->
  <!-- Band 1: 18-27 Years -->
  <g transform="translate(100, 190)">
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">BAND 1: 18–27 YRS (Auditor, Accountant, Tax Assistant)</text>
    <rect x="0" y="35" width="1000" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- In-range corridor: 02-08-1999 to 01-08-2008 -->
    <rect x="360" y="35" width="480" height="42" rx="6" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.5"/>
    
    <text x="360" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">02-AUG-1999</text>
    <text x="840" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="end">01-AUG-2008</text>
    <text x="600" y="61" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">ELIGIBLE DOB WINDOW (9 YEARS)</text>
  </g>

  <!-- Band 2: 20-30 Years -->
  <g transform="translate(100, 305)">
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">BAND 2: 20–30 YRS (Assistant Section Officer - CSS, IB, MEA, CBI)</text>
    <rect x="0" y="35" width="1000" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- In-range corridor: 02-08-1996 to 01-08-2006 -->
    <rect x="230" y="35" width="500" height="42" rx="6" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.5"/>
    
    <text x="230" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#60A5FA">02-AUG-1996</text>
    <text x="730" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="end">01-AUG-2006</text>
    <text x="480" y="61" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="middle">ELIGIBLE DOB WINDOW (10 YEARS)</text>
  </g>

  <!-- Band 3: 18-30 Years -->
  <g transform="translate(100, 420)">
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">BAND 3: 18–30 YRS (Inspector Income Tax, Central Excise, Preventive)</text>
    <rect x="0" y="35" width="1000" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- In-range corridor: 02-08-1996 to 01-08-2008 -->
    <rect x="230" y="35" width="610" height="42" rx="6" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="1.5"/>
    
    <text x="230" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#A78BFA">02-AUG-1996</text>
    <text x="840" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="end">01-AUG-2008</text>
    <text x="535" y="61" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">ELIGIBLE DOB WINDOW (12 YEARS)</text>
  </g>

  <!-- Band 4: 18-32 Years -->
  <g transform="translate(100, 535)">
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">BAND 4: 18–32 YRS (Junior Statistical Officer - JSO)</text>
    <rect x="0" y="35" width="1000" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- In-range corridor: 02-08-1994 to 01-08-2008 -->
    <rect x="140" y="35" width="700" height="42" rx="6" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
    
    <text x="140" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#FBBF24">02-AUG-1994</text>
    <text x="840" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="end">01-AUG-2008</text>
    <text x="490" y="61" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">ELIGIBLE DOB WINDOW (14 YEARS)</text>
  </g>
</svg>