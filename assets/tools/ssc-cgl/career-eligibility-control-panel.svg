<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="50%" stop-color="#06483E"/>
      <stop offset="100%" stop-color="#03231F"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#085044"/>
      <stop offset="100%" stop-color="#053B32"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Header Branding / Subtitle -->
  <g transform="translate(80, 55)">
    <rect width="180" height="28" rx="14" fill="#0A5F50" stroke="#127866" stroke-width="1"/>
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#A9EAD1" text-anchor="middle" letter-spacing="1">CRUCIAL DATE SYSTEM</text>
    
    <text x="0" y="70" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">SSC CGL Career Eligibility Control Panel</text>
    <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94A3B8">Post-Specific Age Reckoning &amp; Statutory Reservation Mapping (01 August 2026)</text>
  </g>

  <!-- Main Dashboard Card -->
  <rect x="80" y="180" width="1040" height="430" rx="16" fill="url(#cardGrad)" stroke="#0F6E5E" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Status Bar in Card -->
  <rect x="80" y="180" width="1040" height="54" rx="16" fill="#063E34"/>
  <rect x="80" y="222" width="1040" height="12" fill="#063E34"/>
  <circle cx="115" cy="207" r="6" fill="#EF4444"/>
  <circle cx="135" cy="207" r="6" fill="#F59E0B"/>
  <circle cx="155" cy="207" r="6" fill="#10B981"/>
  <text x="180" y="212" font-family="monospace" font-size="13" fill="#64748B">SESSION: SSC_CGL_2026 // RECKONING_STANDARD: 01-08-2026</text>
  
  <rect x="940" y="193" width="155" height="28" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <text x="1017" y="211" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">OFFICIAL NOTIFICATION</text>

  <!-- 3 Inner Metric Panels -->
  <!-- Panel 1: Candidate Input Profile -->
  <g transform="translate(115, 260)">
    <rect width="280" height="160" rx="12" fill="#0E2239" stroke="#1F3C60" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" letter-spacing="1">CANDIDATE DOSSIER</text>
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Matriculation DOB:</text>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">15 June 1999</text>
    <line x1="20" y1="108" x2="260" y2="108" stroke="#1E385B" stroke-width="1"/>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Reckoning Date: <tspan font-weight="600" fill="#CBD5E1">01 August 2026</tspan></text>
    <text x="20" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Category: <tspan font-weight="600" fill="#FBBF24">OBC (NCL) — Relaxed</tspan></text>
  </g>

  <!-- Panel 2: Computed Chronology -->
  <g transform="translate(425, 260)">
    <rect width="320" height="160" rx="12" fill="#0E2239" stroke="#1F3C60" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1">EXACT RECKONED AGE</text>
    <text x="20" y="80" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="700" fill="#10B981">27 <tspan font-size="18" font-family="sans-serif" font-weight="400" fill="#94A3B8">YRS</tspan> 01 <tspan font-size="18" font-family="sans-serif" font-weight="400" fill="#94A3B8">MO</tspan> 17 <tspan font-size="18" font-family="sans-serif" font-weight="400" fill="#94A3B8">DAYS</tspan></text>
    <line x1="20" y1="108" x2="300" y2="108" stroke="#1E385B" stroke-width="1"/>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Selected Post: <tspan font-weight="600" fill="#FFFFFF">Inspector (Central Excise)</tspan></text>
    <text x="20" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Standard Post Band: <tspan font-weight="600" fill="#A9EAD1">18–30 Years</tspan></text>
  </g>

  <!-- Panel 3: Eligibility Verdict -->
  <g transform="translate(775, 260)">
    <rect width="315" height="160" rx="12" fill="#093527" stroke="#059669" stroke-width="1.5"/>
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#064E3B"/>
    <text x="85" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">✓ AGE ELIGIBLE</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#A7F3D0">Effective Max Limit:</text>
    <text x="20" y="105" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#FFFFFF">33 Years <tspan font-size="14" font-family="sans-serif" font-weight="400" fill="#6EE7B7">(30 + 3y OBC)</tspan></text>
    <line x1="20" y1="118" x2="295" y2="118" stroke="#065F46" stroke-width="1"/>
    <text x="20" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">Remaining Margin: 5 Yrs 10 Mos</text>
  </g>

  <!-- Bottom Visual Range Meter in Dashboard -->
  <g transform="translate(115, 450)">
    <rect width="975" height="135" rx="12" fill="#0A1C30" stroke="#1A3554" stroke-width="1"/>
    <text x="25" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1">DYNAMIC DOB ELIGIBILITY WINDOW (BAND 18–30)</text>
    
    <!-- Scale Track -->
    <rect x="25" y="60" width="925" height="16" rx="8" fill="#1E293B"/>
    <!-- Eligible Corridor -->
    <rect x="180" y="60" width="650" height="16" rx="8" fill="url(#accentGrad)"/>
    
    <!-- Boundary Marker Min -->
    <line x1="180" y1="48" x2="180" y2="88" stroke="#FFFFFF" stroke-width="2"/>
    <text x="180" y="106" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">02-AUG-1993</text>
    <text x="180" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">(Max Age Cutoff - Relaxed)</text>

    <!-- Candidate Marker -->
    <circle cx="460" cy="68" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="460" y1="42" x2="460" y2="54" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="460,54 454,44 466,44" fill="#F59E0B"/>
    <text x="460" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FBBF24" text-anchor="middle">YOU ARE HERE (15-JUN-1999)</text>

    <!-- Boundary Marker Max -->
    <line x1="830" y1="48" x2="830" y2="88" stroke="#FFFFFF" stroke-width="2"/>
    <text x="830" y="106" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">01-AUG-2008</text>
    <text x="830" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">(Min Age Cutoff: 18 Yrs)</text>
  </g>
</svg>