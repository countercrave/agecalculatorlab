<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="relBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="100%" stop-color="#06483E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#095447"/>
      <stop offset="100%" stop-color="#053B32"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#relBg)"/>

  <!-- Title Group -->
  <g transform="translate(100, 70)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="1.5">RESERVATION ARCHITECTURE</text>
    <text x="0" y="34" font-family="'Fraunces', Georgia, serif" font-size="32" font-weight="700" fill="#FFFFFF">Statutory Upper-Age Relaxation Matrix</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="15" fill="#A9EAD1">Government of India DoPT concessions mapped against standard SSC CGL post ceilings</text>
  </g>

  <!-- 3 Benchmark Cards: 18-27, 18-30, 18-32 -->
  
  <!-- Column 1: Band 1 (18-27 Posts) -->
  <g transform="translate(100, 175)" filter="url(#shadow)">
    <rect width="310" height="430" rx="14" fill="url(#cardGrad)" stroke="#0E6E5D" stroke-width="1.5"/>
    <rect width="310" height="48" rx="14" fill="#0A5A4D"/>
    <rect y="38" width="310" height="10" fill="#0A5A4D"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">18–27 Post Cadres</text>
    <text x="290" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#FF9A77" text-anchor="end">BASE: 27 YRS</text>

    <!-- Subcategories -->
    <g transform="translate(20, 70)" font-family="system-ui, sans-serif">
      <!-- UR/EWS -->
      <rect width="270" height="52" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#FFFFFF">UR / EWS</text>
      <text x="14" y="42" font-size="11" fill="#A9EAD1">No age concession</text>
      <text x="256" y="32" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">27 Yrs</text>

      <!-- OBC -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#34D399">OBC (Non-Creamy)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+3 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#34D399" text-anchor="end">30 Yrs</text>
      </g>

      <!-- SC/ST -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#60A5FA">SC / ST</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+5 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="end">32 Yrs</text>
      </g>

      <!-- PwBD -->
      <g transform="translate(0, 186)">
        <rect width="270" height="52" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#C084FC">PwBD (UR / OBC / SC)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+10 to +15 Years</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#C084FC" text-anchor="end">37–42 Yrs</text>
      </g>

      <!-- ESM -->
      <g transform="translate(0, 248)">
        <rect width="270" height="52" rx="8" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#FBBF24">Ex-Servicemen</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">Service Deduct + 3y</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="end">Adjusted</text>
      </g>

      <!-- Central Civilian -->
      <g transform="translate(0, 310)">
        <rect width="270" height="34" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="14" y="22" font-size="11" fill="#A9EAD1">Civilian Employees (3y Serv): Up to 40y</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Band 2 & 3 (18/20–30 Posts) -->
  <g transform="translate(445, 175)" filter="url(#shadow)">
    <rect width="310" height="430" rx="14" fill="url(#cardGrad)" stroke="#0E6E5D" stroke-width="1.5"/>
    <rect width="310" height="48" rx="14" fill="#0A5A4D"/>
    <rect y="38" width="310" height="10" fill="#0A5A4D"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">18/20–30 Posts (ASO/IT/Excise)</text>
    <text x="290" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#FF9A77" text-anchor="end">BASE: 30 YRS</text>

    <!-- Subcategories -->
    <g transform="translate(20, 70)" font-family="system-ui, sans-serif">
      <!-- UR/EWS -->
      <rect width="270" height="52" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#FFFFFF">UR / EWS</text>
      <text x="14" y="42" font-size="11" fill="#A9EAD1">Standard ceiling</text>
      <text x="256" y="32" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">30 Yrs</text>

      <!-- OBC -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#34D399">OBC (Non-Creamy)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+3 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#34D399" text-anchor="end">33 Yrs</text>
      </g>

      <!-- SC/ST -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#60A5FA">SC / ST</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+5 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="end">35 Yrs</text>
      </g>

      <!-- PwBD -->
      <g transform="translate(0, 186)">
        <rect width="270" height="52" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#C084FC">PwBD (UR / OBC / SC)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+10 to +15 Years</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#C084FC" text-anchor="end">40–45 Yrs</text>
      </g>

      <!-- ESM -->
      <g transform="translate(0, 248)">
        <rect width="270" height="52" rx="8" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#FBBF24">Ex-Servicemen</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">Service Deduct + 3y</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="end">Adjusted</text>
      </g>

      <!-- Central Civilian -->
      <g transform="translate(0, 310)">
        <rect width="270" height="34" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="14" y="22" font-size="11" fill="#A9EAD1">DoPT Orders: Upper ceiling strictly enforced</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Band 4 (18-32 JSO Posts) -->
  <g transform="translate(790, 175)" filter="url(#shadow)">
    <rect width="310" height="430" rx="14" fill="url(#cardGrad)" stroke="#0E6E5D" stroke-width="1.5"/>
    <rect width="310" height="48" rx="14" fill="#0A5A4D"/>
    <rect y="38" width="310" height="10" fill="#0A5A4D"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">18–32 Posts (JSO - MoSPI)</text>
    <text x="290" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#FF9A77" text-anchor="end">BASE: 32 YRS</text>

    <!-- Subcategories -->
    <g transform="translate(20, 70)" font-family="system-ui, sans-serif">
      <!-- UR/EWS -->
      <rect width="270" height="52" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#FFFFFF">UR / EWS</text>
      <text x="14" y="42" font-size="11" fill="#A9EAD1">Highest general ceiling</text>
      <text x="256" y="32" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">32 Yrs</text>

      <!-- OBC -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="8" fill="rgba(160,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#34D399">OBC (Non-Creamy)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+3 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#34D399" text-anchor="end">35 Yrs</text>
      </g>

      <!-- SC/ST -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#60A5FA">SC / ST</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+5 Years Statutory</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="end">37 Yrs</text>
      </g>

      <!-- PwBD -->
      <g transform="translate(0, 186)">
        <rect width="270" height="52" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#C084FC">PwBD (UR / OBC / SC)</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">+10 to +15 Years</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#C084FC" text-anchor="end">42–47 Yrs</text>
      </g>

      <!-- ESM -->
      <g transform="translate(0, 248)">
        <rect width="270" height="52" rx="8" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
        <text x="14" y="24" font-size="12" font-weight="700" fill="#FBBF24">Ex-Servicemen</text>
        <text x="14" y="42" font-size="11" fill="#A9EAD1">Service Deduct + 3y</text>
        <text x="256" y="32" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="end">Adjusted</text>
      </g>

      <!-- Central Civilian -->
      <g transform="translate(0, 310)">
        <rect width="270" height="34" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="14" y="22" font-size="11" fill="#A9EAD1">Statistical qualifications required</text>
      </g>
    </g>
  </g>
</svg>
