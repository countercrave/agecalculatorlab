<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Handwritten Race Result Analysis Sheet">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE"/>
      <stop offset="100%" stop-color="#ECE7DB"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="2" dy="14" stdDeviation="18" flood-color="#0B233A" flood-opacity="0.12"/>
    </filter>
    <filter id="bibShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="3" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Desk Surface Background -->
  <rect width="1200" height="675" fill="url(#deskBg)"/>

  <!-- Subtle Blueprint / Grid Mat Texture on Desk -->
  <g opacity="0.1" stroke="#52796F" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Race Bib in Top Right Corner (Angled) -->
  <g transform="translate(860, 45) rotate(4)" filter="url(#bibShadow)">
    <rect width="280" height="185" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Bib header -->
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#0B233A"/>
    <text x="140" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SPRING 10K CLASSIC</text>
    <!-- Bib number -->
    <text x="140" y="115" font-family="'Fraunces', serif" font-size="70" font-weight="900" fill="#075433" text-anchor="middle">542</text>
    <!-- Bib details -->
    <text x="140" y="150" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">DIVISION: M50–54 · WAVE 1</text>
    <!-- Safety pin circles -->
    <circle cx="20" cy="20" r="4" fill="#94A3B8"/>
    <circle cx="260" cy="20" r="4" fill="#94A3B8"/>
  </g>

  <!-- Printed Official Race Result Sheet (Center Stage) -->
  <g transform="translate(100, 60)" filter="url(#sheetShadow)">
    <rect width="720" height="555" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Sheet Header -->
    <g transform="translate(48, 48)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#64748B" letter-spacing="1.5">OFFICIAL CHIP TIMING RECORD</text>
      <text x="0" y="32" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#0B233A">Individual Finisher Breakdown</text>
      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="14" fill="#64748B">Event: City Metro 10K Championship · Distance: 10,000m Certified</text>
      
      <line x1="0" y1="80" x2="624" y2="80" stroke="#E2E8F0" stroke-width="1.5"/>
    </g>

    <!-- Race Summary Data Grid -->
    <g transform="translate(48, 160)">
      <!-- Row 1: Finishing Time -->
      <rect x="0" y="0" width="624" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748B">Net Finish Time:</text>
      <text x="200" y="38" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#0B233A">48:00.2</text>
      <text x="440" y="36" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Pace: 4:48 / km</text>

      <!-- Row 2: Age-Group Position (With Handwritten Highlight) -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="624" height="64" rx="8" fill="#FFFBF5" stroke="#FDE68A" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#B45309">Age-Group Ranking:</text>
        <text x="200" y="40" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#D97706">4th / 28</text>
        <text x="440" y="38" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#B45309">Category: M50–54</text>
      </g>

      <!-- Row 3: Age-Grade Percentage (With Green Highlight) -->
      <g transform="translate(0, 155)">
        <rect x="0" y="0" width="624" height="64" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">Age-Grade Percentage:</text>
        <text x="200" y="40" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#075433">72.45%</text>
        <text x="440" y="38" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#075433">Standard: Regional Class</text>
      </g>

      <!-- Row 4: Overall Finish -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="624" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="24" y="33" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#64748B">Overall Field Position:</text>
        <text x="200" y="35" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#0B233A">142 of 850 Total Entrants</text>
        <text x="440" y="33" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Top 16.7% of Event</text>
      </g>
    </g>

    <!-- Printed Footer Note -->
    <text x="48" y="505" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Chip timing verified by certified electro-magnetic sensor mats · WMA Demographic Factor 0.8694</text>
  </g>

  <!-- HANDWRITTEN COACH / ANALYST ANNOTATIONS LAYER -->
  
  <!-- Hand-drawn Oval around Age Group Rank -->
  <g transform="translate(290, 310)">
    <ellipse cx="60" cy="5" rx="85" ry="24" fill="none" stroke="#FF754D" stroke-width="2.5" stroke-dasharray="2,1" transform="rotate(-3, 60, 5)"/>
  </g>

  <!-- Annotation Note 1 pointing to Age-Group: Coral / Orange -->
  <g transform="translate(860, 275)">
    <!-- Curving Arrow -->
    <path d="M-20,40 C-80,45 -120,42 -145,35" fill="none" stroke="#FF754D" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <rect x="0" y="0" width="280" height="95" rx="10" fill="#FFF1ED" stroke="#FFD8CC" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="22" font-weight="700" fill="#C2410C">Age Group: 4th of 28</text>
    <text x="18" y="54" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="18" fill="#9A3412">● Tells where you finished in THIS race</text>
    <text x="18" y="76" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="18" fill="#9A3412">● Changes if faster runners show up next year!</text>
  </g>

  <!-- Hand-drawn Oval around Age Grade % -->
  <g transform="translate(290, 390)">
    <ellipse cx="60" cy="5" rx="90" ry="24" fill="none" stroke="#075433" stroke-width="2.5" transform="rotate(2, 60, 5)"/>
  </g>

  <!-- Annotation Note 2 pointing to Age Grade: Emerald / Green -->
  <g transform="translate(860, 395)">
    <!-- Curving Arrow -->
    <path d="M-20,40 C-80,45 -120,38 -145,20" fill="none" stroke="#075433" stroke-width="2.5"/>
    <rect x="0" y="0" width="280" height="110" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="22" font-weight="700" fill="#075433">Age Grade: 72.45%</text>
    <text x="18" y="54" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="18" fill="#14532D">● True aerobic performance score</text>
    <text x="18" y="76" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="18" fill="#14532D">● Compares against world standards</text>
    <text x="18" y="98" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="18" fill="#14532D">● Compare across different years!</text>
  </g>

  <!-- Bottom Handwritten Verdict Stamp -->
  <g transform="translate(860, 530)">
    <rect x="0" y="0" width="280" height="85" rx="10" fill="#0B233A"/>
    <text x="140" y="34" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#5EEAD4" text-anchor="middle" letter-spacing="1">KEY TAKEAWAY</text>
    <text x="140" y="62" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Position is competition.</text>
    <text x="140" y="78" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Age Grade is performance.</text>
  </g>
</svg>
