<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Tracking Both Metrics Over Multiple Years">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F2EEE5"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B233A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#trackBg)"/>

  <!-- Top Title Bar -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#0B233A"/>
    <circle cx="16" cy="16" r="4.5" fill="#9FE7BD"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">LONGITUDINAL TRACKING</text>
    
    <text x="0" y="78" font-family="'Fraunces', serif" font-size="38" font-weight="700" fill="#0B233A">Tracking Performance Across Three Years</text>
    <text x="0" y="108" font-family="'Inter', sans-serif" font-size="16" fill="#52796F">Notice how finishing position fluctuates erratically while age grade tracks genuine athletic development</text>
  </g>

  <!-- Three-Year Timeline Cards -->
  <g transform="translate(60, 185)">
    
    <!-- YEAR 2024 -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="335" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="24" y="22" width="75" height="28" rx="6" fill="#F1F5F9"/>
      <text x="61" y="41" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">2024</text>
      <text x="110" y="41" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748B">Age 53 · 5K Road Race</text>
      
      <!-- Metrics -->
      <g transform="translate(24, 75)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B">CLOCK TIME</text>
        <text x="0" y="45" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#0B233A">22:30</text>
        
        <rect x="0" y="65" width="287" height="1" fill="#E2E8F0"/>
        
        <text x="0" y="92" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C2410C">AGE-GROUP RANK</text>
        <text x="0" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#C2410C">4th <tspan font-size="14" font-weight="500" fill="#64748B">of 32</tspan></text>
        <text x="0" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Standard regional field</text>

        <rect x="0" y="155" width="287" height="1" fill="#E2E8F0"/>

        <text x="0" y="182" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">AGE-GRADE SCORE</text>
        <rect x="0" y="195" width="287" height="42" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
        <text x="143" y="222" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#075433" text-anchor="middle">69.80%</text>
      </g>
    </g>

    <!-- YEAR 2025 -->
    <g transform="translate(372, 0)" filter="url(#boxShadow)">
      <rect width="335" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="24" y="22" width="75" height="28" rx="6" fill="#F1F5F9"/>
      <text x="61" y="41" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">2025</text>
      <text x="110" y="41" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748B">Age 54 · 5K Road Race</text>
      
      <!-- Metrics -->
      <g transform="translate(24, 75)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B">CLOCK TIME</text>
        <text x="0" y="45" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#0B233A">22:42 <tspan font-size="14" font-weight="500" fill="#64748B">(+12s)</tspan></text>
        
        <rect x="0" y="65" width="287" height="1" fill="#E2E8F0"/>
        
        <text x="0" y="92" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C2410C">AGE-GROUP RANK</text>
        <text x="0" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#C2410C">1st <tspan font-size="14" font-weight="500" fill="#64748B">of 14 (Won Division!)</tspan></text>
        <text x="0" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Small holiday race field</text>

        <rect x="0" y="155" width="287" height="1" fill="#E2E8F0"/>

        <text x="0" y="182" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">AGE-GRADE SCORE</text>
        <rect x="0" y="195" width="287" height="42" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
        <text x="143" y="222" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#075433" text-anchor="middle">70.12% <tspan font-size="14" font-weight="700" fill="#15803D">(+0.32%)</tspan></text>
      </g>
    </g>

    <!-- YEAR 2026 -->
    <g transform="translate(745, 0)" filter="url(#boxShadow)">
      <rect width="335" height="340" rx="16" fill="#FBFDFC" stroke="#075433" stroke-width="2"/>
      <rect x="24" y="22" width="75" height="28" rx="6" fill="#075433"/>
      <text x="61" y="41" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">2026</text>
      <text x="110" y="41" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#075433">Age 55 · 5K Road Race</text>
      
      <!-- Metrics -->
      <g transform="translate(24, 75)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B">CLOCK TIME</text>
        <text x="0" y="45" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#0B233A">22:38 <tspan font-size="14" font-weight="500" fill="#64748B">(–4s)</tspan></text>
        
        <rect x="0" y="65" width="287" height="1" fill="#E2E8F0"/>
        
        <text x="0" y="92" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C2410C">AGE-GROUP RANK</text>
        <text x="0" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#C2410C">8th <tspan font-size="14" font-weight="500" fill="#64748B">of 45</tspan></text>
        <text x="0" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Competitive state championship</text>

        <rect x="0" y="155" width="287" height="1" fill="#E2E8F0"/>

        <text x="0" y="182" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">AGE-GRADE SCORE</text>
        <rect x="0" y="195" width="287" height="42" rx="8" fill="#075433"/>
        <text x="143" y="222" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#9FE7BD" text-anchor="middle">71.35% (All-Time Best!)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(60, 550)">
    <rect width="1080" height="75" rx="14" fill="#0B233A" filter="url(#boxShadow)"/>
    <g transform="translate(24, 42)">
      <circle cx="14" cy="0" r="10" fill="#FF754D"/>
      <text x="14" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>
      <text x="36" y="-3" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">The Analytical Takeaway:</text>
      <text x="36" y="17" font-family="'Inter', sans-serif" font-size="12.5" fill="#D3E5DE">In 2025, the runner won 1st place but had a 70.12% grade. In 2026, they placed 8th but ran an all-time personal performance best of 71.35%!</text>
    </g>
  </g>
</svg>
