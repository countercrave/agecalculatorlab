<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Hero Comparison: Age-Group vs Age-Graded Performance">
  <defs>
    <linearGradient id="ivoryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F2EFE8"/>
    </linearGradient>
    <linearGradient id="navyPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B233A"/>
      <stop offset="100%" stop-color="#061524"/>
    </linearGradient>
    <linearGradient id="sageCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F9F7"/>
    </linearGradient>
    <filter id="shadowLg" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B233A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Warm Ivory Canvas -->
  <rect width="1200" height="675" fill="url(#ivoryBg)"/>

  <!-- Subtle Running Track Lines Background -->
  <g opacity="0.25" stroke="#52796F" stroke-width="2" fill="none">
    <path d="M-50,220 C400,100 800,120 1250,260"/>
    <path d="M-50,260 C400,140 800,160 1250,300"/>
    <path d="M-50,300 C400,180 800,200 1250,340"/>
    <path d="M-50,340 C400,220 800,240 1250,380"/>
  </g>

  <!-- Top Editorial Header Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="235" height="32" rx="16" fill="#0B233A"/>
    <circle cx="16" cy="16" r="4.5" fill="#5EEAD4"/>
    <text x="32" y="21" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">SPORTS SCIENCE AUDIT</text>
  </g>

  <!-- Big Central Title Text -->
  <text x="60" y="125" font-family="'Fraunces', Georgia, serif" font-size="40" font-weight="700" fill="#0B233A">Race Field Ranking vs Demographic Standard</text>
  <text x="60" y="158" font-family="'Inter', system-ui, sans-serif" font-size="17" fill="#52796F">Understanding the dual pathways of modern athletic race evaluation</text>

  <!-- Dual Panels: Age Group vs Age Grade -->
  
  <!-- Left Panel: AGE-GROUP RESULTS -->
  <g transform="translate(60, 200)" filter="url(#shadowLg)">
    <rect width="515" height="395" rx="18" fill="url(#sageCard)" stroke="#D8E2DC" stroke-width="1.5"/>
    
    <!-- Header Strip -->
    <rect x="0" y="0" width="515" height="75" rx="18" fill="#FFFFFF"/>
    <rect x="0" y="73" width="515" height="2" fill="#E2ECE7"/>
    
    <rect x="28" y="24" width="145" height="28" rx="6" fill="#FFF1ED"/>
    <text x="38" y="43" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FF754D" letter-spacing="0.8">METRIC PATHWAY 1</text>
    <text x="185" y="44" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#0B233A">Age-Group Position</text>

    <!-- Context & Question -->
    <g transform="translate(28, 98)">
      <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">QUESTION ANSWERED</text>
      <text x="0" y="26" font-family="'Fraunces', Georgia, serif" font-size="18" font-style="italic" fill="#0B233A">"Where did I place among my peers today?"</text>
      
      <!-- Visual Display: Finishing Rank -->
      <rect x="0" y="50" width="459" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <g transform="translate(24, 75)">
        <circle cx="25" cy="0" r="24" fill="#FF754D"/>
        <text x="25" y="8" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">5th</text>
        <text x="68" y="-5" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0B233A">Place out of 35 Finishers</text>
        <text x="68" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#64748B">Division: Men 50–54 · 10,000m Road Race</text>
      </g>

      <!-- Characteristics -->
      <g transform="translate(0, 175)">
        <circle cx="6" cy="0" r="4" fill="#FF754D"/>
        <text x="20" y="4" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0B233A">Relative Competition Metric</text>
        <text x="20" y="24" font-family="'Inter', system-ui, sans-serif" font-size="12.5" fill="#64748B">Subject to course field depth, local attendance &amp; turnout</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: AGE-GRADED RESULTS -->
  <g transform="translate(625, 200)" filter="url(#shadowLg)">
    <rect width="515" height="395" rx="18" fill="url(#sageCard)" stroke="#CFE4DB" stroke-width="1.5"/>
    
    <!-- Header Strip -->
    <rect x="0" y="0" width="515" height="75" rx="18" fill="#FFFFFF"/>
    <rect x="0" y="73" width="515" height="2" fill="#CFE4DB"/>
    
    <rect x="28" y="24" width="145" height="28" rx="6" fill="#EFF6FF"/>
    <text x="38" y="43" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#2563EB" letter-spacing="0.8">METRIC PATHWAY 2</text>
    <text x="185" y="44" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#0B233A">Age-Graded Score</text>

    <!-- Context & Question -->
    <g transform="translate(28, 98)">
      <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#075433" letter-spacing="1">QUESTION ANSWERED</text>
      <text x="0" y="26" font-family="'Fraunces', Georgia, serif" font-size="18" font-style="italic" fill="#0B233A">"How close was my speed to demographic peak?"</text>
      
      <!-- Visual Display: Percentage Score -->
      <rect x="0" y="50" width="459" height="100" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
      <g transform="translate(24, 75)">
        <circle cx="25" cy="0" r="24" fill="#075433"/>
        <text x="25" y="7" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#9FE7BD" text-anchor="middle">74%</text>
        <text x="68" y="-5" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#042F2A">74.25% Regional Class Standard</text>
        <text x="68" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#075433">WMA 2025 Standard · World Benchmark: 31:48</text>
      </g>

      <!-- Characteristics -->
      <g transform="translate(0, 175)">
        <circle cx="6" cy="0" r="4" fill="#075433"/>
        <text x="20" y="4" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0B233A">Standardized Longevity Metric</text>
        <text x="20" y="24" font-family="'Inter', system-ui, sans-serif" font-size="12.5" fill="#52796F">Zero dependence on other entrants; consistent year-over-year</text>
      </g>
    </g>
  </g>

  <!-- Bottom Mini Footer Anchor -->
  <g transform="translate(60, 630)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#52796F">Age Calculator Lab · Athletic Performance Modeling Series</text>
  </g>
</svg>
