<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">DATING AGE CALCULATOR: ARITHMETIC FLOW ENGINE</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">DUAL BOUNDARY ALGORITHM</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(85, 130)">
    <!-- Center Box: Subject Age 40 -->
    <rect x="250" y="10" width="130" height="70" rx="6" fill="#042f2a"/>
    <text x="315" y="35" text-anchor="middle" fill="#9fe7bd" font-size="11" font-weight="700">INPUT AGE</text>
    <text x="315" y="65" text-anchor="middle" fill="#ffffff" font-size="26" font-family="'Georgia', serif" font-weight="700">40</text>
    
    <!-- Path to Minimum -->
    <path d="M 250 45 L 145 45 L 145 110" fill="none" stroke="#075433" stroke-width="2.5"/>
    <text x="175" y="38" fill="#075433" font-size="11" font-weight="700">÷2 + 7</text>
    
    <!-- Path to Maximum -->
    <path d="M 380 45 L 485 45 L 485 110" fill="none" stroke="#ff754d" stroke-width="2.5"/>
    <text x="410" y="38" fill="#a83f21" font-size="11" font-weight="700">(−7) × 2</text>
    
    <!-- Box: Minimum Bound -->
    <rect x="40" y="110" width="210" height="100" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1.5"/>
    <text x="145" y="135" text-anchor="middle" fill="#075433" font-size="12" font-weight="700">MINIMUM BOUNDARY</text>
    <text x="145" y="170" text-anchor="middle" fill="#042f2a" font-size="28" font-family="'Courier New', monospace" font-weight="700">27 Years</text>
    <text x="145" y="195" text-anchor="middle" fill="#52796f" font-size="11">40 ÷ 2 + 7 = 27</text>
    
    <!-- Box: Maximum Bound -->
    <rect x="380" y="110" width="210" height="100" rx="6" fill="#fdf6f3" stroke="#f2cfc2" stroke-width="1.5"/>
    <text x="485" y="135" text-anchor="middle" fill="#a83f21" font-size="12" font-weight="700">MAXIMUM BOUNDARY</text>
    <text x="485" y="170" text-anchor="middle" fill="#a83f21" font-size="28" font-family="'Courier New', monospace" font-weight="700">66 Years</text>
    <text x="485" y="195" text-anchor="middle" fill="#66463c" font-size="11">(40 − 7) × 2 = 66</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>