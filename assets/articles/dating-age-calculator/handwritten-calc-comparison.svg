<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">WHICH CALCULATOR TO USE? COMPARATIVE MATRIX</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">AGE GAP vs. DATING AGE CALCULATOR</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(85, 130)">
    <!-- Tool 1: Dating Age Calculator -->
    <rect x="0" y="0" width="300" height="210" rx="6" fill="#f4f9f6" stroke="#075433" stroke-width="1.5"/>
    <text x="24" y="32" fill="#075433" font-size="14" font-weight="700">DATING AGE CALCULATOR</text>
    <text x="24" y="58" fill="#042f2a" font-size="12" font-weight="600">INPUT: 1 Person's Age (e.g. 36)</text>
    
    <rect x="24" y="75" width="252" height="60" rx="4" fill="#ffffff" stroke="#b8d9cc" stroke-width="1"/>
    <text x="36" y="100" fill="#075433" font-size="16" font-family="'Courier New', monospace" font-weight="700">Result: 25 to 58 Yrs</text>
    <text x="36" y="122" fill="#52796f" font-size="11">Calculates rule-based partner range</text>
    
    <text x="24" y="160" fill="#2d5244" font-size="12">✔ Ideal for discovering demographic bounds</text>
    <text x="24" y="182" fill="#2d5244" font-size="12">✔ Uses Half-Your-Age-Plus-Seven formula</text>
    
    <!-- Tool 2: Age Gap Calculator -->
    <rect x="330" y="0" width="300" height="210" rx="6" fill="#fcf8f6" stroke="#ff754d" stroke-width="1.5"/>
    <text x="354" y="32" fill="#a83f21" font-size="14" font-weight="700">AGE GAP CALCULATOR</text>
    <text x="354" y="58" fill="#4a362f" font-size="12" font-weight="600">INPUT: 2 People's Ages / DOBs</text>
    
    <rect x="354" y="75" width="252" height="60" rx="4" fill="#ffffff" stroke="#ebd2c8" stroke-width="1"/>
    <text x="366" y="100" fill="#a83f21" font-size="16" font-family="'Courier New', monospace" font-weight="700">Result: 11 Yrs, 4 Mos</text>
    <text x="366" y="122" fill="#66463c" font-size="11">Exact calendar or whole-year difference</text>
    
    <text x="354" y="160" fill="#66463c" font-size="12">✔ Ideal for measuring actual gap between two</text>
    <text x="354" y="182" fill="#66463c" font-size="12">✔ No subjective compatibility judgments</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>