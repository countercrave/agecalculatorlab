<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect width="880" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="830" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Monthly Payout Progression by Claiming Age</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Relative to Primary Insurance Amount (PIA) for workers born 1960 or later (FRA = 67)</text>

  <!-- Bar 1: Age 62 -->
  <g transform="translate(60, 130)">
    <rect x="0" y="80" width="160" height="150" rx="8" fill="#F8D7DA" stroke="#DC3545" stroke-width="1.5"/>
    <text x="80" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#721C24" text-anchor="middle">70%</text>
    <text x="80" y="160" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#721C24" text-anchor="middle">Age 62 Claim</text>
    <text x="80" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#721C24" text-anchor="middle">-30% Early Cut</text>
    <text x="80" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042F2A" text-anchor="middle">60 months early</text>
  </g>

  <!-- Bar 2: Age 64 -->
  <g transform="translate(260, 130)">
    <rect x="0" y="55" width="160" height="175" rx="8" fill="#FFF3CD" stroke="#FFC107" stroke-width="1.5"/>
    <text x="80" y="105" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#856404" text-anchor="middle">80%</text>
    <text x="80" y="135" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#856404" text-anchor="middle">Age 64 Claim</text>
    <text x="80" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#856404" text-anchor="middle">-20% Early Cut</text>
    <text x="80" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042F2A" text-anchor="middle">36 months early</text>
  </g>

  <!-- Bar 3: Age 67 (FRA) -->
  <g transform="translate(460, 130)">
    <rect x="0" y="10" width="160" height="220" rx="8" fill="#D4EDDA" stroke="#28A745" stroke-width="2"/>
    <text x="80" y="60" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#155724" text-anchor="middle">100%</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#155724" text-anchor="middle">Age 67 (FRA)</text>
    <text x="80" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#155724" text-anchor="middle">Full Statutory PIA</text>
    <text x="80" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042F2A" text-anchor="middle">Standard Baseline</text>
  </g>

  <!-- Bar 4: Age 70 -->
  <g transform="translate(660, 130)">
    <rect x="0" y="-30" width="160" height="260" rx="8" fill="#042F2A" stroke="#FF754D" stroke-width="2"/>
    <text x="80" y="20" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#FF754D" text-anchor="middle">124%</text>
    <text x="80" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 70 Claim</text>
    <text x="80" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#9FE7BD" text-anchor="middle">+24% Delayed Credits</text>
    <text x="80" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042F2A" text-anchor="middle">Max statutory payout</text>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(50, 360)">
    <rect width="780" height="40" rx="6" fill="#075433"/>
    <text x="390" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">A monthly benefit claimed at 70 is ~77% higher than a monthly benefit claimed at 62 ($1,240 vs $700).</text>
  </g>
</svg>