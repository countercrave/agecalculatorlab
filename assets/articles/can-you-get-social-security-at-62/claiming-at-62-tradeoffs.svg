<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%">
  <rect width="860" height="460" fill="#FFFFFF" rx="16" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="50" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700" fill="#042F2A">Claiming Social Security at 62: The 3 Core Trade-Offs</text>
  <text x="40" y="76" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Understanding what early claiming provides versus what you forfeit</text>

  <!-- 3 Pillars -->
  <!-- Pillar 1 -->
  <g transform="translate(40, 110)">
    <rect width="245" height="310" rx="10" fill="#F4F8F6" stroke="#D3E5DE" stroke-width="1.5"/>
    <rect width="245" height="46" rx="10" fill="#075433"/>
    <text x="122" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Immediate Access</text>
    
    <text x="20" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Earliest Retirement Cash</text>
    <text x="20" y="104" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">• Up to 60 extra checks</text>
    <text x="28" y="121" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">before reaching FRA</text>

    <text x="20" y="148" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">• Immediate cash flow for</text>
    <text x="28" y="165" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">early bridge retirement</text>

    <text x="20" y="192" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">• Reduces pressure on</text>
    <text x="28" y="209" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">investment portfolio</text>

    <rect x="20" y="248" width="205" height="36" rx="6" fill="#E6F5EE"/>
    <text x="122" y="271" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">Advantage: Liquidity</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(305, 110)">
    <rect width="245" height="310" rx="10" fill="#FFF5F5" stroke="#F5C6CB" stroke-width="1.5"/>
    <rect width="245" height="46" rx="10" fill="#C82333"/>
    <text x="122" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Permanent Cut</text>
    
    <text x="20" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#721C24">Lifetime Reduction</text>
    <text x="20" y="104" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Cut is permanent: up to</text>
    <text x="28" y="121" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">30% reduction for life</text>

    <text x="20" y="148" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Future COLA boosts</text>
    <text x="28" y="165" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">apply to smaller base</text>

    <text x="20" y="192" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Lowers potential</text>
    <text x="28" y="209" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">surviving spouse payout</text>

    <rect x="20" y="248" width="205" height="36" rx="6" fill="#F8D7DA"/>
    <text x="122" y="271" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#721C24" text-anchor="middle">Cost: Lower Ceiling</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(570, 110)">
    <rect width="245" height="310" rx="10" fill="#FFFBF0" stroke="#FFEEBA" stroke-width="1.5"/>
    <rect width="245" height="46" rx="10" fill="#D39E00"/>
    <text x="122" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">3. Earnings Limit</text>
    
    <text x="20" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#856404">Wage Limitation</text>
    <text x="20" y="104" font-family="'Inter', sans-serif" font-size="12" fill="#856404">• If working before FRA,</text>
    <text x="28" y="121" font-family="'Inter', sans-serif" font-size="12" fill="#856404">$1 withheld per $2 over cap</text>

    <text x="20" y="148" font-family="'Inter', sans-serif" font-size="12" fill="#856404">• Withheld dollars are</text>
    <text x="28" y="165" font-family="'Inter', sans-serif" font-size="12" fill="#856404">credited back at FRA</text>

    <text x="20" y="192" font-family="'Inter', sans-serif" font-size="12" fill="#856404">• Earnings test ends</text>
    <text x="28" y="209" font-family="'Inter', sans-serif" font-size="12" fill="#856404">month you reach FRA</text>

    <rect x="20" y="248" width="205" height="36" rx="6" fill="#FFF3CD"/>
    <text x="122" y="271" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#856404" text-anchor="middle">Rule: Income Cap</text>
  </g>
</svg>