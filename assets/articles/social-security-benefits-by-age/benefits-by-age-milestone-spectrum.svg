<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="auto">
  <rect width="880" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="830" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Monthly Benefit Payout Across Four Key Ages</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Relative to Primary Insurance Amount (PIA) for individuals with a Full Retirement Age of 67</text>

  <!-- 4 Milestone Cards -->
  <!-- Age 62 -->
  <g transform="translate(50, 115)">
    <rect width="180" height="215" rx="10" fill="#FFF5F5" stroke="#F5C6CB" stroke-width="1.5"/>
    <rect width="180" height="42" rx="10" fill="#C82333"/>
    <text x="90" y="27" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 62 (Earliest)</text>

    <text x="90" y="85" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#721C24" text-anchor="middle">70%</text>
    <text x="90" y="112" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C82333" text-anchor="middle">30% Permanent Cut</text>

    <text x="20" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">• 60 months before FRA</text>
    <text x="20" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">• Earnings test applies</text>
    <text x="20" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">• Example: $1,400 / mo</text>
  </g>

  <!-- Age 65 -->
  <g transform="translate(250, 115)">
    <rect width="180" height="215" rx="10" fill="#FFFDF5" stroke="#FFEBAA" stroke-width="1.5"/>
    <rect width="180" height="42" rx="10" fill="#D39E00"/>
    <text x="90" y="27" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Age 65 (Medicare)</text>

    <text x="90" y="85" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#856404" text-anchor="middle">86.7%</text>
    <text x="90" y="112" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#856404" text-anchor="middle">13.3% Reduction</text>

    <text x="20" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#856404">• 24 months before FRA</text>
    <text x="20" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#856404">• Medicare enrollment</text>
    <text x="20" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#856404">• Example: $1,733 / mo</text>
  </g>

  <!-- Age 67 -->
  <g transform="translate(450, 115)">
    <rect width="180" height="215" rx="10" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <rect width="180" height="42" rx="10" fill="#075433"/>
    <text x="90" y="27" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 67 (Full FRA)</text>

    <text x="90" y="85" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#075433" text-anchor="middle">100%</text>
    <text x="90" y="112" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">Full Statutory PIA</text>

    <text x="20" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">• Statutory baseline</text>
    <text x="20" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">• Earnings test ends</text>
    <text x="20" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">• Example: $2,000 / mo</text>
  </g>

  <!-- Age 70 -->
  <g transform="translate(650, 115)">
    <rect width="180" height="215" rx="10" fill="#042F2A" stroke="#075433" stroke-width="2"/>
    <rect width="180" height="42" rx="10" fill="#FF754D"/>
    <text x="90" y="27" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 70 (Maximum)</text>

    <text x="90" y="85" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#FF754D" text-anchor="middle">124%</text>
    <text x="90" y="112" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#9FE7BD" text-anchor="middle">+24% Delayed Credit</text>

    <text x="20" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• 36 months delayed</text>
    <text x="20" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Maximum monthly check</text>
    <text x="20" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Example: $2,480 / mo</text>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(50, 350)">
    <rect width="780" height="44" rx="6" fill="#075433"/>
    <text x="390" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Delaying from 62 to 70 increases your permanent monthly benefit by over 77% ($1,400 → $2,480).</text>
  </g>
</svg>