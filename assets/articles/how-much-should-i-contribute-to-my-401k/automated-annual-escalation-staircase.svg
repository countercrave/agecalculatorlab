<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="auto" role="img" aria-label="Automated Annual Escalation Staircase Diagram">
  <rect width="840" height="360" rx="14" fill="#042F2A"/>
  <rect x="18" y="18" width="804" height="324" rx="10" fill="#075433" stroke="#20A67B" stroke-width="1.5"/>
  
  <text x="420" y="52" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="21" font-weight="700" text-anchor="middle">The 1% Annual Contribution Escalation Strategy</text>
  <text x="420" y="76" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Painless savings acceleration: pairing annual merit pay raises with automated 1% 401(k) hikes</text>

  <!-- Stair 1: Year 1 (6%) -->
  <g transform="translate(60, 220)">
    <rect width="120" height="80" rx="6" fill="#042F2A" stroke="#52796F" stroke-width="1.5"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">Year 1</text>
    <text x="60" y="58" fill="#FFD180" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">6% Rate</text>
  </g>

  <!-- Stair 2: Year 2 (7%) -->
  <g transform="translate(200, 190)">
    <rect width="120" height="110" rx="6" fill="#042F2A" stroke="#20A67B" stroke-width="1.5"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">Year 2</text>
    <text x="60" y="58" fill="#9FE7BD" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">7% Rate</text>
    <text x="60" y="86" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">+1% Raise absorbed</text>
  </g>

  <!-- Stair 3: Year 3 (8%) -->
  <g transform="translate(340, 160)">
    <rect width="120" height="140" rx="6" fill="#042F2A" stroke="#20A67B" stroke-width="1.5"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">Year 3</text>
    <text x="60" y="58" fill="#9FE7BD" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">8% Rate</text>
    <text x="60" y="86" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Take-home still up</text>
  </g>

  <!-- Stair 4: Year 4 (9%) -->
  <g transform="translate(480, 130)">
    <rect width="120" height="170" rx="6" fill="#042F2A" stroke="#FF754D" stroke-width="1.5"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">Year 4</text>
    <text x="60" y="58" fill="#FFAB91" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">9% Rate</text>
    <text x="60" y="86" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Habit established</text>
  </g>

  <!-- Stair 5: Year 5 (10% Target) -->
  <g transform="translate(620, 100)">
    <rect width="140" height="200" rx="6" fill="#042F2A" stroke="#FFD180" stroke-width="2"/>
    <text x="70" y="32" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">Year 5 Target</text>
    <text x="70" y="58" fill="#FFD180" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">10%–15% Rate</text>
    <text x="70" y="88" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Double Initial Rate!</text>
    <text x="70" y="112" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Zero lifestyle shock</text>
    <text x="70" y="132" fill="#9FE7BD" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Max wealth acceleration</text>
  </g>

  <text x="420" y="322" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
    By splitting your raises (e.g. 3% raise: 1% to 401k, 2% to take-home pay), your living standard improves while savings double.
  </text>
</svg>