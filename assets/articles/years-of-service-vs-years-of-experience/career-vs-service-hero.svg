<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#042F2A; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2A" />
      <stop offset="100%" stop-color="#075433" />
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083E38" />
      <stop offset="100%" stop-color="#042823" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF754D" />
      <stop offset="100%" stop-color="#FF9A77" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Top Header Badge & Title -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#FF754D" fill-opacity="0.2" stroke="#FF754D" stroke-width="1.2" />
    <text x="140" y="20" font-size="12" font-weight="700" fill="#FF9A77" text-anchor="middle" letter-spacing="1.5">EMPLOYMENT METRICS COMPARISON</text>
    
    <text x="0" y="66" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">One Career — Two Distinct Measurements</text>
    <text x="0" y="94" font-size="15" font-weight="400" fill="#D3E5DE">Why cumulative professional experience does not equal single-employer service tenure.</text>
  </g>

  <!-- Main Comparison Canvas (Card) -->
  <rect x="60" y="175" width="1080" height="445" rx="20" fill="url(#cardGradDark)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Track 1: Total Professional Experience -->
  <g transform="translate(100, 215)">
    <!-- Label and Badge -->
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1" />
    <text x="90" y="18" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="0.8">1. YEARS OF EXPERIENCE</text>
    
    <text x="200" y="19" font-size="14" font-weight="500" fill="#D3E5DE">Cumulative career scope across all qualifying roles and organizations</text>

    <!-- Timeline Bar: 2016 to 2026 (10 Years) -->
    <!-- Timeline Track Base -->
    <rect x="0" y="45" width="1000" height="70" rx="12" fill="#031F1C" stroke="rgba(255,255,255,0.08)" />

    <!-- Segment 1: Company A (2016-2020: 40%) -->
    <rect x="10" y="55" width="380" height="50" rx="8" fill="#0D5C46" stroke="#10B981" stroke-width="1" />
    <text x="25" y="78" font-weight="700" font-size="14" fill="#FFFFFF">Company A</text>
    <text x="25" y="95" font-size="11" fill="#9FE7BD">2016 – 2020 • 4 Years</text>
    <rect x="300" y="65" width="80" height="28" rx="6" fill="rgba(0,0,0,0.3)" />
    <text x="340" y="84" font-weight="700" font-size="12" fill="#34D399" text-anchor="middle">4 YRS</text>

    <!-- Segment 2: Company B (2020-2026: 60%) -->
    <rect x="400" y="55" width="590" height="50" rx="8" fill="#075433" stroke="#34D399" stroke-width="1.5" />
    <text x="420" y="78" font-weight="700" font-size="14" fill="#FFFFFF">Company B (Current Employer)</text>
    <text x="420" y="95" font-size="11" fill="#9FE7BD">2020 – 2026 • 6 Years Continuous</text>
    <rect x="890" y="65" width="90" height="28" rx="6" fill="rgba(0,0,0,0.35)" />
    <text x="935" y="84" font-weight="700" font-size="12" fill="#34D399" text-anchor="middle">6 YRS</text>

    <!-- Total Experience Summary Bracket / Pill -->
    <g transform="translate(0, 125)">
      <rect x="750" y="0" width="250" height="34" rx="8" fill="#10B981" />
      <text x="875" y="22" font-size="13" font-weight="800" fill="#042F2A" text-anchor="middle">TOTAL EXPERIENCE: 10 YEARS</text>
      <text x="10" y="20" font-size="12" font-style="italic" fill="#88A89E">Spans 2 separate companies, 10 full calendar years of professional practice</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="100" y1="395" x2="1100" y2="395" stroke="rgba(255,255,255,0.12)" stroke-dasharray="6,6" />

  <!-- Track 2: Years of Service (Current Employer) -->
  <g transform="translate(100, 415)">
    <!-- Label and Badge -->
    <rect x="0" y="0" width="165" height="26" rx="6" fill="#FF754D" fill-opacity="0.18" stroke="#FF754D" stroke-width="1" />
    <text x="82" y="18" font-size="12" font-weight="700" fill="#FF9A77" text-anchor="middle" letter-spacing="0.8">2. YEARS OF SERVICE</text>
    
    <text x="185" y="19" font-size="14" font-weight="500" fill="#D3E5DE">Single continuous tenure with current employing organization only</text>

    <!-- Timeline Track Base -->
    <rect x="0" y="45" width="1000" height="70" rx="12" fill="#031F1C" stroke="rgba(255,255,255,0.08)" />

    <!-- Prior Time Non-Applicable (Hashed) -->
    <rect x="10" y="55" width="380" height="50" rx="8" fill="#06221E" stroke="rgba(255,255,255,0.05)" />
    <text x="200" y="84" font-size="12" font-weight="600" fill="#5D7A72" text-anchor="middle">Prior Employer (Does not count toward Service)</text>

    <!-- Service Segment (Company B: 2020 to 2026) -->
    <rect x="400" y="55" width="590" height="50" rx="8" fill="url(#coralGrad)" stroke="#FFA080" stroke-width="1.5" />
    <text x="420" y="78" font-weight="800" font-size="15" fill="#042F2A">Company B Service Tenure</text>
    <text x="420" y="96" font-size="12" font-weight="600" fill="#3D1A10">Hire Date: Jan 2020 → Current Date: Jan 2026</text>
    <rect x="880" y="65" width="100" height="28" rx="6" fill="#042F2A" />
    <text x="930" y="84" font-weight="800" font-size="13" fill="#FF9A77" text-anchor="middle">6 YEARS</text>

    <!-- Current Service Summary Pill -->
    <g transform="translate(0, 125)">
      <rect x="750" y="0" width="250" height="34" rx="8" fill="#FF754D" />
      <text x="875" y="22" font-size="13" font-weight="800" fill="#042F2A" text-anchor="middle">CURRENT SERVICE: 6 YEARS</text>
      <text x="10" y="20" font-size="12" font-style="italic" fill="#FFB199">Governs internal vesting, PTO tiers, work anniversaries, and company severance</text>
    </g>
  </g>

  <!-- Watermark / Footer Brand -->
  <text x="1100" y="650" font-size="11" font-weight="600" fill="#6A8B81" text-anchor="end">AgeCalculatorLab.com • Authority Employment Chronology Series</text>
</svg>
