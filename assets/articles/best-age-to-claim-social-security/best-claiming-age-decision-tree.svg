<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect width="880" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="830" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Social Security Claiming Decision Tree</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Follow your personal circumstances to find the optimal claiming window</text>

  <!-- Question 1 -->
  <g transform="translate(50, 115)">
    <rect width="230" height="95" rx="8" fill="#F4F9F6" stroke="#075433" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#075433">1. Immediate Need?</text>
    <text x="20" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Do you require cash now</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">to pay living expenses?</text>
  </g>

  <!-- Decision Branch 1: YES -> 62 -->
  <g transform="translate(320, 115)">
    <rect width="210" height="95" rx="8" fill="#FFF5F5" stroke="#F5C6CB" stroke-width="1.5"/>
    <text x="18" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C82333">YES → Cash Shortage</text>
    <text x="18" y="52" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#721C24">Claim at Age 62</text>
    <text x="18" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">Provides early liquidity</text>
  </g>

  <!-- Question 2: NO -> Check Work -->
  <g transform="translate(50, 235)">
    <rect width="230" height="95" rx="8" fill="#F4F9F6" stroke="#075433" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#075433">2. Still Working?</text>
    <text x="20" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Earning above annual</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">earnings test threshold?</text>
  </g>

  <!-- Decision Branch 2: YES -> FRA -->
  <g transform="translate(320, 235)">
    <rect width="210" height="95" rx="8" fill="#E6F5EE" stroke="#A3D9C2" stroke-width="1.5"/>
    <text x="18" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">YES → Active Earnings</text>
    <text x="18" y="52" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#075433">Wait Until FRA (67)</text>
    <text x="18" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#075433">Avoids wage withholding</text>
  </g>

  <!-- Decision Branch 3: NO -> Longevity -> 70 -->
  <g transform="translate(570, 175)">
    <rect width="260" height="155" rx="10" fill="#042F2A" stroke="#075433" stroke-width="2"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FF754D">3. High Longevity / Spouse?</text>
    <text x="20" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#D3E5DE">Healthy family history &amp;</text>
    <text x="20" y="78" font-family="'Inter', sans-serif" font-size="12" fill="#D3E5DE">adequate bridge capital</text>
    
    <text x="20" y="110" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Delay to Age 70</text>
    <text x="20" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9FE7BD">+24% to +32% guaranteed boost</text>
  </g>

  <!-- Bottom Explanatory -->
  <g transform="translate(50, 355)">
    <rect width="780" height="42" rx="6" fill="#075433"/>
    <text x="390" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">There is no single 'best age' for all Americans. The right choice depends on cash, work, health, and family.</text>
  </g>
</svg>