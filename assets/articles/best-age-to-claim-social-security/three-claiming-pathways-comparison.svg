<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="auto">
  <rect width="860" height="420" fill="#FFFFFF" rx="16" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="50" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">The Three Primary Social Security Pathways</text>
  <text x="40" y="75" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#4B6358">Comparing early claiming, standard Full Retirement Age, and delayed claiming at 70</text>

  <!-- 3 Pillars -->
  <!-- Pillar 1 -->
  <g transform="translate(40, 105)">
    <rect width="245" height="280" rx="10" fill="#FFF5F5" stroke="#F5C6CB" stroke-width="1.5"/>
    <rect width="245" height="44" rx="10" fill="#C82333"/>
    <text x="122" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Path 1: Early (62–64)</text>

    <text x="20" y="76" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#721C24">Cash-First Strategy</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• 70% to 80% monthly payout</text>
    <text x="20" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Up to 5 yrs additional checks</text>
    <text x="20" y="144" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Subject to earnings cap</text>

    <rect x="20" y="180" width="205" height="85" rx="6" fill="#F8D7DA"/>
    <text x="32" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#721C24">Best for:</text>
    <text x="32" y="222" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">• Urgent living expense needs</text>
    <text x="32" y="240" font-family="'Inter', sans-serif" font-size="11" fill="#721C24">• Below-average life expectancy</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(305, 105)">
    <rect width="245" height="280" rx="10" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <rect width="245" height="44" rx="10" fill="#075433"/>
    <text x="122" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Path 2: Standard (FRA 67)</text>

    <text x="20" y="76" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Balanced Benchmark</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• 100% full statutory PIA</text>
    <text x="20" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• Earnings penalty eliminated</text>
    <text x="20" y="144" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• Balanced lifetime payout</text>

    <rect x="20" y="180" width="205" height="85" rx="6" fill="#E6F5EE"/>
    <text x="32" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433">Best for:</text>
    <text x="32" y="222" font-family="'Inter', sans-serif" font-size="11" fill="#075433">• Continuing active employment</text>
    <text x="32" y="240" font-family="'Inter', sans-serif" font-size="11" fill="#075433">• Standard retirement timeline</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(570, 105)">
    <rect width="245" height="280" rx="10" fill="#042F2A" stroke="#075433" stroke-width="1.5"/>
    <rect width="245" height="44" rx="10" fill="#FF754D"/>
    <text x="122" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Path 3: Delayed (Age 70)</text>

    <text x="20" y="76" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FF754D">Maximum Security</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">• 124% to 132% of full PIA</text>
    <text x="20" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">• +8% guaranteed annual growth</text>
    <text x="20" y="144" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">• Highest survivor base</text>

    <rect x="20" y="180" width="205" height="85" rx="6" fill="#063E37"/>
    <text x="32" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#9FE7BD">Best for:</text>
    <text x="32" y="222" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Longevity expectations (82+)</text>
    <text x="32" y="240" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Primary household earner</text>
  </g>
</svg>