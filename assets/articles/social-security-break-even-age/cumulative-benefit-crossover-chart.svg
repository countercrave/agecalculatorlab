<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect width="880" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="830" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Cumulative Benefit Comparison: Age 62 vs Age 67</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Visualizing the break-even intersection where delaying benefits overtakes early claiming</text>

  <!-- Chart Area -->
  <g transform="translate(80, 110)">
    <!-- Grid Lines -->
    <line x1="0" y1="200" x2="680" y2="200" stroke="#E2EBE6" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="680" y2="130" stroke="#E2EBE6" stroke-width="1" stroke-dasharray="4"/>
    <line x1="0" y1="60" x2="680" y2="60" stroke="#E2EBE6" stroke-width="1" stroke-dasharray="4"/>

    <!-- Y-Axis Labels -->
    <text x="-15" y="205" font-family="'Inter', sans-serif" font-size="11" fill="#6B8A7D" text-anchor="end">$0</text>
    <text x="-15" y="135" font-family="'Inter', sans-serif" font-size="11" fill="#6B8A7D" text-anchor="end">$200k</text>
    <text x="-15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#6B8A7D" text-anchor="end">$400k</text>

    <!-- X-Axis Milestone Ages -->
    <text x="0" y="225" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Age 62</text>
    <text x="170" y="225" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Age 67 (FRA)</text>
    <text x="390" y="225" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">Age 78 (Break-Even)</text>
    <text x="640" y="225" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Age 85</text>

    <!-- Line A: Claim at 62 ($1,400/mo) -->
    <!-- (0,200) -> (170,140) -> (390,70) -> (640,0) -->
    <polyline points="0,200 170,143 390,70 640,0" fill="none" stroke="#C82333" stroke-width="3"/>
    <circle cx="0" cy="200" r="5" fill="#C82333"/>
    <circle cx="170" cy="143" r="5" fill="#C82333"/>
    <circle cx="640" cy="0" r="5" fill="#C82333"/>
    <text x="650" y="10" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C82333">Claim at 62 ($1,400/mo)</text>

    <!-- Line B: Claim at 67 ($2,000/mo) -->
    <!-- (170,200) -> (390,70) -> (640,-60) -->
    <polyline points="170,200 390,70 600,-40" fill="none" stroke="#075433" stroke-width="3"/>
    <circle cx="170" cy="200" r="5" fill="#075433"/>
    <circle cx="600" cy="-40" r="5" fill="#075433"/>
    <text x="610" y="-35" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">Claim at 67 ($2,000/mo)</text>

    <!-- Crossover Marker at Age 78 -->
    <circle cx="390" cy="70" r="8" fill="#FF754D"/>
    <line x1="390" y1="70" x2="390" y2="200" stroke="#FF754D" stroke-width="1.5" stroke-dasharray="4"/>
    <rect x="300" y="25" width="180" height="32" rx="6" fill="#042F2A"/>
    <text x="390" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Break-Even ~78.5 Years</text>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(50, 360)">
    <rect width="780" height="38" rx="6" fill="#075433"/>
    <text x="390" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Before age 78, claiming at 62 yielded more total dollars. After age 78, claiming at 67 yields more lifetime wealth.</text>
  </g>
</svg>