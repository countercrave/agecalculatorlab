<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">AGE GAP CALCULATION: SIMPLE ARITHMETIC DIFFERENCE</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">FORMULA: OLDER AGE − YOUNGER AGE</text>
  
  <!-- Content Area -->
  
  <!-- Main Display Card -->
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <!-- Left Side: Subtraction Column -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="280" height="205" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="24" y="32" fill="#075433" font-size="13" font-weight="700">SUBTRACTION METHOD</text>
    
    <text x="24" y="75" fill="#042f2a" font-size="28" font-family="'Courier New', monospace" font-weight="700">45 Years</text>
    <text x="24" y="88" fill="#52796f" font-size="11">Person A (Older)</text>
    
    <text x="24" y="125" fill="#ff754d" font-size="28" font-family="'Courier New', monospace" font-weight="700">− 32 Years</text>
    <text x="24" y="138" fill="#52796f" font-size="11">Person B (Younger)</text>
    
    <line x1="24" y1="152" x2="256" y2="152" stroke="#042f2a" stroke-width="2.5"/>
    
    <text x="24" y="185" fill="#075433" font-size="28" font-family="'Courier New', monospace" font-weight="700">= 13 Years</text>
    <text x="175" y="185" fill="#075433" font-size="12" font-weight="700">(Age Gap)</text>
  </g>
  
  <!-- Right Side: Explanatory Badges -->
  <g transform="translate(415, 140)">
    <rect x="0" y="0" width="285" height="95" rx="6" fill="#fcf6f3" stroke="#f2cfc2" stroke-width="1"/>
    <text x="18" y="28" fill="#a83f21" font-size="13" font-weight="700">STATED-AGE CONTEXT</text>
    <text x="18" y="52" fill="#4a362f" font-size="12">Measures whole calendar years separating</text>
    <text x="18" y="72" fill="#4a362f" font-size="12">two completed chronological ages.</text>
    
    <rect x="0" y="110" width="285" height="95" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="18" y="138" fill="#075433" font-size="13" font-weight="700">COMMONLY USED IN</text>
    <text x="18" y="162" fill="#24483b" font-size="12">• Dating &amp; relationship demographics</text>
    <text x="18" y="182" fill="#24483b" font-size="12">• Generational peer comparison</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>