<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">BIRTH YEARS vs. EXACT CALENDAR DIFFERENCE</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">PRECISION COMPARISON</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <!-- Upper Track: Year-Only Subtraction -->
  <g transform="translate(85, 130)">
    <rect x="0" y="0" width="630" height="95" rx="6" fill="#fdf7f4" stroke="#f0cfc2" stroke-width="1"/>
    <text x="20" y="28" fill="#a83f21" font-size="13" font-weight="700">1. WHOLE-YEAR APPROXIMATION (BIRTH YEARS ONLY)</text>
    <text x="20" y="58" fill="#042f2a" font-size="18" font-family="'Courier New', monospace" font-weight="700">2000 − 1990 = 10 Years</text>
    <text x="20" y="80" fill="#66463c" font-size="12">Quick mental estimate, but ignores months and anniversary dates.</text>
  </g>
  
  <!-- Lower Track: Exact Date Interval -->
  <g transform="translate(85, 245)">
    <rect x="0" y="0" width="630" height="115" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="20" y="28" fill="#075433" font-size="13" font-weight="700">2. EXACT CALENDAR INTERVAL (COMPLETE DATES OF BIRTH)</text>
    <text x="20" y="58" fill="#042f2a" font-size="16" font-family="'Courier New', monospace" font-weight="700">March 20, 1990  ───▶  November 10, 2000</text>
    <text x="20" y="85" fill="#075433" font-size="16" font-family="'Courier New', monospace" font-weight="700">Exact Interval = 10 Years, 7 Months, 21 Days</text>
    <text x="20" y="103" fill="#2d5244" font-size="11">Accounts for exact month day counts, leap years, and elapsed days.</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>