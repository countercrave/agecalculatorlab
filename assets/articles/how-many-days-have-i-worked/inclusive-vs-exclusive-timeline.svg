<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%" style="background:#042F2A; border-radius:16px; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <rect width="880" height="340" fill="#042F2A" rx="16"/>

  <text x="40" y="42" fill="#FFFFFF" font-size="18" font-weight="800">The +1 Day Rule: Inclusive vs. Exclusive Date Counting</text>
  <text x="40" y="66" fill="#9FE7BD" font-size="13">Example: Started Monday (Day 1) and worked through Friday (Day 5)</text>

  <!-- Timeline Box -->
  <rect x="40" y="90" width="800" height="100" rx="12" fill="#073B32" stroke="#1B6349" stroke-width="1"/>
  
  <!-- 5 Days Blocks -->
  <rect x="60" y="110" width="136" height="60" rx="8" fill="#0D4539" stroke="#9FE7BD" stroke-width="1.5"/>
  <text x="128" y="135" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Monday (Day 1)</text>
  <text x="128" y="155" fill="#9FE7BD" font-size="11" text-anchor="middle">Start of Shift</text>

  <rect x="212" y="110" width="136" height="60" rx="8" fill="#0D4539"/>
  <text x="280" y="135" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Tuesday (Day 2)</text>
  <text x="280" y="155" fill="#D3E5DE" font-size="11" text-anchor="middle">Active Duty</text>

  <rect x="364" y="110" width="136" height="60" rx="8" fill="#0D4539"/>
  <text x="432" y="135" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Wed (Day 3)</text>
  <text x="432" y="155" fill="#D3E5DE" font-size="11" text-anchor="middle">Active Duty</text>

  <rect x="516" y="110" width="136" height="60" rx="8" fill="#0D4539"/>
  <text x="584" y="135" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Thursday (Day 4)</text>
  <text x="584" y="155" fill="#D3E5DE" font-size="11" text-anchor="middle">Active Duty</text>

  <rect x="668" y="110" width="152" height="60" rx="8" fill="#0D4539" stroke="#FF754D" stroke-width="1.5"/>
  <text x="744" y="135" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Friday (Day 5)</text>
  <text x="744" y="155" fill="#FF9A77" font-size="11" text-anchor="middle">Last Shift Worked</text>

  <!-- Comparison Cards Below -->
  <g transform="translate(40, 210)">
    <rect width="385" height="100" rx="10" fill="#072B24" stroke="#1B6349" stroke-width="1"/>
    <text x="20" y="32" fill="#D3E5DE" font-size="13" font-weight="700">MATHEMATICAL DIFFERENCE (Exclusive)</text>
    <text x="20" y="58" fill="#FFFFFF" font-size="18" font-weight="800" font-family="'JetBrains Mono', monospace">5 − 1 = 4 Days Elapsed</text>
    <text x="20" y="82" fill="#9FE7BD" font-size="12">Measures time span elapsed (omits Friday's worked shift).</text>
  </g>

  <g transform="translate(455, 210)">
    <rect width="385" height="100" rx="10" fill="#0D4539" stroke="#9FE7BD" stroke-width="1.5"/>
    <text x="20" y="32" fill="#9FE7BD" font-size="13" font-weight="700">HR EMPLOYMENT METHOD (Inclusive)</text>
    <text x="20" y="58" fill="#FFFFFF" font-size="18" font-weight="800" font-family="'JetBrains Mono', monospace">(5 − 1) + 1 = 5 Days of Service</text>
    <text x="20" y="82" fill="#FFFFFF" font-size="12">Credits every shift on payroll from first punch to last exit.</text>
  </g>
</svg>