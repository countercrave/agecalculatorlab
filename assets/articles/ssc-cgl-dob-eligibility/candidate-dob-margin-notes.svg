<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="background:#f4eee2; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.14"/>
    </filter>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Study Desk Surface -->
  <rect width="800" height="600" fill="#e7ded0"/>

  <!-- Ballpoint Pen on Right Desk Surface -->
  <g transform="translate(710, 80) rotate(12)">
    <rect x="0" y="0" width="14" height="420" rx="3" fill="#1e293b"/>
    <rect x="2" y="30" width="10" height="80" rx="2" fill="#0284c7"/>
    <polygon points="0,420 14,420 7,455" fill="#cbd5e1"/>
    <polygon points="5,445 9,445 7,455" fill="#0f172a"/>
  </g>

  <!-- Notebook Sheet -->
  <g transform="translate(80, 35)" filter="url(#paperShadow)">
    <rect width="600" height="530" rx="6" fill="#fffdfa" stroke="#cbd5e1"/>
    
    <!-- Spiral Binding Holes on Left Edge -->
    <g transform="translate(14, 20)">
      <circle cx="0" cy="20" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="60" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="100" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="140" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="180" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="220" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="260" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="300" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="340" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="380" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="420" r="5" fill="#94a3b8"/>
      <circle cx="0" cy="460" r="5" fill="#94a3b8"/>
    </g>

    <!-- Red Margin line -->
    <line x1="55" y1="0" x2="55" y2="530" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Ruled Blue Lines across notebook -->
    <line x1="55" y1="75" x2="570" y2="75" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="110" x2="570" y2="110" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="145" x2="570" y2="145" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="180" x2="570" y2="180" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="215" x2="570" y2="215" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="250" x2="570" y2="250" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="285" x2="570" y2="285" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="320" x2="570" y2="320" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="355" x2="570" y2="355" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="390" x2="570" y2="390" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="425" x2="570" y2="425" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="55" y1="460" x2="570" y2="460" stroke="#e0e7ff" stroke-width="1"/>

    <!-- Notebook Header -->
    <text x="75" y="45" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#0f172a">
      SSC CGL 2026 &mdash; Candidate Self-Check Notes
    </text>
    <text x="75" y="65" font-size="11" font-weight="600" fill="#64748b">
      Personal Eligibility Calculation &bull; Target: Inspector (Central Excise / IT)
    </text>

    <!-- Left Handwritten Calculation Block (Student ballpoint pen) -->
    <g transform="translate(75, 95)">
      
      <!-- Primary calculation notes -->
      <text x="0" y="24" font-size="15" font-weight="700" fill="#1e3a8a">
        Target Exam: SSC CGL 2026
      </text>

      <text x="0" y="58" font-size="15" font-weight="600" fill="#0f172a">
        My Date of Birth: <tspan font-weight="800" fill="#1d4ed8">18 / 09 / 1998</tspan>
      </text>

      <text x="0" y="92" font-size="15" font-weight="600" fill="#0f172a">
        Official Cut-off Date: <tspan font-weight="800" fill="#b91c1c">01 / 08 / 2026</tspan>
      </text>

      <!-- Crossed-out mistake (realistic student behavior) -->
      <g transform="translate(0, 118)">
        <text x="0" y="16" font-size="13" font-weight="500" fill="#94a3b8">
          Age today: 27 yrs 11 mos
        </text>
        <line x1="0" y1="12" x2="160" y2="12" stroke="#dc2626" stroke-width="1.5"/>
        <text x="175" y="16" font-size="11" font-weight="700" fill="#dc2626">
          &#x2190; WRONG! Don't use today!
        </text>
      </g>

      <!-- Exact Calculation Box -->
      <g transform="translate(0, 150)">
        <rect width="250" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="14" y="24" font-size="11" font-weight="700" fill="#15803d">EXACT AGE ON 01-AUG-2026:</text>
        <text x="14" y="48" font-size="18" font-weight="800" fill="#166534">27 Years, 10 Mos, 14 Days</text>
      </g>

    </g>

    <!-- Right Side: Post-It Note / Checklist (Tilted slightly) -->
    <g transform="translate(360, 95)" filter="url(#stickyShadow)">
      <g transform="rotate(1.5 105 130)">
        <!-- Sticky Note Paper -->
        <rect width="200" height="250" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
        <!-- Top Tape -->
        <rect x="70" y="-5" width="60" height="12" rx="2" fill="#cbd5e1" fill-opacity="0.6"/>

        <text x="16" y="28" font-size="12" font-weight="800" fill="#713f12" letter-spacing="0.5">
          CADRE STATUS (UR)
        </text>
        <line x1="16" y1="36" x2="184" y2="36" stroke="#ca8a04" stroke-width="1"/>

        <!-- Checklist Item 1 -->
        <text x="16" y="62" font-size="12" font-weight="700" fill="#dc2626">&#x2715; 18–27 Band:</text>
        <text x="16" y="78" font-size="11" font-weight="600" fill="#854d0e">Auditor/TA: Overage</text>

        <!-- Checklist Item 2 -->
        <text x="16" y="108" font-size="12" font-weight="700" fill="#16a34a">&#x2713; 20–30 Band:</text>
        <text x="16" y="124" font-size="11" font-weight="600" fill="#15803d">ASO Cadres: ELIGIBLE</text>

        <!-- Checklist Item 3 -->
        <text x="16" y="154" font-size="12" font-weight="700" fill="#16a34a">&#x2713; 18–30 Band:</text>
        <text x="16" y="170" font-size="11" font-weight="600" fill="#15803d">Inspectors: ELIGIBLE</text>

        <!-- Checklist Item 4 -->
        <text x="16" y="200" font-size="12" font-weight="700" fill="#16a34a">&#x2713; 18–32 Band:</text>
        <text x="16" y="216" font-size="11" font-weight="600" fill="#15803d">JSO: ELIGIBLE</text>
      </g>
    </g>

    <!-- Bottom Action Checklist inside notebook (Clean Stacked Lines) -->
    <g transform="translate(75, 360)">
      <rect width="485" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="14" y="12" width="130" height="20" rx="4" fill="#0284c7"/>
      <text x="22" y="26" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACTION CHECKLIST</text>

      <text x="16" y="54" font-size="12.5" font-weight="700" fill="#0369a1">
        &#x2713; Verified DOB strictly from 10th Matriculation Board Certificate
      </text>
      <text x="16" y="74" font-size="12.5" font-weight="700" fill="#0369a1">
        &#x2713; Checked post-wise age limit (Skipping 18-27 clerical cadres)
      </text>
      <text x="16" y="94" font-size="12.5" font-weight="700" fill="#15803d">
        &#x2713; Prioritizing Excise Inspector &amp; ASO CSS in post preferences!
      </text>
    </g>

    <!-- Footer Stamp -->
    <g transform="translate(75, 495)">
      <line x1="0" y1="0" x2="485" y2="0" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="18" font-size="11" font-weight="600" fill="#94a3b8">
        Crucial Reference Date: 01 August 2026 &bull; Age Calculator Lab Study Resource
      </text>
    </g>

  </g>
</svg>