<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <rect width="880" height="430" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="830" height="390" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">How Full Retirement Age Is Statutorily Calculated</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Step-by-step logic from date of birth to 100% Primary Insurance Amount milestone</text>

  <!-- Step 1 -->
  <g transform="translate(50, 120)">
    <rect width="180" height="180" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#075433"/>
    <text x="30" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="54" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Date of Birth</text>
    
    <text x="18" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433">Identify Year</text>
    <text x="18" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Check exact calendar</text>
    <text x="18" y="108" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">birth year.</text>
    <text x="18" y="132" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C82333">January 1 Rule:</text>
    <text x="18" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Uses prior birth year</text>
  </g>

  <!-- Arrow 1 -->
  <polygon points="245,210 255,215 245,220" fill="#075433"/>
  <line x1="235" y1="215" x2="250" y2="215" stroke="#075433" stroke-width="2.5"/>

  <!-- Step 2 -->
  <g transform="translate(265, 120)">
    <rect width="180" height="180" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#075433"/>
    <text x="30" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="54" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Cohort Tier</text>

    <text x="18" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433">Statutory Group</text>
    <text x="18" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Maps to 1 of 5 cohorts</text>
    <text x="18" y="108" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">under 1983 SSA</text>
    <text x="18" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Amendments.</text>
    <text x="18" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">• 1943–54: Age 66</text>
    <text x="18" y="166" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">• 1960+: Age 67</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="460,210 470,215 460,220" fill="#075433"/>
  <line x1="450" y1="215" x2="465" y2="215" stroke="#075433" stroke-width="2.5"/>

  <!-- Step 3 -->
  <g transform="translate(480, 120)">
    <rect width="180" height="180" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#075433"/>
    <text x="30" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="54" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Phase-In Mos</text>

    <text x="18" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433">+2 Mo per Year</text>
    <text x="18" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">For 1955–1959 births,</text>
    <text x="18" y="108" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">adds 2 months for</text>
    <text x="18" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">each single year:</text>
    <text x="18" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">1955: 66y + 2m</text>
    <text x="18" y="166" font-family="'Inter', sans-serif" font-size="11" fill="#042F2A">1959: 66y + 10m</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="675,210 685,215 675,220" fill="#075433"/>
  <line x1="665" y1="215" x2="680" y2="215" stroke="#075433" stroke-width="2.5"/>

  <!-- Step 4 -->
  <g transform="translate(695, 120)">
    <rect width="135" height="180" rx="8" fill="#042F2A" stroke="#075433" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#FF754D"/>
    <text x="28" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="50" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Exact FRA</text>

    <text x="16" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#9FE7BD">Attainment</text>
    <text x="16" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#D3E5DE">100% PIA benefit</text>
    <text x="16" y="112" font-family="'Inter', sans-serif" font-size="11" fill="#D3E5DE">milestone date</text>
    <text x="16" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#9FE7BD">Earnings test</text>
    <text x="16" y="154" font-family="'Inter', sans-serif" font-size="11" fill="#9FE7BD">disappears</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(50, 330)">
    <rect width="780" height="50" rx="6" fill="#075433"/>
    <text x="390" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Use our Social Security Age Calculator to instantly convert your date of birth into exact FRA milestone dates.</text>
  </g>
</svg>