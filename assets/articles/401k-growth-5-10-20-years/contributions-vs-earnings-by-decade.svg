<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="auto" role="img" aria-label="Contributions vs Earnings Across Decades">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="340" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">The Compounding Shift: Who Powers Your Growth?</text>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">In the early years, you do the heavy lifting. In later decades, accumulated returns take over completely.</text>

  <!-- Decade 1 -->
  <g transform="translate(60, 115)">
    <text x="100" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042f2a" text-anchor="middle">Decade 1 (Years 1–10)</text>
    <rect x="20" y="45" width="160" height="28" fill="#075433" rx="4"/>
    <text x="100" y="64" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Your Deposits (65%)</text>
    <rect x="20" y="80" width="86" height="28" fill="#ff754d" rx="4"/>
    <text x="63" y="99" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Growth (35%)</text>
    <text x="100" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Habit &amp; savings discipline matter most</text>
  </g>

  <!-- Decade 2 -->
  <g transform="translate(320, 115)">
    <text x="100" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042f2a" text-anchor="middle">Decade 2 (Years 11–20)</text>
    <rect x="20" y="45" width="100" height="28" fill="#075433" rx="4"/>
    <text x="70" y="64" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Deposits (40%)</text>
    <rect x="20" y="80" width="150" height="28" fill="#ff754d" rx="4"/>
    <text x="95" y="99" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Market Growth (60%)</text>
    <text x="100" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Returns match and exceed fresh deposits</text>
  </g>

  <!-- Decade 3 -->
  <g transform="translate(580, 115)">
    <text x="100" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042f2a" text-anchor="middle">Decade 3 (Years 21–30)</text>
    <rect x="20" y="45" width="50" height="28" fill="#075433" rx="4"/>
    <text x="45" y="64" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">20%</text>
    <rect x="20" y="80" width="190" height="28" fill="#ff754d" rx="4"/>
    <text x="115" y="99" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Compound Returns (80%)</text>
    <text x="100" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Snowball effect multiplies net worth</text>
  </g>
</svg>