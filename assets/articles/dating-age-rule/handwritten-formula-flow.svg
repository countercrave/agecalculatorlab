<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="max-width:100%;background:#fbfbf7;border-radius:12px;border:1px solid #e2ded5;font-family:'Caveat', 'Comic Sans MS', cursive, sans-serif;">
  <style>
    .paper-line { stroke: #eee9dc; stroke-width: 1; stroke-dasharray: 4,4; }
    .ink { fill: #1c3d31; }
    .ink-sub { fill: #48695d; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .box-rect { fill: #ffffff; stroke: #205c43; stroke-width: 2.2; rx: 10px; }
    .accent-box { fill: #e8f5ee; stroke: #075433; stroke-width: 2.5; rx: 12px; }
    .arrow-line { stroke: #e06847; stroke-width: 2.5; stroke-linecap: round; }
    .arrow-head { fill: #e06847; }
    .badge { fill: #ff754d; rx: 6px; }
  </style>

  <!-- Notebook Subtle Grid/Lines -->
  <line x1="40" y1="90" x2="760" y2="90" class="paper-line" />
  <line x1="40" y1="170" x2="760" y2="170" class="paper-line" />
  <line x1="40" y1="250" x2="760" y2="250" class="paper-line" />
  <line x1="40" y1="330" x2="760" y2="330" class="paper-line" />
  <line x1="40" y1="410" x2="760" y2="410" class="paper-line" />

  <!-- Diagram Title -->
  <text x="50" y="48" font-size="24" font-weight="700" class="ink" font-family="'Inter', sans-serif">Formula Flow: Half-Your-Age-Plus-Seven Rule</text>
  <text x="50" y="74" font-size="14" class="ink-sub">Step-by-step arithmetic sequence to calculate the rule-based lower age boundary</text>

  <!-- Step 1: Your Age -->
  <g transform="translate(60, 110)">
    <rect width="180" height="90" class="box-rect" />
    <text x="90" y="38" font-size="14" font-weight="700" text-anchor="middle" class="ink-sub" letter-spacing="1">STEP 1: INPUT</text>
    <text x="90" y="68" font-size="28" font-weight="700" text-anchor="middle" class="ink">Your Age</text>
    <text x="90" y="112" font-size="13" text-anchor="middle" class="ink-sub" fill="#666">(e.g., 40 Years)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 155 L 295 155" class="arrow-line" />
  <polygon points="300,155 290,149 290,161" class="arrow-head" />
  <text x="272" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#e06847" font-family="'Inter', sans-serif">÷ 2</text>

  <!-- Step 2: Divide by 2 -->
  <g transform="translate(305, 110)">
    <rect width="180" height="90" class="box-rect" />
    <text x="90" y="38" font-size="14" font-weight="700" text-anchor="middle" class="ink-sub" letter-spacing="1">STEP 2: HALVE</text>
    <text x="90" y="68" font-size="28" font-weight="700" text-anchor="middle" class="ink">Divide by 2</text>
    <text x="90" y="112" font-size="13" text-anchor="middle" class="ink-sub" fill="#666">(40 ÷ 2 = 20)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 490 155 L 540 155" class="arrow-line" />
  <polygon points="545,155 535,149 535,161" class="arrow-head" />
  <text x="517" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#e06847" font-family="'Inter', sans-serif">+ 7</text>

  <!-- Step 3: Add 7 (Result) -->
  <g transform="translate(550, 110)">
    <rect width="190" height="90" class="accent-box" />
    <text x="95" y="38" font-size="14" font-weight="700" text-anchor="middle" fill="#075433" font-family="'Inter', sans-serif" letter-spacing="1">STEP 3: RESULT</text>
    <text x="95" y="68" font-size="28" font-weight="700" text-anchor="middle" fill="#075433">Add 7</text>
    <text x="95" y="112" font-size="13" text-anchor="middle" class="ink-sub" fill="#075433">(20 + 7 = 27 Years)</text>
  </g>

  <!-- Worked Summary Banner -->
  <g transform="translate(60, 260)">
    <rect width="680" height="135" fill="#f2f7f4" stroke="#c0dcd0" stroke-width="1.5" rx="10" />
    <text x="30" y="38" font-size="17" font-weight="700" fill="#042f2a" font-family="'Inter', sans-serif">Worked Arithmetic Proof</text>
    <text x="30" y="70" font-size="22" font-weight="600" fill="#075433" font-family="'Courier New', monospace">Lower Bound = ⌊ (Age ÷ 2) + 7 ⌋</text>
    <text x="30" y="104" font-size="15" fill="#2d4a3e" font-family="'Inter', sans-serif">For a 30-year-old: 30 ÷ 2 = 15, then 15 + 7 = 22 years minimum rule boundary.</text>
    <text x="30" y="124" font-size="13" fill="#6d8a7e" font-family="'Inter', sans-serif">Note: Mathematical boundary only. Does not measure personal compatibility or legal eligibility.</text>
  </g>
</svg>
