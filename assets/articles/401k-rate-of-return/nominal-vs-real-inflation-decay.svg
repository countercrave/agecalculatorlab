<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%" role="img" aria-label="Nominal Return vs Real Purchasing Power">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="340" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">Nominal Return vs. Real Purchasing Power</text>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">A 7% nominal return produces wealth, but a 2.5% inflation rate reduces real purchasing power over time.</text>

  <!-- Graphic representation -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="340" height="190" fill="#f8faf9" rx="8" stroke="#075433"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a">Nominal Balance in 30 Years</text>
    <text x="20" y="70" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#075433">$1,500,000</text>
    <text x="20" y="98" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">The actual dollar amount printed on your bank statement in the year 2056.</text>
    <rect x="20" y="130" width="300" height="36" fill="#eaf3ee" rx="4"/>
    <text x="170" y="153" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433" text-anchor="middle">Reflects 7.0% Nominal Compounding</text>
  </g>

  <g transform="translate(440, 115)">
    <rect x="0" y="0" width="340" height="190" fill="#fff7f5" rx="8" stroke="#ff754d"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a">Today's Purchasing Power</text>
    <text x="20" y="70" font-family="'Fraunces', serif" font-size="28" font-weight="700" fill="#ff754d">$715,100</text>
    <text x="20" y="98" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">What that $1.5M will actually buy in groceries, housing, and healthcare in today's dollars.</text>
    <rect x="20" y="130" width="300" height="36" fill="#fdeee9" rx="4"/>
    <text x="170" y="153" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ff754d" text-anchor="middle">Discounted by 2.5% Annual Inflation</text>
  </g>
</svg>