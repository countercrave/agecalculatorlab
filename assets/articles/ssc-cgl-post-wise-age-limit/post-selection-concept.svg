<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="dec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="card-grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dec-bg)" />
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="74" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="30" y="30" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">CAREER DECISION BOARD // NOTIFICATION MAPPING</text>
    <text x="30" y="56" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700">Matching Candidate Aspirations with Statutory Age Boundaries</text>
  </g>

  <!-- 4 Decision Cards Layout -->
  <g transform="translate(60, 145)">
    <!-- Pathway 1: Inspector -->
    <g transform="translate(0, 0)">
      <rect width="250" height="420" rx="12" fill="url(#card-grad1)" stroke="#3B82F6" stroke-width="1.5" />
      <rect x="20" y="20" width="210" height="36" rx="6" fill="#1E3A8A" />
      <text x="125" y="44" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">EXECUTIVE PATH</text>
      
      <text x="24" y="88" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="17" font-weight="700">Inspector Cadres</text>
      <text x="24" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Central Excise / Income Tax</text>

      <line x1="24" y1="130" x2="226" y2="130" stroke="#334155" stroke-width="1" />

      <text x="24" y="160" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATUTORY BAND</text>
      <text x="24" y="185" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="18" font-weight="800">18&#8211;30 Years</text>

      <text x="24" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">KEY MINISTRIES</text>
      <text x="24" y="248" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; Dept of Revenue</text>
      <text x="24" y="270" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; CBIC / CBDT</text>
      <text x="24" y="292" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; Enforcement Dte</text>

      <rect x="20" y="340" width="210" height="60" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
      <text x="125" y="364" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Physical Standards Apply</text>
      <text x="125" y="384" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Height, Chest, Walking test</text>
    </g>

    <!-- Pathway 2: Section Officer -->
    <g transform="translate(276, 0)">
      <rect width="250" height="420" rx="12" fill="url(#card-grad1)" stroke="#06B6D4" stroke-width="1.5" />
      <rect x="20" y="20" width="210" height="36" rx="6" fill="#083344" />
      <text x="125" y="44" fill="#67E8F9" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">SECRETARIAT PATH</text>
      
      <text x="24" y="88" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="17" font-weight="700">Section Officers</text>
      <text x="24" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">ASO in Central Ministries</text>

      <line x1="24" y1="130" x2="226" y2="130" stroke="#334155" stroke-width="1" />

      <text x="24" y="160" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATUTORY BAND</text>
      <text x="24" y="185" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="18" font-weight="800">20&#8211;30 Years</text>

      <text x="24" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">KEY MINISTRIES</text>
      <text x="24" y="248" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; CSS (DoPT)</text>
      <text x="24" y="270" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; MEA (Foreign Postings)</text>
      <text x="24" y="292" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; IB &amp; Railways</text>

      <rect x="20" y="340" width="210" height="60" rx="8" fill="#0F172A" stroke="#083344" stroke-width="1" />
      <text x="125" y="364" fill="#67E8F9" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Minimum 20 Years Entry</text>
      <text x="125" y="384" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">18-19 yr olds not eligible</text>
    </g>

    <!-- Pathway 3: Auditor -->
    <g transform="translate(552, 0)">
      <rect width="250" height="420" rx="12" fill="url(#card-grad1)" stroke="#10B981" stroke-width="1.5" />
      <rect x="20" y="20" width="210" height="36" rx="6" fill="#064E3B" />
      <text x="125" y="44" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">AUDIT &amp; TAX PATH</text>
      
      <text x="24" y="88" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="17" font-weight="700">Auditor &amp; Tax Asst</text>
      <text x="24" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Group C Core Vacancies</text>

      <line x1="24" y1="130" x2="226" y2="130" stroke="#334155" stroke-width="1" />

      <text x="24" y="160" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATUTORY BAND</text>
      <text x="24" y="185" fill="#34D399" font-family="'Inter', sans-serif" font-size="18" font-weight="800">18&#8211;27 Years</text>

      <text x="24" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">KEY MINISTRIES</text>
      <text x="24" y="248" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; C&amp;AG / CGA</text>
      <text x="24" y="270" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; Defence Accounts</text>
      <text x="24" y="292" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; Direct / Indirect Taxes</text>

      <rect x="20" y="340" width="210" height="60" rx="8" fill="#0F172A" stroke="#064E3B" stroke-width="1" />
      <text x="125" y="364" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Lowest Maximum Ceiling</text>
      <text x="125" y="384" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Overage after age 27 (UR)</text>
    </g>

    <!-- Pathway 4: JSO -->
    <g transform="translate(828, 0)">
      <rect width="250" height="420" rx="12" fill="url(#card-grad1)" stroke="#A855F7" stroke-width="1.5" />
      <rect x="20" y="20" width="210" height="36" rx="6" fill="#3B0764" />
      <text x="125" y="44" fill="#F3E8FF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STATISTICS PATH</text>
      
      <text x="24" y="88" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="17" font-weight="700">Statistical Officer</text>
      <text x="24" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Junior Statistical Officer</text>

      <line x1="24" y1="130" x2="226" y2="130" stroke="#334155" stroke-width="1" />

      <text x="24" y="160" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATUTORY BAND</text>
      <text x="24" y="185" fill="#C084FC" font-family="'Inter', sans-serif" font-size="18" font-weight="800">18&#8211;32 Years</text>

      <text x="24" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">KEY MINISTRIES</text>
      <text x="24" y="248" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; MoSPI</text>
      <text x="24" y="270" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; Registrar General</text>
      <text x="24" y="292" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">&#8226; National Sample Survey</text>

      <rect x="20" y="340" width="210" height="60" rx="8" fill="#0F172A" stroke="#3B0764" stroke-width="1" />
      <text x="125" y="364" fill="#F3E8FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Highest Maximum Ceiling</text>
      <text x="125" y="384" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Academic criterion required</text>
    </g>
  </g>

  <!-- Bottom Clarification -->
  <g transform="translate(60, 580)">
    <rect width="1080" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="30" y="30" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">
      &#10003; Strategic Rule: Aspirants aged 28&#8211;30 are ineligible for Group C Auditor posts, but remain fully eligible for Group B Inspector &amp; ASO roles.
    </text>
  </g>
</svg>