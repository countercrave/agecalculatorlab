<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <pattern id="grid-lines" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.7" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#EAE5D9" />

  <g transform="translate(60, 35)">
    <rect x="8" y="8" width="1080" height="605" rx="8" fill="#000000" opacity="0.12" />
    <rect width="1080" height="605" rx="8" fill="#FCFAF2" stroke="#D5CEBE" stroke-width="1" />
    <rect x="50" y="40" width="980" height="525" fill="url(#grid-lines)" />

    <text x="60" y="65" fill="#475569" font-family="'Courier New', monospace" font-size="14" font-weight="700">FACULTY NOTES // COMMON CANDIDATE PITFALLS (SSC CGL 2026)</text>
    <line x1="60" y1="75" x2="1000" y2="75" stroke="#94A3B8" stroke-width="1" />

    <!-- Big Warning Note -->
    <g transform="translate(140, 110)">
      <rect width="800" height="65" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
      <text x="400" y="42" fill="#B91C1C" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="800" text-anchor="middle">
        &#9888; SSC CGL DOES NOT HAVE ONE AGE LIMIT FOR EVERY POST! &#9888;
      </text>
    </g>

    <!-- Golden Flow Order -->
    <g transform="translate(140, 215)">
      <text x="0" y="24" fill="#1E3A8A" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="700">Correct Order of Evaluation:</text>
      
      <rect x="0" y="45" width="220" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="110" y="70" fill="#1D4ED8" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 1</text>
      <text x="110" y="90" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700" text-anchor="middle">CHOOSE POST</text>

      <text x="245" y="82" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="26" font-weight="700">&#8594;</text>

      <rect x="280" y="45" width="220" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
      <text x="390" y="70" fill="#B45309" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 2</text>
      <text x="390" y="90" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700" text-anchor="middle">POST AGE BAND</text>

      <text x="525" y="82" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="26" font-weight="700">&#8594;</text>

      <rect x="560" y="45" width="220" height="60" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
      <text x="670" y="70" fill="#047857" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 3</text>
      <text x="670" y="90" fill="#065F46" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700" text-anchor="middle">CHECK DOB</text>
    </g>

    <!-- Faculty Reminders -->
    <g transform="translate(140, 360)">
      <rect width="800" height="180" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="30" y="36" fill="#1E3A8A" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700">Important Scrutiny Takeaways:</text>
      
      <text x="30" y="70" fill="#334155" font-family="'Courier New', monospace" font-size="13">
        1. Don't check 'SSC CGL Age' in isolation. A candidate aged 28 is OVERAGE for Tax Asst,
      </text>
      <text x="50" y="92" fill="#047857" font-family="'Courier New', monospace" font-size="13" font-weight="700">
        but 100% ELIGIBLE for Central Excise Inspector &amp; ASO in MEA!
      </text>

      <text x="30" y="124" fill="#334155" font-family="'Courier New', monospace" font-size="13">
        2. ASO roles have a minimum age of 20. 18-year-olds can only apply for Group C &amp; Inspectors.
      </text>

      <text x="30" y="156" fill="#B91C1C" font-family="'Courier New', monospace" font-size="13" font-weight="700">
        3. All limits reckon as on 01 AUGUST 2026. Age today does NOT decide your eligibility!
      </text>
    </g>
  </g>
</svg>