<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021510" />
      <stop offset="50%" stop-color="#05241C" />
      <stop offset="100%" stop-color="#0A362B" />
    </linearGradient>
    <linearGradient id="hub-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#14532D" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#dot-grid)" />
  <rect x="20" y="20" width="1160" height="635" rx="16" fill="none" stroke="#1D4D40" stroke-width="1.5" />

  <!-- Top Header Ribbon -->
  <g transform="translate(50, 40)">
    <rect width="1100" height="74" rx="10" fill="#021A14" stroke="#184D40" stroke-width="1" />
    <text x="30" y="30" fill="#34D399" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">STATUTORY CAREER ARCHITECTURE &#8226; SSC CGL 2026</text>
    <text x="30" y="56" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700">SSC CGL Career Map: Post Cadres Branching into Age Bands</text>
    <rect x="880" y="18" width="190" height="38" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1" />
    <text x="975" y="42" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CRUCIAL DATE: 01-AUG-2026</text>
  </g>

  <!-- Central Hub: SSC CGL Examination -->
  <g transform="translate(430, 150)">
    <rect width="340" height="85" rx="14" fill="url(#hub-grad)" stroke="#34D399" stroke-width="2" />
    <text x="170" y="36" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle">CENTRAL SELECTION PORTAL</text>
    <text x="170" y="64" fill="#FFFFFF" font-family="'Fraunces', serif" font-size="22" font-weight="800" text-anchor="middle">SSC CGL 2026 CADRES</text>
  </g>

  <!-- Branching Connector Trunk -->
  <line x1="600" y1="235" x2="600" y2="280" stroke="#34D399" stroke-width="2.5" />
  <!-- Horizontal Bus -->
  <line x1="180" y1="280" x2="1020" y2="280" stroke="#34D399" stroke-width="2.5" />

  <!-- Vertical drops to 4 branch cards -->
  <line x1="180" y1="280" x2="180" y2="330" stroke="#10B981" stroke-width="2" />
  <line x1="460" y1="280" x2="460" y2="330" stroke="#06B6D4" stroke-width="2" />
  <line x1="740" y1="280" x2="740" y2="330" stroke="#F59E0B" stroke-width="2" />
  <line x1="1020" y1="280" x2="1020" y2="330" stroke="#A855F7" stroke-width="2" />

  <!-- Card 1: 18-27 Band (Auditor / Tax Asst) -->
  <g transform="translate(50, 330)">
    <rect width="260" height="235" rx="12" fill="#031E18" stroke="#10B981" stroke-width="1.5" />
    <rect x="15" y="16" width="230" height="42" rx="8" fill="#064E3B" />
    <text x="130" y="42" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">18&#8211;27 YEARS BAND</text>
    
    <text x="20" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Clerical &amp; Audit Roles:</text>
    <text x="20" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Tax Assistant (CBDT / CBIC)</text>
    <text x="20" y="134" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Auditor (CAG, CGA, CGDA)</text>
    <text x="20" y="156" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Accountant / Jr. Accountant</text>
    <text x="20" y="178" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Upper Division Clerk (UDC)</text>

    <rect x="15" y="195" width="230" height="26" rx="6" fill="#022C22" />
    <text x="130" y="213" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Group C Support Cadres</text>
  </g>

  <!-- Card 2: 20-30 Band (ASO Cadres) -->
  <g transform="translate(330, 330)">
    <rect width="260" height="235" rx="12" fill="#031E18" stroke="#06B6D4" stroke-width="1.5" />
    <rect x="15" y="16" width="230" height="42" rx="8" fill="#083344" />
    <text x="130" y="42" fill="#67E8F9" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">20&#8211;30 YEARS BAND</text>
    
    <text x="20" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Section Officers (Min 20):</text>
    <text x="20" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; ASO in CSS (DoPT)</text>
    <text x="20" y="134" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; ASO in External Affairs (MEA)</text>
    <text x="20" y="156" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; ASO in Intelligence Bureau (IB)</text>
    <text x="20" y="178" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; ASO in Railway &amp; Defence</text>

    <rect x="15" y="195" width="230" height="26" rx="6" fill="#082F49" />
    <text x="130" y="213" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Group B Secretariat Cadres</text>
  </g>

  <!-- Card 3: 18-30 Band (Inspectors) -->
  <g transform="translate(610, 330)">
    <rect width="260" height="235" rx="12" fill="#031E18" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="15" y="16" width="230" height="42" rx="8" fill="#451A03" />
    <text x="130" y="42" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">18&#8211;30 YEARS BAND</text>
    
    <text x="20" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Executive &amp; Enforcement:</text>
    <text x="20" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Inspector (Central Excise / CGST)</text>
    <text x="20" y="134" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Inspector (Income Tax)</text>
    <text x="20" y="156" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Preventive Officer / Examiner</text>
    <text x="20" y="178" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Asst Enforcement Officer (ED)</text>

    <rect x="15" y="195" width="230" height="26" rx="6" fill="#2D1A05" />
    <text x="130" y="213" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Group B Executive Cadres</text>
  </g>

  <!-- Card 4: 18-32 Band (JSO) -->
  <g transform="translate(890, 330)">
    <rect width="260" height="235" rx="12" fill="#031E18" stroke="#A855F7" stroke-width="1.5" />
    <rect x="15" y="16" width="230" height="42" rx="8" fill="#3B0764" />
    <text x="130" y="42" fill="#F3E8FF" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">18&#8211;32 YEARS BAND</text>
    
    <text x="20" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Statistical Specialists:</text>
    <text x="20" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Junior Statistical Officer (JSO)</text>
    <text x="20" y="134" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Ministry of Statistics (MoSPI)</text>
    <text x="20" y="156" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Statistical Investigator Gr-II</text>
    <text x="20" y="178" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">&#8226; Degree with Statistics / Math 60%</text>

    <rect x="15" y="195" width="230" height="26" rx="6" fill="#240742" />
    <text x="130" y="213" fill="#C084FC" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Highest Maximum Base Age</text>
  </g>

  <!-- Bottom Clarification Bar -->
  <g transform="translate(50, 585)">
    <rect width="1100" height="50" rx="8" fill="#021A14" stroke="#184D40" stroke-width="1" />
    <text x="30" y="30" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">
      &#9733; Mandatory Principle: SSC CGL is one exam, but posts are governed by different recruitment rules. Always verify the age band for your specific vacancy code.
    </text>
  </g>
</svg>