<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>

  <rect width="840" height="480" fill="#FFFFFF" rx="16" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="55" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700" fill="#042F2A">Social Security FRA Schedule Progression by Cohort</text>
  <text x="40" y="82" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">How statutory Full Retirement Age evolved across birth years under the 1983 Amendments</text>

  <!-- Cohort 1 -->
  <g transform="translate(40, 115)">
    <rect width="760" height="58" rx="8" fill="#F4F8F6" stroke="#D3E5DE" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="58" rx="8" fill="#E6F5EE"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">1937 or Earlier</text>
    <text x="200" y="35" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042F2A">Full Retirement Age: 65 Years</text>
    <text x="600" y="35" font-family="'Inter', sans-serif" font-size="13" fill="#4B6358">Original statutory baseline</text>
  </g>

  <!-- Cohort 2 -->
  <g transform="translate(40, 185)">
    <rect width="760" height="58" rx="8" fill="#F4F8F6" stroke="#D3E5DE" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="58" rx="8" fill="#E6F5EE"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">1938 – 1942</text>
    <text x="200" y="35" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042F2A">65 Years + 2 to 10 Months</text>
    <text x="600" y="35" font-family="'Inter', sans-serif" font-size="13" fill="#4B6358">First 2-month phase-in</text>
  </g>

  <!-- Cohort 3 -->
  <g transform="translate(40, 255)">
    <rect width="760" height="58" rx="8" fill="#F4F8F6" stroke="#D3E5DE" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="58" rx="8" fill="#075433"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1943 – 1954</text>
    <text x="200" y="35" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042F2A">Full Retirement Age: 66 Years</text>
    <text x="600" y="35" font-family="'Inter', sans-serif" font-size="13" fill="#4B6358">Stable 11-year plateau</text>
  </g>

  <!-- Cohort 4 -->
  <g transform="translate(40, 325)">
    <rect width="760" height="58" rx="8" fill="#F4F8F6" stroke="#D3E5DE" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="58" rx="8" fill="#E6F5EE"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#075433">1955 – 1959</text>
    <text x="200" y="35" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#042F2A">66 Years + 2 to 10 Months</text>
    <text x="600" y="35" font-family="'Inter', sans-serif" font-size="13" fill="#4B6358">Second 2-month phase-in</text>
  </g>

  <!-- Cohort 5 -->
  <g transform="translate(40, 395)">
    <rect width="760" height="58" rx="8" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="160" height="58" rx="8" fill="#042F2A"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FF754D">1960 or Later</text>
    <text x="200" y="35" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Full Retirement Age: 67 Years</text>
    <text x="600" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#9FE7BD">Current law maximum benchmark</text>
  </g>
</svg>