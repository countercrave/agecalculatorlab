<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" style="max-width:900px;font-family:'Inter',system-ui,sans-serif;background:#042f2a;border-radius:12px;border:1px solid #1e684c;box-shadow:0 8px 24px rgba(0,0,0,0.25)">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20a67b"/>
      <stop offset="50%" stop-color="#ffd180"/>
      <stop offset="100%" stop-color="#ff754d"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" rx="12" fill="#042f2a"/>

  <!-- Title Badge -->
  <rect x="260" y="22" width="380" height="34" rx="17" fill="#0b3d2b" stroke="#9fe7bd" stroke-width="1.5"/>
  <text x="450" y="44" fill="#9fe7bd" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DATING RANGE SPAN BY DECADE</text>

  <!-- Horizontal Axis Labels (Ages 10 to 90) -->
  <line x1="160" y1="300" x2="840" y2="300" stroke="#1e684c" stroke-width="1.5"/>
  <text x="160" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 10</text>
  <text x="245" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 20</text>
  <text x="330" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 30</text>
  <text x="415" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 40</text>
  <text x="500" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 50</text>
  <text x="585" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 60</text>
  <text x="670" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 70</text>
  <text x="755" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 80</text>
  <text x="840" y="322" fill="#9fe7bd" font-size="11" text-anchor="middle">Age 90</text>

  <!-- Row 1: Age 20 (Range: 18* to 26, Span 8 yrs) -->
  <text x="130" y="96" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">Age 20</text>
  <rect x="228" y="80" width="68" height="26" rx="6" fill="url(#barGrad)" opacity="0.9"/>
  <text x="310" y="98" fill="#ffd180" font-size="12" font-weight="700">18* to 26 (Span: 8 yrs)</text>

  <!-- Row 2: Age 30 (Range: 22 to 46, Span 24 yrs) -->
  <text x="130" y="146" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">Age 30</text>
  <rect x="262" y="130" width="204" height="26" rx="6" fill="url(#barGrad)" opacity="0.9"/>
  <text x="480" y="148" fill="#ffd180" font-size="12" font-weight="700">22 to 46 (Span: 24 yrs)</text>

  <!-- Row 3: Age 40 (Range: 27 to 66, Span 39 yrs) -->
  <text x="130" y="196" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">Age 40</text>
  <rect x="305" y="180" width="331" height="26" rx="6" fill="url(#barGrad)" opacity="0.9"/>
  <text x="650" y="198" fill="#ffd180" font-size="12" font-weight="700">27 to 66 (Span: 39 yrs)</text>

  <!-- Row 4: Age 50 (Range: 32 to 86, Span 54 yrs) -->
  <text x="130" y="246" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">Age 50</text>
  <rect x="347" y="230" width="459" height="26" rx="6" fill="url(#barGrad)" opacity="0.9"/>
  <text x="815" y="248" fill="#ffd180" font-size="12" font-weight="700">32 to 86 (Span: 54 yrs)</text>

  <text x="450" y="348" fill="#d3e5de" font-size="11" text-anchor="middle">*Note: Minimum calculations for young adults are always bounded by the legal age of majority (18+).</text>
</svg>