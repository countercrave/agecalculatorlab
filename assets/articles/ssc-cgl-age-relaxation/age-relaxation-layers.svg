<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031612" />
      <stop offset="50%" stop-color="#06261E" />
      <stop offset="100%" stop-color="#0A362C" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#072F26" />
      <stop offset="100%" stop-color="#041E18" />
    </linearGradient>
    <linearGradient id="bar-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="bar-obc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bar-scst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bar-pwbd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bar-pwbd-scst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#164E40" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <rect x="20" y="20" width="1160" height="635" rx="16" fill="none" stroke="#236353" stroke-width="1.5" />

  <!-- Header Card -->
  <g transform="translate(50, 40)">
    <rect width="1100" height="76" rx="10" fill="#021A14" stroke="#1A4D41" stroke-width="1" />
    <text x="30" y="32" fill="#34D399" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">STATUTORY DATA VISUALIZATION &#8226; SSC CGL 2026</text>
    <text x="30" y="58" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700">Upper Age Ceiling Extension Corridors by Category</text>
    <rect x="880" y="20" width="190" height="36" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1" />
    <text x="975" y="43" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CRUCIAL DATE: 01-AUG-2026</text>
  </g>

  <!-- Left: Candidate Profile & Concept Panel -->
  <g transform="translate(50, 136)">
    <rect width="320" height="495" rx="12" fill="url(#card-grad)" stroke="#1B4D40" stroke-width="1" />
    
    <rect x="24" y="24" width="272" height="40" rx="8" fill="#021A14" />
    <text x="160" y="49" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">RELAXATION MECHANISM</text>

    <!-- Visual Stepper -->
    <g transform="translate(24, 85)">
      <circle cx="20" cy="24" r="14" fill="#0D9488" />
      <text x="20" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
      <text x="46" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Base Post Limit</text>
      <text x="46" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">e.g. 30 Yrs for Inspector</text>
    </g>

    <line x1="44" y1="130" x2="44" y2="160" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" />

    <g transform="translate(24, 165)">
      <circle cx="20" cy="24" r="14" fill="#F59E0B" />
      <text x="20" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
      <text x="46" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Add Category Years</text>
      <text x="46" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">+3 OBC, +5 SC/ST, +10 PwBD</text>
    </g>

    <line x1="44" y1="210" x2="44" y2="240" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" />

    <g transform="translate(24, 245)">
      <circle cx="20" cy="24" r="14" fill="#10B981" />
      <text x="20" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
      <text x="46" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Extended Ceiling</text>
      <text x="46" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Permissible age on crucial date</text>
    </g>

    <!-- Key Takeaway Card -->
    <rect x="24" y="340" width="272" height="130" rx="8" fill="#021A14" stroke="#1A4D41" stroke-width="1" />
    <text x="40" y="366" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="800">GOLDEN PRINCIPLE:</text>
    <text x="40" y="390" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" line-height="1.5">
      <tspan x="40" dy="0">Relaxation shifts ONLY the</tspan>
      <tspan x="40" dy="18">maximum age. Minimum entry</tspan>
      <tspan x="40" dy="18">age (18 / 20 years) remains</tspan>
      <tspan x="40" dy="18">strictly mandatory for all.</tspan>
    </text>
  </g>

  <!-- Right: Extended Age Bars (Horizontal Visualization against a 30-Yr Base) -->
  <g transform="translate(390, 136)">
    <rect width="760" height="495" rx="12" fill="url(#card-grad)" stroke="#1B4D40" stroke-width="1" />
    
    <!-- Scale Ruler at Top of Chart -->
    <g transform="translate(180, 20)">
      <line x1="0" y1="25" x2="540" y2="25" stroke="#33594F" stroke-width="1.5" />
      <!-- Tick marks for 18, 27, 30, 33, 35, 40, 45 -->
      <line x1="0" y1="20" x2="0" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">18</text>

      <line x1="180" y1="20" x2="180" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="180" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">27</text>

      <!-- 30 Yrs Benchmark Line (Base) -->
      <line x1="240" y1="20" x2="240" y2="445" stroke="#34D399" stroke-width="2" stroke-dasharray="4 3" />
      <text x="240" y="14" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">30 (BASE)</text>

      <line x1="300" y1="20" x2="300" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="300" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">33</text>

      <line x1="340" y1="20" x2="340" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="340" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">35</text>

      <line x1="440" y1="20" x2="440" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="440" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">40</text>

      <line x1="540" y1="20" x2="540" y2="30" stroke="#94A3B8" stroke-width="1" />
      <text x="540" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">45</text>
    </g>

    <!-- Row 1: General / UR Base -->
    <g transform="translate(24, 70)">
      <text x="0" y="24" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">General (UR)</text>
      <text x="0" y="40" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">No relaxation</text>
      <rect x="156" y="10" width="240" height="34" rx="6" fill="url(#bar-base)" />
      <text x="386" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="end">30 Yrs</text>
    </g>

    <!-- Row 2: OBC (+3) -->
    <g transform="translate(24, 140)">
      <text x="0" y="24" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">OBC (NCL)</text>
      <text x="0" y="40" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="10">+3 Years</text>
      <rect x="156" y="10" width="300" height="34" rx="6" fill="url(#bar-obc)" />
      <text x="446" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="end">33 Yrs (+3)</text>
    </g>

    <!-- Row 3: SC / ST (+5) -->
    <g transform="translate(24, 210)">
      <text x="0" y="24" fill="#DDD6FE" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SC / ST</text>
      <text x="0" y="40" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="10">+5 Years</text>
      <rect x="156" y="10" width="340" height="34" rx="6" fill="url(#bar-scst)" />
      <text x="486" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="end">35 Yrs (+5)</text>
    </g>

    <!-- Row 4: PwBD (+10) -->
    <g transform="translate(24, 280)">
      <text x="0" y="24" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PwBD (UR)</text>
      <text x="0" y="40" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10">+10 Years</text>
      <rect x="156" y="10" width="440" height="34" rx="6" fill="url(#bar-pwbd)" />
      <text x="586" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="end">40 Yrs (+10)</text>
    </g>

    <!-- Row 5: PwBD + SC/ST (+15) -->
    <g transform="translate(24, 350)">
      <text x="0" y="24" fill="#FBCFE8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PwBD (SC/ST)</text>
      <text x="0" y="40" fill="#F472B6" font-family="'Inter', sans-serif" font-size="10">+15 Years</text>
      <rect x="156" y="10" width="540" height="34" rx="6" fill="url(#bar-pwbd-scst)" />
      <text x="686" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="end">45 Yrs (+15)</text>
    </g>

    <!-- Bottom note in panel -->
    <rect x="24" y="420" width="712" height="55" rx="8" fill="#021A14" stroke="#1A4D41" stroke-width="1" />
    <text x="40" y="452" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">
      *Illustrated for standard 30-year post band (e.g. Central Excise &amp; IT Inspector). For 27-year posts, subtract 3 years; for 32-year JSO, add 2 years.
    </text>
  </g>
</svg>