<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Paper texture pattern -->
    <pattern id="paper-lines" width="100" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27" x2="100" y2="27" stroke="#E2E8F0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Desk Surface Background -->
  <rect width="1200" height="675" fill="#EAE5D9" />

  <!-- Sheet of Paper (slightly rotated / tilted) -->
  <g transform="translate(60, 35)">
    <!-- Shadow -->
    <rect x="10" y="10" width="1080" height="605" rx="8" fill="#000000" opacity="0.12" />
    <!-- Paper Sheet -->
    <rect width="1080" height="605" rx="8" fill="#FCFAF2" stroke="#D5CEBE" stroke-width="1" />
    <!-- Blue rule lines -->
    <rect x="80" y="60" width="970" height="520" fill="url(#paper-lines)" />
    <!-- Red left margin line -->
    <line x1="160" y1="20" x2="160" y2="585" stroke="#FCA5A5" stroke-width="2" />

    <!-- Paper Header -->
    <text x="180" y="65" fill="#1E293B" font-family="'Courier New', monospace" font-size="18" font-weight="700">SSC CGL 2026 &#8212; PREP DIARY // EXAM RULES</text>
    <text x="950" y="65" fill="#64748B" font-family="'Courier New', monospace" font-size="14">PAGE 42</text>
    <line x1="180" y1="75" x2="1020" y2="75" stroke="#94A3B8" stroke-width="1.2" />

    <!-- Big Warning Circled -->
    <g transform="translate(200, 115)">
      <ellipse cx="250" cy="30" rx="245" ry="34" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 3" />
      <text x="250" y="38" fill="#B91C1C" font-family="'Comic Sans MS', 'Chalkboard SE', 'Inter', cursive" font-size="22" font-weight="700" text-anchor="middle">&#9888; DON'T ADD YEARS BLINDLY! &#9888;</text>
    </g>

    <!-- Golden Flow Order -->
    <text x="180" y="215" fill="#0F172A" font-family="'Comic Sans MS', 'Chalkboard SE', 'Inter', cursive" font-size="18" font-weight="700">Correct Statutory Verification Sequence:</text>

    <!-- Step Sequence Boxes -->
    <g transform="translate(180, 240)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="130" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="65" y="24" fill="#1D4ED8" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 1</text>
      <text x="65" y="44" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="700" text-anchor="middle">POST CADRE</text>

      <text x="148" y="35" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="24" font-weight="700">&#8594;</text>

      <!-- Step 2 -->
      <rect x="175" y="0" width="135" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="242" y="24" fill="#1D4ED8" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 2</text>
      <text x="242" y="44" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="700" text-anchor="middle">BASE LIMIT</text>

      <text x="328" y="35" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="24" font-weight="700">&#8594;</text>

      <!-- Step 3 -->
      <rect x="355" y="0" width="135" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="422" y="24" fill="#1D4ED8" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 3</text>
      <text x="422" y="44" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="700" text-anchor="middle">CATEGORY</text>

      <text x="508" y="35" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="24" font-weight="700">&#8594;</text>

      <!-- Step 4 -->
      <rect x="535" y="0" width="145" height="55" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
      <text x="607" y="24" fill="#B45309" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 4</text>
      <text x="607" y="44" fill="#0F172A" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="700" text-anchor="middle">RELAXATION</text>

      <text x="698" y="35" fill="#DC2626" font-family="'Comic Sans MS', cursive" font-size="24" font-weight="700">&#8594;</text>

      <!-- Step 5 -->
      <rect x="725" y="0" width="130" height="55" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
      <text x="790" y="24" fill="#047857" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="700" text-anchor="middle">STEP 5</text>
      <text x="790" y="44" fill="#065F46" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="700" text-anchor="middle">CHECK DOB</text>
    </g>

    <!-- Handwritten Annotations & Real Examples -->
    <g transform="translate(180, 335)">
      <rect width="840" height="220" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      
      <text x="24" y="34" fill="#1E3A8A" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700">Teacher's Warning Notes:</text>
      
      <text x="24" y="68" fill="#334155" font-family="'Courier New', monospace" font-size="14">
        1. Relaxation applies to the specific POST MAXIMUM, not automatically across all posts!
      </text>
      <text x="50" y="92" fill="#047857" font-family="'Courier New', monospace" font-size="13">
        Example: Auditor Post (18&#8211;27) + OBC (+3) = 30 Yrs Max  [NOT 33!]
      </text>
      <text x="50" y="116" fill="#047857" font-family="'Courier New', monospace" font-size="13">
        Example: Inspector Post (18&#8211;30) + OBC (+3) = 33 Yrs Max
      </text>
      
      <text x="24" y="152" fill="#334155" font-family="'Courier New', monospace" font-size="14">
        2. Date of Reckoning is FIXED: 01-Aug-2026. Age today does NOT decide eligibility!
      </text>

      <text x="24" y="186" fill="#B91C1C" font-family="'Courier New', monospace" font-size="14" font-weight="700">
        3. Never stack relaxations manually (e.g. SC + OBC = NO). Use official notification code.
      </text>
    </g>
  </g>
</svg>