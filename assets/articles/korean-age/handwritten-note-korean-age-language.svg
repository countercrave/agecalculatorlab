<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Paper texture & colors -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="50%" stop-color="#FAF6EC"/>
      <stop offset="100%" stop-color="#F2ECD8"/>
    </linearGradient>
    <filter id="pageShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A3020" flood-opacity="0.12"/>
    </filter>
    <pattern id="ruledLines" width="100" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27" x2="100" y2="27" stroke="#E3DAC7" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Desk Background -->
  <rect width="800" height="600" fill="#E8DFD0"/>

  <!-- Notebook Page with Shadow -->
  <g transform="translate(50, 36)" filter="url(#pageShadow)">
    <rect width="700" height="528" rx="6" fill="url(#paperGrad)"/>
    <rect width="700" height="528" fill="url(#ruledLines)"/>
    
    <!-- Red margin line on left -->
    <line x1="72" y1="0" x2="72" y2="528" stroke="#F0B5AC" stroke-width="1.2"/>
    
    <!-- Spiral Ring Holes on top or left -->
    <circle cx="28" cy="60" r="5" fill="#E3DAC7"/>
    <circle cx="28" cy="140" r="5" fill="#E3DAC7"/>
    <circle cx="28" cy="220" r="5" fill="#E3DAC7"/>
    <circle cx="28" cy="300" r="5" fill="#E3DAC7"/>
    <circle cx="28" cy="380" r="5" fill="#E3DAC7"/>
    <circle cx="28" cy="460" r="5" fill="#E3DAC7"/>

    <!-- Notebook Content / Handwritten Language Study Notes -->
    
    <!-- Date & Header in corner -->
    <text x="96" y="44" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="18" font-weight="700" fill="#6B5B45">Korean Language Study • Unit 4: Age Expressions</text>
    <text x="610" y="44" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="15" fill="#8C7A62">2026.09.21</text>
    <line x1="96" y1="52" x2="650" y2="52" stroke="#2B2620" stroke-width="1.5"/>

    <!-- Core Rule Highlighter Box -->
    <rect x="94" y="74" width="310" height="34" rx="4" fill="#FFE57F" fill-opacity="0.55"/>
    <text x="104" y="98" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="22" font-weight="700" fill="#1C1814">Rule 1: AGE = 나이 (nai)</text>

    <!-- Rule 2 Highlighter Box -->
    <rect x="94" y="128" width="360" height="34" rx="4" fill="#C8E6C9" fill-opacity="0.6"/>
    <text x="104" y="152" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="22" font-weight="700" fill="#1C1814">Rule 2: years old = 살 (sal)  [Counter]</text>

    <!-- Visual Arrow Formula Diagram -->
    <g transform="translate(104, 192)">
      <!-- Native Number Box -->
      <rect x="0" y="0" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#2B2620" stroke-width="1.4"/>
      <text x="80" y="28" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="20" font-weight="700" fill="#075433" text-anchor="middle">Native Number</text>
      
      <!-- Plus Sign -->
      <text x="182" y="30" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="26" font-weight="700" fill="#2B2620">+</text>
      
      <!-- 살 Counter Box -->
      <rect x="204" y="0" width="100" height="46" rx="6" fill="#FFF0EB" stroke="#E55328" stroke-width="1.6"/>
      <text x="254" y="28" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#E55328" text-anchor="middle">살 (sal)</text>
      
      <!-- Arrow -->
      <path d="M 324 23 L 374 23 M 364 16 L 374 23 L 364 30" fill="none" stroke="#2B2620" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Stated Age Box -->
      <rect x="394" y="0" width="140" height="46" rx="6" fill="#FFFFFF" stroke="#2B2620" stroke-width="1.4"/>
      <text x="464" y="28" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="20" font-weight="700" fill="#042F2A" text-anchor="middle">Age in Years</text>
    </g>

    <!-- Important Caveat Annotation with Hand-drawn circle -->
    <g transform="translate(104, 260)">
      <rect x="0" y="0" width="530" height="66" rx="6" fill="#FFF9EB" stroke="#D97706" stroke-width="1.2"/>
      <text x="16" y="26" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="18" font-weight="700" fill="#B45309">⚠️ Watch out for number contractions!</text>
      <text x="16" y="50" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="16" fill="#3D3222">하나 → 한 살 (1)  •  둘 → 두 살 (2)  •  스물 → 스무 살 (20)</text>
    </g>

    <!-- Conversational Templates -->
    <g transform="translate(104, 348)">
      <text x="0" y="24" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="21" font-weight="700" fill="#075433">Q: 몇 살이에요?  =  How old are you?</text>
      <text x="0" y="56" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="21" font-weight="700" fill="#C2410C">A: 저는 [number] 살이에요.  =  I am [number] years old.</text>
      <text x="24" y="86" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="18" fill="#5D4E3A">e.g. 저는 스무 살이에요. (I am 20 years old.)</text>
      <text x="24" y="112" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="18" fill="#5D4E3A">e.g. 저는 서른 살이에요. (I am 30 years old.)</text>
    </g>

    <!-- Korean Stamp in Bottom Corner -->
    <g transform="translate(560, 420)">
      <circle cx="45" cy="45" r="36" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="80" stroke-opacity="0.8"/>
      <text x="45" y="42" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">한국어</text>
      <text x="45" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#C2410C" text-anchor="middle">VERIFIED</text>
    </g>
  </g>
</svg>