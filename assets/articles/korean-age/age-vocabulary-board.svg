<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="vbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FBFB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF5F2"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FCFA"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF754D"/>
      <stop offset="100%" stop-color="#E55328"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#042F2A" flood-opacity="0.06"/>
    </filter>
    <pattern id="paperTexture" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#CADCD4" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#vbBg)"/>
  <rect width="1200" height="675" fill="url(#paperTexture)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#headerGrad)"/>

  <!-- Top Category Eyebrow & Stamp -->
  <g transform="translate(80, 48)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#042F2A" fill-opacity="0.06"/>
    <text x="130" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" letter-spacing="1.5" text-anchor="middle">KOREAN LANGUAGE REFERENCE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="118" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#042F2A" letter-spacing="-0.5">Korean Age Vocabulary &amp; Expressions</text>
  <text x="80" y="148" font-family="'Inter', sans-serif" font-size="15" fill="#5D7069">Essential vocabulary, counters, and sentence patterns for asking and saying age in Korean.</text>

  <!-- Main Board Grid (3 Main Cards) -->
  
  <!-- Card 1: 나이 (nai) - The Word for Age -->
  <g transform="translate(80, 180)" filter="url(#cardShadow)">
    <rect width="326" height="320" rx="16" fill="url(#cardGrad)" stroke="#DDE7E2" stroke-width="1.5"/>
    <rect x="0" y="0" width="326" height="6" rx="3" fill="#075433"/>
    
    <g transform="translate(24, 28)">
      <rect width="78" height="24" rx="12" fill="#E8F4EC"/>
      <text x="39" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">NOUN</text>
      
      <!-- Hangul Core -->
      <text x="139" y="96" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="64" font-weight="700" fill="#042F2A" text-anchor="middle">나이</text>
      <text x="139" y="128" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FF754D" text-anchor="middle">[ na - i ]</text>
      
      <!-- English Translation -->
      <text x="139" y="164" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#075433" text-anchor="middle">"Age"</text>
      <line x1="20" y1="185" x2="258" y2="185" stroke="#EAEFEA" stroke-width="1"/>
      
      <!-- Description & Usage -->
      <text x="139" y="212" font-family="'Inter', sans-serif" font-size="13" fill="#3D5A51" text-anchor="middle">General noun referring to age.</text>
      <text x="139" y="234" font-family="'Inter', sans-serif" font-size="12" fill="#718B82" text-anchor="middle">Example: 나이가 어떻게 되세요?</text>
      <text x="139" y="254" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#5D7069" text-anchor="middle">(Polite standard: "What is your age?")</text>
    </g>
  </g>

  <!-- Card 2: 살 (sal) - The Age Counter -->
  <g transform="translate(436, 180)" filter="url(#cardShadow)">
    <rect width="326" height="320" rx="16" fill="url(#cardGrad)" stroke="#DDE7E2" stroke-width="1.5"/>
    <rect x="0" y="0" width="326" height="6" rx="3" fill="#FF754D"/>
    
    <g transform="translate(24, 28)">
      <rect width="88" height="24" rx="12" fill="#FFF1EC"/>
      <text x="44" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E55328" text-anchor="middle">COUNTER</text>
      
      <!-- Hangul Core -->
      <text x="139" y="96" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="64" font-weight="700" fill="#042F2A" text-anchor="middle">살</text>
      <text x="139" y="128" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#08745A" text-anchor="middle">[ sal ]</text>
      
      <!-- English Translation -->
      <text x="139" y="164" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">"Years Old"</text>
      <line x1="20" y1="185" x2="258" y2="185" stroke="#EAEFEA" stroke-width="1"/>
      
      <!-- Description & Usage -->
      <text x="139" y="212" font-family="'Inter', sans-serif" font-size="13" fill="#3D5A51" text-anchor="middle">Suffix attached to Native numbers.</text>
      <text x="139" y="234" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433" text-anchor="middle">스무 살 (seumu sal) = 20 years old</text>
      <text x="139" y="254" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#5D7069" text-anchor="middle">Never used alone; always follows a number.</text>
    </g>
  </g>

  <!-- Card 3: 몇 살이에요? - Key Question Phrase -->
  <g transform="translate(792, 180)" filter="url(#cardShadow)">
    <rect width="328" height="320" rx="16" fill="url(#cardGrad)" stroke="#DDE7E2" stroke-width="1.5"/>
    <rect x="0" y="0" width="328" height="6" rx="3" fill="#08745A"/>
    
    <g transform="translate(24, 28)">
      <rect width="98" height="24" rx="12" fill="#E8F4EC"/>
      <text x="49" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">CONVERSATION</text>
      
      <!-- Hangul Core -->
      <text x="140" y="94" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#042F2A" text-anchor="middle">몇 살이에요?</text>
      <text x="140" y="128" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#08745A" text-anchor="middle">[ myeot sal-ieyo? ]</text>
      
      <!-- English Translation -->
      <text x="140" y="164" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#075433" text-anchor="middle">"How old are you?"</text>
      <line x1="20" y1="185" x2="260" y2="185" stroke="#EAEFEA" stroke-width="1"/>
      
      <!-- Description & Usage -->
      <text x="140" y="212" font-family="'Inter', sans-serif" font-size="13" fill="#3D5A51" text-anchor="middle">Polite everyday question.</text>
      <text x="140" y="234" font-family="'Inter', sans-serif" font-size="12" fill="#718B82" text-anchor="middle">Answer: 저는 ___살이에요.</text>
      <text x="140" y="254" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#5D7069" text-anchor="middle">(I am ___ years old.)</text>
    </g>
  </g>

  <!-- Bottom Interactive Note Banner -->
  <g transform="translate(80, 532)">
    <rect width="1040" height="74" rx="12" fill="#042F2A"/>
    
    <!-- Decorative Icon / Hanja Stamp -->
    <rect x="24" y="17" width="40" height="40" rx="8" fill="#075433"/>
    <text x="44" y="43" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#FF754D" text-anchor="middle">齡</text>
    
    <text x="80" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">CRITICAL DISTINCTION FOR LEARNERS</text>
    <text x="80" y="56" font-family="'Inter', sans-serif" font-size="12.5" fill="#A9C9BD">
      "Age in Korean" refers to vocabulary (나이, 살) and native numbers — distinct from the traditional mathematical age-counting system.
    </text>
    
    <g transform="translate(900, 23)">
      <rect width="116" height="28" rx="6" fill="#FF754D"/>
      <text x="58" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LANGUAGE RULE</text>
    </g>
  </g>

  <!-- Clean outer border -->
  <rect x="1" y="1" width="1198" height="673" rx="0" fill="none" stroke="#DDE7E2" stroke-width="1"/>
</svg>