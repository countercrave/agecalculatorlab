<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#E2DDD5"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FBF7EE"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2923"/>
      <stop offset="50%" stop-color="#3A4A41"/>
      <stop offset="100%" stop-color="#121A16"/>
    </linearGradient>
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="10" stdDeviation="16" flood-color="#2D2820" flood-opacity="0.14"/>
    </filter>
    <filter id="subtleNoteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#2D2820" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Desk Surface -->
  <rect width="800" height="600" fill="url(#deskBg)"/>

  <!-- Calendar Page in background left -->
  <g transform="translate(60, 50) rotate(-4)" filter="url(#subtleNoteShadow)">
    <rect width="260" height="240" rx="8" fill="#FFFFFF" stroke="#D3CCC2"/>
    <!-- Calendar Top Binding Header -->
    <rect width="260" height="48" rx="8" fill="#042F2A"/>
    <text x="130" y="32" font-family="'Fraunces', Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">JUNE 2023</text>
    
    <!-- Big Date 28 -->
    <text x="130" y="140" font-family="'Fraunces', serif" font-size="76" font-weight="700" fill="#FF754D" text-anchor="middle">28</text>
    <text x="130" y="172" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#075433" text-anchor="middle">WEDNESDAY • 수요일</text>
    <text x="130" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#5D7069" text-anchor="middle">Civil Act Reform Takes Effect</text>
    
    <!-- Red Official Circle / Stamp around 28 -->
    <circle cx="130" cy="120" r="54" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.85"/>
  </g>

  <!-- Official Blank Legal Document in background right -->
  <g transform="translate(360, 40) rotate(3)" filter="url(#deskShadow)">
    <rect width="360" height="480" rx="6" fill="#FCFAF7" stroke="#D8D2C7"/>
    <!-- Document Header lines -->
    <rect x="40" y="40" width="160" height="12" rx="3" fill="#042F2A" fill-opacity="0.2"/>
    <rect x="40" y="60" width="280" height="6" rx="2" fill="#042F2A" fill-opacity="0.1"/>
    <rect x="40" y="74" width="260" height="6" rx="2" fill="#042F2A" fill-opacity="0.08"/>
    <rect x="40" y="88" width="240" height="6" rx="2" fill="#042F2A" fill-opacity="0.08"/>

    <!-- Red Korean Seal (도장) Stamp -->
    <g transform="translate(250, 120)">
      <rect width="64" height="64" rx="4" fill="none" stroke="#B91C1C" stroke-width="2.5"/>
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#B91C1C" stroke-width="1"/>
      <text x="32" y="32" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">대한</text>
      <text x="32" y="50" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">민국</text>
    </g>

    <!-- Document table lines -->
    <line x1="40" y1="210" x2="320" y2="210" stroke="#042F2A" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="40" y1="240" x2="320" y2="240" stroke="#042F2A" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="40" y1="270" x2="320" y2="270" stroke="#042F2A" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="40" y1="300" x2="320" y2="300" stroke="#042F2A" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- Central Prominent Study Note Sheet -->
  <g transform="translate(110, 180) rotate(1.5)" filter="url(#deskShadow)">
    <rect width="480" height="340" rx="4" fill="url(#paperGrad)" stroke="#D4C9B8" stroke-width="1"/>

    <!-- Left Margin Line -->
    <line x1="56" y1="0" x2="56" y2="340" stroke="#E59987" stroke-width="1" opacity="0.6"/>

    <!-- Ruled Blue Lines -->
    <line x1="20" y1="60" x2="460" y2="60" stroke="#C5D9CE" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="110" x2="460" y2="110" stroke="#C5D9CE" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="160" x2="460" y2="160" stroke="#C5D9CE" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="210" x2="460" y2="210" stroke="#C5D9CE" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="260" x2="460" y2="260" stroke="#C5D9CE" stroke-width="1" opacity="0.5"/>

    <!-- Hand-drawn Title / Date -->
    <text x="76" y="52" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#042F2A">June 28, 2023</text>
    
    <!-- Core Rule 1 -->
    <text x="76" y="98" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#075433">Full-age system (만 나이) becomes official standard.</text>
    
    <!-- Core Rule 2 (Handwritten Highlight) -->
    <g transform="translate(76, 134)">
      <!-- Yellow marker highlight behind -->
      <rect x="-4" y="-18" width="310" height="26" rx="4" fill="#FEF08A" opacity="0.75" transform="rotate(-0.5)"/>
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#991B1B">Traditional age ≠ official age</text>
    </g>

    <!-- Bullet Explanations -->
    <text x="76" y="196" font-family="'Inter', sans-serif" font-size="13" fill="#3D5A51">• Stated in all contracts, laws, and public forms.</text>
    <text x="76" y="222" font-family="'Inter', sans-serif" font-size="13" fill="#3D5A51">• Turns 0 at birth, increments strictly on birthdays.</text>
    
    <!-- Exceptions note -->
    <text x="76" y="260" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#B45309">Exceptions under separate acts:</text>
    <text x="76" y="282" font-family="'Inter', sans-serif" font-size="12" fill="#5D7069">School entrance, Military service, Tobacco &amp; Alcohol laws.</text>

    <!-- Hand-drawn curved underline -->
    <path d="M 76 104 Q 220 109 380 102" fill="none" stroke="#FF754D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Fountain Pen resting diagonally across bottom right -->
  <g transform="translate(560, 320) rotate(32)" filter="url(#deskShadow)">
    <!-- Pen Barrel -->
    <rect x="-8" y="0" width="16" height="220" rx="7" fill="url(#penBody)"/>
    <!-- Gold Trim Rings -->
    <rect x="-9" y="80" width="18" height="6" fill="#D97706"/>
    <rect x="-9" y="200" width="18" height="4" fill="#D97706"/>
    <!-- Pen Clip -->
    <rect x="6" y="15" width="4" height="60" rx="2" fill="#F59E0B"/>
    <!-- Nib Base -->
    <polygon points="-6,0 6,0 3,-30 -3,-30" fill="#D97706"/>
    <!-- Metallic Nib Tip -->
    <polygon points="-3,-30 3,-30 0,-48" fill="#FDE68A"/>
    <line x1="0" y1="-30" x2="0" y2="-44" stroke="#78350F" stroke-width="0.8"/>
  </g>
</svg>