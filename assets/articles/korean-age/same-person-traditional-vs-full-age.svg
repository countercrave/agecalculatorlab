<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="50%" stop-color="#074039"/>
      <stop offset="100%" stop-color="#021E1A"/>
    </linearGradient>
    <linearGradient id="idGlassLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="idGlassRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Subtle Radial Glow behind Person -->
  <circle cx="600" cy="340" r="280" fill="#08745A" fill-opacity="0.2"/>

  <!-- Top Title Banner -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <text y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FF9A77" letter-spacing="2">CONCEPTUAL ANALYSIS</text>
    <text y="36" font-family="'Fraunces', serif" font-size="32" font-weight="700" fill="#FFFFFF">One Individual • Two Coexisting Labels</text>
    <text y="64" font-family="'Inter', sans-serif" font-size="15" fill="#B4D1C7">Why Koreans became 1 to 2 years younger without changing biological age.</text>
  </g>

  <!-- Left Card: Traditional Korean Age -->
  <g transform="translate(100, 180)" filter="url(#glowShadow)">
    <rect width="360" height="380" rx="16" fill="url(#idGlassLeft)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
    
    <!-- Top badge -->
    <rect x="24" y="24" width="180" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="114" y="43" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D3E5DE" text-anchor="middle" letter-spacing="1">TRADITIONAL AGE</text>

    <!-- Hangul Subtitle -->
    <text x="24" y="90" font-family="'Fraunces', serif" font-size="20" font-weight="600" fill="#FFFFFF">세는 나이 (Seneun Nai)</text>
    <text x="24" y="112" font-family="'Inter', sans-serif" font-size="12" fill="#A9C9BD">Cultural &amp; Social Counting</text>

    <!-- Big Number -->
    <text x="180" y="230" font-family="'Inter', sans-serif" font-size="108" font-weight="800" fill="#FF9A77" text-anchor="middle">30</text>
    <text x="180" y="262" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">YEARS OLD</text>

    <!-- Explanation Box -->
    <rect x="24" y="290" width="312" height="64" rx="8" fill="#000000" fill-opacity="0.25"/>
    <text x="40" y="316" font-family="'Inter', sans-serif" font-size="12" fill="#E2ECE8">• Starts at 1 on birth day</text>
    <text x="40" y="338" font-family="'Inter', sans-serif" font-size="12" fill="#E2ECE8">• Increments every January 1st</text>
  </g>

  <!-- Central Person Silhouette -->
  <g transform="translate(530, 200)">
    <!-- Elegant Person Silhouette Profile -->
    <circle cx="70" cy="60" r="44" fill="#FFFFFF" fill-opacity="0.85"/>
    <path d="M 0 260 C 0 160, 40 130, 70 130 C 100 130, 140 160, 140 260 Z" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- Central Linking Badge -->
    <g transform="translate(70, 310)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#FF754D" filter="url(#glowShadow)"/>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#0D2B23" text-anchor="middle" letter-spacing="0.5">SAME PERSON • SAME DOB</text>
    </g>
  </g>

  <!-- Right Card: Full Age (Standardized Legal) -->
  <g transform="translate(740, 180)" filter="url(#glowShadow)">
    <rect width="360" height="380" rx="16" fill="url(#idGlassRight)" stroke="#34D399" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Top badge -->
    <rect x="24" y="24" width="200" height="28" rx="14" fill="#075433"/>
    <text x="124" y="43" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">OFFICIAL LEGAL AGE</text>

    <!-- Hangul Subtitle -->
    <text x="24" y="90" font-family="'Fraunces', serif" font-size="20" font-weight="600" fill="#FFFFFF">만 나이 (Man Nai)</text>
    <text x="24" y="112" font-family="'Inter', sans-serif" font-size="12" fill="#34D399">Standardized Civil Act Standard</text>

    <!-- Big Number -->
    <text x="180" y="230" font-family="'Inter', sans-serif" font-size="108" font-weight="800" fill="#34D399" text-anchor="middle">28</text>
    <text x="180" y="262" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">YEARS OLD</text>

    <!-- Explanation Box -->
    <rect x="24" y="290" width="312" height="64" rx="8" fill="#000000" fill-opacity="0.25"/>
    <text x="40" y="316" font-family="'Inter', sans-serif" font-size="12" fill="#E2ECE8">• Starts at 0 on birth day</text>
    <text x="40" y="338" font-family="'Inter', sans-serif" font-size="12" fill="#E2ECE8">• Increments only on exact birthday</text>
  </g>

  <!-- Bottom Comparison Banner -->
  <g transform="translate(600, 620)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D3E5DE">
      Example: Born November 15, 1995 • Checked on May 2024 → Legal: 28 Years | Cultural: 30 Years (2 Years Gap)
    </text>
  </g>
</svg>