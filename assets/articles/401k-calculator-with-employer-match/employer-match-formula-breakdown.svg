<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%" role="img" aria-label="Employer Match Formula Breakdown Diagram">
  <rect width="840" height="360" rx="14" fill="#042F2A"/>
  <rect x="18" y="18" width="804" height="324" rx="10" fill="#075433" stroke="#20A67B" stroke-width="1.5"/>
  
  <text x="420" y="52" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="21" font-weight="700" text-anchor="middle">Deconstructing “50% Match Up to 6% of Salary”</text>
  <text x="420" y="76" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Worked Mathematical Flow on an $80,000 Annual Salary With an 8% Employee Contribution</text>

  <!-- Step 1: Your Gross Pay -->
  <g transform="translate(45, 105)">
    <rect width="210" height="185" rx="8" fill="#042F2A" stroke="#20A67B" stroke-width="1.5"/>
    <text x="105" y="32" fill="#9FE7BD" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">1. Your Contribution</text>
    <line x1="20" y1="46" x2="190" y2="46" stroke="#20A67B" stroke-width="1"/>
    <text x="20" y="74" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">Salary: $80,000</text>
    <text x="20" y="96" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">You contribute: 8%</text>
    <text x="20" y="122" fill="#FFD180" font-family="'Inter', sans-serif" font-size="14" font-weight="700">$6,400 / year</text>
    <text x="20" y="148" fill="#9FE7BD" font-family="'Inter', sans-serif" font-size="11">Matched Portion: $4,800</text>
    <text x="20" y="168" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11">Unmatched Excess: $1,600</text>
  </g>

  <!-- Plus -->
  <text x="285" y="200" fill="#FFD180" font-family="'Fraunces', serif" font-size="28" font-weight="700" text-anchor="middle">+</text>

  <!-- Step 2: Company Match -->
  <g transform="translate(315, 105)">
    <rect width="210" height="185" rx="8" fill="#042F2A" stroke="#FF754D" stroke-width="1.5"/>
    <text x="105" y="32" fill="#FFAB91" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">2. Company Match</text>
    <line x1="20" y1="46" x2="190" y2="46" stroke="#FF754D" stroke-width="1"/>
    <text x="20" y="74" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">Match Cap: 6% of Salary</text>
    <text x="20" y="96" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">Company matches: 50%</text>
    <text x="20" y="122" fill="#FF754D" font-family="'Inter', sans-serif" font-size="14" font-weight="700">$2,400 / year</text>
    <text x="20" y="148" fill="#FFAB91" font-family="'Inter', sans-serif" font-size="11">Instant 50% ROI on first $4.8K</text>
    <text x="20" y="168" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11">100% Free Compensation</text>
  </g>

  <!-- Equals -->
  <text x="555" y="200" fill="#FFD180" font-family="'Fraunces', serif" font-size="28" font-weight="700" text-anchor="middle">=</text>

  <!-- Step 3: Combined Inflow -->
  <g transform="translate(585, 105)">
    <rect width="210" height="185" rx="8" fill="#042F2A" stroke="#FFD180" stroke-width="2"/>
    <text x="105" y="32" fill="#FFD180" font-family="'Fraunces', serif" font-size="16" font-weight="700" text-anchor="middle">3. Total Annual Inflow</text>
    <line x1="20" y1="46" x2="190" y2="46" stroke="#FFD180" stroke-width="1"/>
    <text x="20" y="74" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">Total entering 401(k):</text>
    <text x="20" y="96" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12">$6,400 + $2,400</text>
    <text x="20" y="122" fill="#FFD180" font-family="'Inter', sans-serif" font-size="16" font-weight="800">$8,800 / year</text>
    <text x="20" y="148" fill="#9FE7BD" font-family="'Inter', sans-serif" font-size="11">Effective Savings Rate: 11%</text>
    <text x="20" y="168" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="11">Ready to compound</text>
  </g>

  <text x="420" y="320" fill="#D3E5DE" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
    The extra 2% from the employee does not earn match, but continues compounding toward retirement wealth.
  </text>
</svg>