<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#091e17; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14"/>
      <stop offset="50%" stop-color="#09291e"/>
      <stop offset="100%" stop-color="#04140e"/>
    </linearGradient>
    <linearGradient id="b1G" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="b2G" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="b3G" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b4G" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgG)"/>
  <rect width="1200" height="675" fill="url(#gridP)"/>

  <!-- Top Header Pill -->
  <g transform="translate(60, 45)">
    <rect width="270" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="36" y="22" font-size="12" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">OFFICIAL SSC CGL CORRIDORS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="125" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Post-Wise Age Eligibility Map 2026</text>
  <text x="60" y="155" font-size="15" fill="#94a3b8">The 4 Statutory Age Bands reckoned as of 01 August 2026 (DoPT Guidelines)</text>

  <!-- Timeline Scale (Ages 16 to 34) -->
  <!-- Left = 280, Right = 1100, Span = 820px (approx 45.55px per year from 16 to 34) -->
  <!-- 16: 280, 18: 371, 20: 462, 27: 781, 30: 918, 32: 1009, 34: 1100 -->
  <g transform="translate(0, 195)">
    <!-- Scale Base Line -->
    <line x1="280" y1="30" x2="1100" y2="30" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    
    <!-- Age markers -->
    <!-- 18 -->
    <line x1="371" y1="20" x2="371" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="371" y="18" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">18 YRS</text>
    <text x="371" y="3" font-size="10" fill="#94a3b8" text-anchor="middle">MIN AGE</text>

    <!-- 20 -->
    <line x1="462" y1="20" x2="462" y2="400" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="462" y="18" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">20 YRS</text>

    <!-- 27 -->
    <line x1="781" y1="20" x2="781" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="781" y="18" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">27 YRS</text>

    <!-- 30 -->
    <line x1="918" y1="20" x2="918" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="918" y="18" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">30 YRS</text>

    <!-- 32 -->
    <line x1="1009" y1="20" x2="1009" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="1009" y="18" font-size="13" font-weight="700" fill="#ec4899" text-anchor="middle">32 YRS</text>
    <text x="1009" y="3" font-size="10" fill="#94a3b8" text-anchor="middle">MAX BASE</text>
  </g>

  <!-- CORRIDOR 1: 18 - 27 (Tax Assistant, Auditor, Accountant) -->
  <g transform="translate(60, 260)">
    <!-- Label -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#ffffff">Band 1: 18–27 Yrs</text>
    <text x="16" y="46" font-size="11" fill="#94a3b8">Auditor, Tax Asst, UDC</text>
    
    <!-- Corridor Bar (371 to 781 => x=311, width=410) -->
    <rect x="311" y="12" width="410" height="36" rx="18" fill="url(#b1G)" fill-opacity="0.85" filter="url(#glow)"/>
    <text x="325" y="35" font-size="12" font-weight="800" fill="#ffffff">18</text>
    <text x="516" y="35" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">9-YEAR ELIGIBILITY SPAN</text>
    <text x="707" y="35" font-size="12" font-weight="800" fill="#ffffff" text-anchor="end">27</text>
  </g>

  <!-- CORRIDOR 2: 20 - 30 (ASO CSS, MEA, IB, Railway) -->
  <g transform="translate(60, 345)">
    <!-- Label -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#ffffff">Band 2: 20–30 Yrs</text>
    <text x="16" y="46" font-size="11" fill="#94a3b8">ASO (CSS, MEA, IB, Rail)</text>
    
    <!-- Corridor Bar (462 to 918 => x=402, width=456) -->
    <rect x="402" y="12" width="456" height="36" rx="18" fill="url(#b2G)" fill-opacity="0.85" filter="url(#glow)"/>
    <text x="416" y="35" font-size="12" font-weight="800" fill="#ffffff">20</text>
    <text x="630" y="35" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">10-YEAR ELIGIBILITY SPAN</text>
    <text x="844" y="35" font-size="12" font-weight="800" fill="#ffffff" text-anchor="end">30</text>
  </g>

  <!-- CORRIDOR 3: 18 - 30 (Inspectors: Excise, IT, Prev, Exam) -->
  <g transform="translate(60, 430)">
    <!-- Label -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#ffffff">Band 3: 18–30 Yrs</text>
    <text x="16" y="46" font-size="11" fill="#94a3b8">Inspectors (Excise, IT, PO)</text>
    
    <!-- Corridor Bar (371 to 918 => x=311, width=547) -->
    <rect x="311" y="12" width="547" height="36" rx="18" fill="url(#b3G)" fill-opacity="0.85" filter="url(#glow)"/>
    <text x="325" y="35" font-size="12" font-weight="800" fill="#ffffff">18</text>
    <text x="584" y="35" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">12-YEAR ELIGIBILITY SPAN</text>
    <text x="844" y="35" font-size="12" font-weight="800" fill="#ffffff" text-anchor="end">30</text>
  </g>

  <!-- CORRIDOR 4: 18 - 32 (Junior Statistical Officer - JSO) -->
  <g transform="translate(60, 515)">
    <!-- Label -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#ffffff">Band 4: 18–32 Yrs</text>
    <text x="16" y="46" font-size="11" fill="#94a3b8">JSO (Statistics Cadre)</text>
    
    <!-- Corridor Bar (371 to 1009 => x=311, width=638) -->
    <rect x="311" y="12" width="638" height="36" rx="18" fill="url(#b4G)" fill-opacity="0.85" filter="url(#glow)"/>
    <text x="325" y="35" font-size="12" font-weight="800" fill="#ffffff">18</text>
    <text x="630" y="35" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">14-YEAR ELIGIBILITY SPAN (WIDEST)</text>
    <text x="935" y="35" font-size="12" font-weight="800" fill="#ffffff" text-anchor="end">32</text>
  </g>

  <!-- Bottom Legend / Note -->
  <g transform="translate(60, 615)">
    <rect width="1080" height="38" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="20" cy="19" r="4" fill="#10b981"/>
    <text x="34" y="24" font-size="12" fill="#cbd5e1">Crucial Date: <tspan font-weight="700" fill="#ffffff">01 August 2026</tspan> | Category relaxations add up to +3y (OBC), +5y (SC/ST), +10–15y (PwBD) to these maximums.</text>
  </g>
</svg>
