<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0c1e19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="cCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a332a"/>
      <stop offset="100%" stop-color="#10241d"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#091b15"/>
  <circle cx="200" cy="150" r="300" fill="#10b981" fill-opacity="0.03" filter="blur(60px)"/>
  <circle cx="1000" cy="500" r="300" fill="#3b82f6" fill-opacity="0.03" filter="blur(60px)"/>

  <!-- Top Badge & Header -->
  <g transform="translate(80, 50)">
    <rect width="260" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="20" y="21" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="1">REAL-WORLD CASE STUDIES</text>
  </g>
  <text x="80" y="125" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">SSC CGL Candidate Eligibility Profiles</text>
  <text x="80" y="155" font-size="15" fill="#94a3b8">How age on 1 August 2026 determines post eligibility across different bands</text>

  <!-- CANDIDATE A (Age 26) -->
  <g transform="translate(80, 200)" filter="url(#cShadow)">
    <rect width="320" height="400" rx="16" fill="url(#cCardBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Profile Header -->
    <rect x="0" y="0" width="320" height="60" rx="16" fill="#064e3b" fill-opacity="0.6"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#ffffff">Candidate A</text>
    <rect x="220" y="18" width="80" height="24" rx="12" fill="#10b981"/>
    <text x="260" y="34" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AGE 26</text>

    <!-- DOB & Details -->
    <text x="24" y="90" font-size="12" fill="#94a3b8">DATE OF BIRTH</text>
    <text x="24" y="112" font-size="16" font-weight="700" fill="#ffffff">15 June 2000</text>

    <text x="24" y="145" font-size="12" fill="#94a3b8">CATEGORY: <tspan font-weight="700" fill="#e2e8f0">General / UR</tspan></text>
    <line x1="24" y1="165" x2="296" y2="165" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Status Against Bands -->
    <text x="24" y="195" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">ELIGIBILITY VERDICT:</text>
    
    <!-- Band 1: 18-27 -->
    <rect x="24" y="210" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="232" font-size="12" fill="#e2e8f0">18–27 Yrs (Auditor/TA)</text>
    <text x="280" y="232" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ ELIGIBLE</text>

    <!-- Band 2: 20-30 -->
    <rect x="24" y="252" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="274" font-size="12" fill="#e2e8f0">20–30 Yrs (ASO Cadre)</text>
    <text x="280" y="274" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ ELIGIBLE</text>

    <!-- Band 3: 18-30 -->
    <rect x="24" y="294" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="316" font-size="12" fill="#e2e8f0">18–30 Yrs (Inspectors)</text>
    <text x="280" y="316" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ ELIGIBLE</text>

    <!-- Band 4: 18-32 -->
    <rect x="24" y="336" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="358" font-size="12" fill="#e2e8f0">18–32 Yrs (JSO)</text>
    <text x="280" y="358" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ ELIGIBLE</text>
  </g>

  <!-- CANDIDATE B (Age 30) -->
  <g transform="translate(440, 200)" filter="url(#cShadow)">
    <rect width="320" height="400" rx="16" fill="url(#cCardBg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Profile Header -->
    <rect x="0" y="0" width="320" height="60" rx="16" fill="#78350f" fill-opacity="0.6"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#ffffff">Candidate B</text>
    <rect x="220" y="18" width="80" height="24" rx="12" fill="#f59e0b"/>
    <text x="260" y="34" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AGE 30</text>

    <!-- DOB & Details -->
    <text x="24" y="90" font-size="12" fill="#94a3b8">DATE OF BIRTH</text>
    <text x="24" y="112" font-size="16" font-weight="700" fill="#ffffff">10 Sept 1995</text>

    <text x="24" y="145" font-size="12" fill="#94a3b8">CATEGORY: <tspan font-weight="700" fill="#e2e8f0">General / UR</tspan></text>
    <line x1="24" y1="165" x2="296" y2="165" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Status Against Bands -->
    <text x="24" y="195" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">ELIGIBILITY VERDICT:</text>
    
    <!-- Band 1: 18-27 -->
    <rect x="24" y="210" width="272" height="34" rx="8" fill="#7f1d1d" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="40" y="232" font-size="12" fill="#e2e8f0">18–27 Yrs (Auditor/TA)</text>
    <text x="280" y="232" font-size="13" font-weight="800" fill="#f87171" text-anchor="end">✕ OVERAGE</text>

    <!-- Band 2: 20-30 -->
    <rect x="24" y="252" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="274" font-size="12" fill="#e2e8f0">20–30 Yrs (ASO Cadre)</text>
    <text x="280" y="274" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ BORDERLINE</text>

    <!-- Band 3: 18-30 -->
    <rect x="24" y="294" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="316" font-size="12" fill="#e2e8f0">18–30 Yrs (Inspectors)</text>
    <text x="280" y="316" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ BORDERLINE</text>

    <!-- Band 4: 18-32 -->
    <rect x="24" y="336" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="358" font-size="12" fill="#e2e8f0">18–32 Yrs (JSO)</text>
    <text x="280" y="358" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ ELIGIBLE</text>
  </g>

  <!-- CANDIDATE C (Age 32) -->
  <g transform="translate(800, 200)" filter="url(#cShadow)">
    <rect width="320" height="400" rx="16" fill="url(#cCardBg)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Profile Header -->
    <rect x="0" y="0" width="320" height="60" rx="16" fill="#831843" fill-opacity="0.6"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#ffffff">Candidate C</text>
    <rect x="220" y="18" width="80" height="24" rx="12" fill="#ec4899"/>
    <text x="260" y="34" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AGE 32</text>

    <!-- DOB & Details -->
    <text x="24" y="90" font-size="12" fill="#94a3b8">DATE OF BIRTH</text>
    <text x="24" y="112" font-size="16" font-weight="700" fill="#ffffff">20 July 1994</text>

    <text x="24" y="145" font-size="12" fill="#94a3b8">CATEGORY: <tspan font-weight="700" fill="#e2e8f0">General / UR</tspan></text>
    <line x1="24" y1="165" x2="296" y2="165" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Status Against Bands -->
    <text x="24" y="195" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">ELIGIBILITY VERDICT:</text>
    
    <!-- Band 1: 18-27 -->
    <rect x="24" y="210" width="272" height="34" rx="8" fill="#7f1d1d" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="40" y="232" font-size="12" fill="#e2e8f0">18–27 Yrs (Auditor/TA)</text>
    <text x="280" y="232" font-size="13" font-weight="800" fill="#f87171" text-anchor="end">✕ OVERAGE</text>

    <!-- Band 2: 20-30 -->
    <rect x="24" y="252" width="272" height="34" rx="8" fill="#7f1d1d" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="40" y="274" font-size="12" fill="#e2e8f0">20–30 Yrs (ASO Cadre)</text>
    <text x="280" y="274" font-size="13" font-weight="800" fill="#f87171" text-anchor="end">✕ OVERAGE</text>

    <!-- Band 3: 18-30 -->
    <rect x="24" y="294" width="272" height="34" rx="8" fill="#7f1d1d" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="40" y="316" font-size="12" fill="#e2e8f0">18–30 Yrs (Inspectors)</text>
    <text x="280" y="316" font-size="13" font-weight="800" fill="#f87171" text-anchor="end">✕ OVERAGE</text>

    <!-- Band 4: 18-32 -->
    <rect x="24" y="336" width="272" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="358" font-size="12" fill="#e2e8f0">18–32 Yrs (JSO)</text>
    <text x="280" y="358" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">✓ JSO ONLY</text>
  </g>
</svg>
