<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">SYMMETRIC DATING AGE RANGE: MINIMUM vs. MAXIMUM</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">TWO-SIDED BOUNDARY COMPARISON FOR AGE 40</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(85, 130)">
    <!-- Central Anchor Box -->
    <rect x="250" y="0" width="130" height="60" rx="6" fill="#042f2a"/>
    <text x="315" y="24" text-anchor="middle" fill="#9fe7bd" font-size="11" font-weight="700">YOUR AGE</text>
    <text x="315" y="48" text-anchor="middle" fill="#ffffff" font-size="22" font-family="'Georgia', serif" font-weight="700">40</text>
    
    <!-- Timeline Axis -->
    <line x1="30" y1="120" x2="600" y2="120" stroke="#042f2a" stroke-width="2.5"/>
    
    <!-- Left Pin: Minimum -->
    <circle cx="120" cy="120" r="8" fill="#075433"/>
    <line x1="120" y1="75" x2="120" y2="112" stroke="#075433" stroke-width="2"/>
    <rect x="50" y="30" width="140" height="42" rx="4" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="120" y="48" text-anchor="middle" fill="#075433" font-size="11" font-weight="700">MINIMUM: 27</text>
    <text x="120" y="62" text-anchor="middle" fill="#52796f" font-size="10">40 ÷ 2 + 7</text>
    
    <!-- Middle Pin: Subject -->
    <circle cx="315" cy="120" r="10" fill="#ff754d"/>
    <text x="315" y="145" text-anchor="middle" fill="#042f2a" font-size="12" font-weight="700">Age 40</text>
    
    <!-- Right Pin: Maximum -->
    <circle cx="510" cy="120" r="8" fill="#a83f21"/>
    <line x1="510" y1="75" x2="510" y2="112" stroke="#a83f21" stroke-width="2"/>
    <rect x="440" y="30" width="140" height="42" rx="4" fill="#fcf6f3" stroke="#f2cfc2" stroke-width="1"/>
    <text x="510" y="48" text-anchor="middle" fill="#a83f21" font-size="11" font-weight="700">MAXIMUM: 66</text>
    <text x="510" y="62" text-anchor="middle" fill="#66463c" font-size="10">(40 − 7) × 2</text>
    
    <!-- Highlight Range Band -->
    <rect x="120" y="170" width="390" height="45" rx="6" fill="#eaf4ef" stroke="#075433" stroke-width="1.5"/>
    <text x="315" y="198" text-anchor="middle" fill="#075433" font-size="14" font-weight="700">Calculated Dating Range for Age 40: 27 to 66 Years Old</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>