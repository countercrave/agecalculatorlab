<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#F7FAF8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#042F2A" flood-opacity="0.07" />
    </filter>
    <linearGradient id="flowPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075433" />
      <stop offset="100%" stop-color="#042F2A" />
    </linearGradient>
    <linearGradient id="accentBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF754D" />
      <stop offset="100%" stop-color="#E05730" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#075433" />
    </marker>
  </defs>

  <!-- Background Track Elements -->
  <g opacity="0.35">
    <ellipse cx="600" cy="350" rx="550" ry="240" fill="none" stroke="#D3E5DE" stroke-width="2" stroke-dasharray="6 6" />
    <ellipse cx="600" cy="350" rx="490" ry="200" fill="none" stroke="#E0EBE5" stroke-width="1.5" />
  </g>

  <!-- Section Header -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#EBF5F0" />
    <text x="95" y="20" font-size="12" font-weight="700" fill="#075433" letter-spacing="1.2" text-anchor="middle">CALCULATION PIPELINE</text>
    <text x="0" y="70" font-size="28" font-weight="800" fill="#042F2A" letter-spacing="-0.5">End-to-End Age Grade Data Architecture</text>
    <text x="0" y="98" font-size="15" fill="#4A635A">How race timing transforms from raw seconds to an internationally standardized percentage score</text>
  </g>

  <!-- Step 1: Athlete Inputs Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="235" height="380" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#nodeShadow)" />
    <!-- Step Badge -->
    <rect x="24" y="24" width="65" height="26" rx="13" fill="#EBF5F0" />
    <text x="56" y="42" font-size="11" font-weight="800" fill="#075433" text-anchor="middle">STEP 1</text>
    <text x="24" y="80" font-size="18" font-weight="800" fill="#042F2A">Athlete Inputs</text>
    <text x="24" y="104" font-size="13" fill="#4A635A">Primary entry metrics</text>

    <!-- Sub-items -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="195" height="46" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">BIOLOGICAL AGE</text>
      <text x="14" y="38" font-size="13" font-weight="700" fill="#042F2A">Years on Race Day</text>
    </g>
    <g transform="translate(20, 186)">
      <rect x="0" y="0" width="195" height="46" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">SEX CATEGORY</text>
      <text x="14" y="38" font-size="13" font-weight="700" fill="#042F2A">Male or Female Cohort</text>
    </g>
    <g transform="translate(20, 242)">
      <rect x="0" y="0" width="195" height="46" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">EVENT DISTANCE</text>
      <text x="14" y="38" font-size="13" font-weight="700" fill="#042F2A">5K, 10K, Half, Marathon</text>
    </g>
    <g transform="translate(20, 298)">
      <rect x="0" y="0" width="195" height="46" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">CHIP FINISH TIME</text>
      <text x="14" y="38" font-size="13" font-weight="700" fill="#075433">Hours : Mins : Secs</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="325" y1="390" x2="355" y2="390" stroke="#075433" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 2: Standard Lookup Card -->
  <g transform="translate(365, 200)">
    <rect x="0" y="0" width="235" height="380" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#nodeShadow)" />
    <!-- Step Badge -->
    <rect x="24" y="24" width="65" height="26" rx="13" fill="#EBF5F0" />
    <text x="56" y="42" font-size="11" font-weight="800" fill="#075433" text-anchor="middle">STEP 2</text>
    <text x="24" y="80" font-size="18" font-weight="800" fill="#042F2A">WMA Standards</text>
    <text x="24" y="104" font-size="13" fill="#4A635A">Statistical benchmark lookup</text>

    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">OPEN WORLD STANDARD</text>
      <text x="14" y="42" font-size="14" font-weight="700" fill="#042F2A">Open World Record</text>
      <text x="14" y="58" font-size="11" fill="#4A635A">Peak theoretical baseline</text>
    </g>
    <g transform="translate(20, 205)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="22" font-size="11" font-weight="600" fill="#6C8279">AGE FACTOR COEFFICIENT</text>
      <text x="14" y="42" font-size="14" font-weight="700" fill="#FF754D">Factor (0.0000–1.0000)</text>
      <text x="14" y="58" font-size="11" fill="#4A635A">Physiological age curve</text>
    </g>
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="195" height="74" rx="8" fill="#EBF5F0" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#075433">DATASET INTEGRITY</text>
      <text x="14" y="42" font-size="12" fill="#042F2A">Calibrated against WMA 2020 empirical racing records.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="610" y1="390" x2="640" y2="390" stroke="#075433" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 3: Age-Adjusted Benchmark Card -->
  <g transform="translate(650, 200)">
    <rect x="0" y="0" width="235" height="380" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#nodeShadow)" />
    <!-- Step Badge -->
    <rect x="24" y="24" width="65" height="26" rx="13" fill="#EBF5F0" />
    <text x="56" y="42" font-size="11" font-weight="800" fill="#075433" text-anchor="middle">STEP 3</text>
    <text x="24" y="80" font-size="18" font-weight="800" fill="#042F2A">Standard Derive</text>
    <text x="24" y="104" font-size="13" fill="#4A635A">Age benchmark conversion</text>

    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="195" height="90" rx="8" fill="#F8FCFA" stroke="#E5EFEA" />
      <text x="14" y="24" font-size="11" font-weight="600" fill="#6C8279">BENCHMARK EQUATION</text>
      <text x="14" y="46" font-size="13" font-weight="700" fill="#075433">Age-Standard =</text>
      <text x="14" y="66" font-size="12.5" font-weight="600" fill="#042F2A">Open Std ÷ Age Factor</text>
      <text x="14" y="82" font-size="11" fill="#4A635A">Express in total seconds</text>
    </g>

    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="195" height="120" rx="8" fill="#F4F8F6" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#042F2A">F50 5K BENCHMARK</text>
      <text x="14" y="50" font-size="20" font-weight="800" fill="#075433">16:11.18</text>
      <text x="14" y="70" font-size="12" fill="#4A635A">971.18 total seconds</text>
      <text x="14" y="92" font-size="11" fill="#6C8279">vs 14:06 (846s) open record</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="895" y1="390" x2="925" y2="390" stroke="#075433" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 4: Final Age Grade Output Card -->
  <g transform="translate(935, 200)">
    <rect x="0" y="0" width="225" height="380" rx="16" fill="url(#flowPrimary)" filter="url(#nodeShadow)" />
    <!-- Step Badge -->
    <rect x="24" y="24" width="65" height="26" rx="13" fill="rgba(255,255,255,0.15)" />
    <text x="56" y="42" font-size="11" font-weight="800" fill="#9FE7BD" text-anchor="middle">STEP 4</text>
    <text x="24" y="80" font-size="18" font-weight="800" fill="#FFFFFF">Age Grade %</text>
    <text x="24" y="104" font-size="13" fill="#D3E5DE">Final normalized metric</text>

    <!-- Calculation box inside -->
    <g transform="translate(18, 130)">
      <rect x="0" y="0" width="189" height="75" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" />
      <text x="12" y="24" font-size="11" font-weight="700" fill="#9FE7BD">PERCENTAGE RATIO</text>
      <text x="12" y="46" font-size="13" font-weight="600" fill="#FFFFFF">(Age Std ÷ Actual) × 100</text>
      <text x="12" y="64" font-size="11" fill="#D3E5DE">(971.18 ÷ 1500) × 100</text>
    </g>

    <!-- Large Result Callout -->
    <g transform="translate(18, 220)">
      <rect x="0" y="0" width="189" height="135" rx="8" fill="rgba(0,0,0,0.25)" />
      <text x="14" y="28" font-size="11" font-weight="700" fill="#9FE7BD">STANDARDIZED SCORE</text>
      <text x="14" y="74" font-size="38" font-weight="900" fill="#FFFFFF">64.75%</text>
      
      <rect x="14" y="92" width="105" height="24" rx="6" fill="url(#accentBadge)" />
      <text x="66" y="108" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">REGIONAL CLUSTER</text>
    </g>
  </g>
</svg>
