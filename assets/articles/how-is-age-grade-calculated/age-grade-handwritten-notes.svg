<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#F7FAF8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042F2A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075433" />
      <stop offset="100%" stop-color="#042F2A" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF754D" />
      <stop offset="100%" stop-color="#E05730" />
    </linearGradient>
    <linearGradient id="mintBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F0" />
      <stop offset="100%" stop-color="#D3E5DE" />
    </linearGradient>
  </defs>

  <!-- Editorial Grid Background Lines -->
  <g opacity="0.4">
    <line x1="60" y1="0" x2="60" y2="675" stroke="#E0EBE5" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1140" y1="0" x2="1140" y2="675" stroke="#E0EBE5" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#E0EBE5" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="615" x2="1200" y2="615" stroke="#E0EBE5" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Title Badge & Section Header -->
  <rect x="80" y="55" width="220" height="32" rx="16" fill="url(#mintBadge)" />
  <text x="190" y="76" font-size="12" font-weight="700" fill="#075433" letter-spacing="1.2" text-anchor="middle">PERFORMANCE AUDIT</text>
  <text x="80" y="125" font-size="28" font-weight="800" fill="#042F2A" letter-spacing="-0.5">Analyst Field Notes &amp; Formula Breakdown</text>
  <text x="80" y="152" font-size="15" fill="#4A635A">Step-by-step arithmetic verification: Age 50 Female • 5K Road Race</text>

  <!-- Main Left Card: Field Worksheet / Timing Sheet -->
  <g transform="translate(80, 180)">
    <!-- Sheet Base -->
    <rect x="0" y="0" width="580" height="430" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Clipboard Top Tab -->
    <rect x="220" y="-12" width="140" height="24" rx="6" fill="#042F2A" />
    <circle cx="290" cy="0" r="4" fill="#D3E5DE" />

    <!-- Worksheet Header -->
    <rect x="30" y="30" width="520" height="50" rx="8" fill="#F4F8F6" />
    <text x="50" y="61" font-size="14" font-weight="700" fill="#075433">OFFICIAL TIME VERIFICATION</text>
    <text x="530" y="61" font-size="13" font-weight="600" fill="#4A635A" text-anchor="end">BIB #5042 • WMA 2020</text>

    <!-- Table Rows -->
    <!-- Row 1: Age & Category -->
    <g transform="translate(30, 100)">
      <rect x="0" y="0" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="20" y="26" font-size="13.5" font-weight="600" fill="#4A635A">Athlete Demographics</text>
      <text x="500" y="26" font-size="14" font-weight="700" fill="#042F2A" text-anchor="end">Female • Age 50 (F50)</text>
    </g>

    <!-- Row 2: Event -->
    <g transform="translate(30, 150)">
      <rect x="0" y="0" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="20" y="26" font-size="13.5" font-weight="600" fill="#4A635A">Event &amp; Distance</text>
      <text x="500" y="26" font-size="14" font-weight="700" fill="#042F2A" text-anchor="end">5,000 Metres (5K Road)</text>
    </g>

    <!-- Row 3: Recorded Time -->
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="20" y="26" font-size="13.5" font-weight="600" fill="#4A635A">Recorded Clock Time</text>
      <text x="500" y="26" font-size="14" font-weight="800" fill="#075433" text-anchor="end">25:00.0 (1,500.00 sec)</text>
    </g>

    <!-- Row 4: Open World Record -->
    <g transform="translate(30, 250)">
      <rect x="0" y="0" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="20" y="26" font-size="13.5" font-weight="600" fill="#4A635A">Open Female World Standard</text>
      <text x="500" y="26" font-size="14" font-weight="700" fill="#042F2A" text-anchor="end">14:06.0 (846.00 sec)</text>
    </g>

    <!-- Row 5: WMA Factor & Age Standard -->
    <g transform="translate(30, 300)">
      <rect x="0" y="0" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="20" y="26" font-size="13.5" font-weight="600" fill="#4A635A">WMA 2020 Age Factor</text>
      <text x="500" y="26" font-size="14" font-weight="700" fill="#FF754D" text-anchor="end">0.8711 → Std: 16:11.18</text>
    </g>

    <!-- Note & Verification Badge -->
    <g transform="translate(30, 360)">
      <circle cx="12" cy="14" r="8" fill="#EBF5F0" />
      <text x="12" y="18" font-size="10" font-weight="800" fill="#075433" text-anchor="middle">✓</text>
      <text x="30" y="18" font-size="12.5" font-weight="600" fill="#075433">Formula verified with Age Calculator Lab official WMA dataset.</text>
    </g>
  </g>

  <!-- Right Side Column: Mathematical Computation Cards -->
  <g transform="translate(700, 180)">
    <!-- Card 1: The Core Formula Box -->
    <rect x="0" y="0" width="420" height="195" rx="16" fill="url(#primaryGrad)" filter="url(#cardShadow)" />
    
    <text x="30" y="38" font-size="13" font-weight="700" fill="#9FE7BD" letter-spacing="1">MATHEMATICAL FORMULA</text>
    <text x="30" y="68" font-size="18" font-weight="800" fill="#FFFFFF">Age Grade Percentage</text>
    
    <!-- Fraction display inside Dark Box -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="360" height="85" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" />
      <!-- Numerator -->
      <text x="140" y="32" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age-Standard Time (971.18s)</text>
      <!-- Fraction Bar -->
      <line x1="20" y1="42" x2="260" y2="42" stroke="#9FE7BD" stroke-width="2" />
      <!-- Denominator -->
      <text x="140" y="64" font-size="15" font-weight="700" fill="#D3E5DE" text-anchor="middle">Actual Race Time (1500.00s)</text>
      <!-- Multiplier -->
      <text x="310" y="48" font-size="20" font-weight="800" fill="#FF9A77" text-anchor="middle">× 100</text>
    </g>

    <!-- Card 2: Calculated Result Highlight -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="420" height="195" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#cardShadow)" />
      
      <text x="30" y="38" font-size="12" font-weight="700" fill="#4A635A" letter-spacing="1">FINAL VERIFIED RESULT</text>
      
      <!-- Big Score -->
      <text x="30" y="98" font-size="52" font-weight="900" fill="#075433" letter-spacing="-1.5">64.75%</text>
      
      <!-- Level Badge -->
      <rect x="235" y="60" width="155" height="34" rx="8" fill="url(#coralGrad)" />
      <text x="312" y="82" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Regional / Club</text>

      <!-- Explanatory note -->
      <line x1="30" y1="120" x2="390" y2="120" stroke="#E5EFEA" stroke-width="1" />
      <text x="30" y="145" font-size="13.5" font-weight="600" fill="#042F2A">Performance Context:</text>
      <text x="30" y="168" font-size="12.5" fill="#4A635A">Athletic standard equivalent to a 21:47 5K for an open senior.</text>
    </g>
  </g>
</svg>
