<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">CALENDAR AGE GAP: BIRTH DATE vs. YEAR CALCULATION</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">TWO-PERSON TIMELINE</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(90, 135)">
    <!-- Timeline Line -->
    <line x1="40" y1="90" x2="580" y2="90" stroke="#042f2a" stroke-width="3"/>
    
    <!-- Pin 1: Person A -->
    <circle cx="100" cy="90" r="10" fill="#075433"/>
    <line x1="100" y1="30" x2="100" y2="80" stroke="#075433" stroke-width="2"/>
    <rect x="30" y="10" width="140" height="40" rx="4" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="100" y="26" text-anchor="middle" fill="#042f2a" font-size="11" font-weight="700">PERSON A (DOB)</text>
    <text x="100" y="42" text-anchor="middle" fill="#075433" font-size="12" font-weight="600">Aug 12, 1985</text>
    
    <!-- Pin 2: Person B -->
    <circle cx="520" cy="90" r="10" fill="#ff754d"/>
    <line x1="520" y1="30" x2="520" y2="80" stroke="#ff754d" stroke-width="2"/>
    <rect x="450" y="10" width="140" height="40" rx="4" fill="#fdf6f3" stroke="#f2cfc2" stroke-width="1"/>
    <text x="520" y="26" text-anchor="middle" fill="#a83f21" font-size="11" font-weight="700">PERSON B (DOB)</text>
    <text x="520" y="42" text-anchor="middle" fill="#ff754d" font-size="12" font-weight="600">Feb 25, 1995</text>
    
    <!-- Bracket Underneath -->
    <path d="M 100 110 L 100 135 L 310 135 L 310 150 L 310 135 L 520 135 L 520 110" fill="none" stroke="#042f2a" stroke-width="2"/>
    
    <!-- Calculation Card -->
    <rect x="80" y="160" width="460" height="60" rx="6" fill="#f4f9f6" stroke="#075433" stroke-width="1.5"/>
    <text x="310" y="185" text-anchor="middle" fill="#042f2a" font-size="14" font-weight="700">Exact Calendar Difference: 9 Years, 6 Months, 13 Days</text>
    <text x="310" y="205" text-anchor="middle" fill="#52796f" font-size="12">Simple Year Subtraction (1995 − 1985 = 10) overstates gap before birthday!</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>