<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">HOW TO CALCULATE AN AGE GAP: SUBTRACTION FORMULA</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">WORKED ARITHMETIC EXAMPLE</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(90, 135)">
    <!-- Formula Box -->
    <rect x="0" y="0" width="620" height="70" rx="6" fill="#042f2a"/>
    <text x="310" y="42" text-anchor="middle" fill="#9fe7bd" font-size="18" font-family="'Courier New', monospace" font-weight="700">Age Gap = Older Age − Younger Age</text>
    
    <!-- Step By Step Breakdown -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="190" height="120" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
      <text x="18" y="28" fill="#075433" font-size="12" font-weight="700">STEP 1: OLDER AGE</text>
      <text x="18" y="65" fill="#042f2a" font-size="24" font-family="'Courier New', monospace" font-weight="700">42 Yrs</text>
      <text x="18" y="95" fill="#4d7365" font-size="11">Reference: Person A</text>
      
      <rect x="215" y="0" width="190" height="120" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
      <text x="18" y="28" fill="#075433" font-size="12" font-weight="700">STEP 2: YOUNGER AGE</text>
      <text x="18" y="65" fill="#ff754d" font-size="24" font-family="'Courier New', monospace" font-weight="700">30 Yrs</text>
      <text x="18" y="95" fill="#4d7365" font-size="11">Reference: Person B</text>
      
      <rect x="430" y="0" width="190" height="120" rx="6" fill="#eaf4ef" stroke="#075433" stroke-width="1.5"/>
      <text x="18" y="28" fill="#075433" font-size="12" font-weight="700">STEP 3: RESULT</text>
      <text x="18" y="65" fill="#075433" font-size="24" font-family="'Courier New', monospace" font-weight="700">12 Yrs</text>
      <text x="18" y="95" fill="#075433" font-size="11" font-weight="600">42 − 30 = 12 Years Gap</text>
    </g>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>