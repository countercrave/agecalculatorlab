<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="auto">
  <rect width="860" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="810" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Retiring from Work ≠ Claiming Social Security</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">You can stop working at 62 without immediately triggering your Social Security benefit</text>

  <!-- Pathway 1: Combined Claiming -->
  <g transform="translate(50, 115)">
    <rect width="365" height="215" rx="10" fill="#FFF5F5" stroke="#F5C6CB" stroke-width="1.5"/>
    <rect width="365" height="44" rx="10" fill="#C82333"/>
    <text x="182" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Path A: Stop Work &amp; Claim at 62</text>

    <text x="25" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#721C24">Immediate Income, Permanent Cut</text>
    <text x="25" y="104" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Receive monthly benefit checks right away</text>
    <text x="25" y="128" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• Payout reduced permanently by 25%–30%</text>
    <text x="25" y="152" font-family="'Inter', sans-serif" font-size="12" fill="#721C24">• If continuing part-time work, wage cap applies</text>

    <rect x="25" y="172" width="315" height="30" rx="4" fill="#F8D7DA"/>
    <text x="182" y="192" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#721C24" text-anchor="middle">Result: $1,400/mo lifetime baseline (70% PIA)</text>
  </g>

  <!-- Pathway 2: Split Strategy -->
  <g transform="translate(445, 115)">
    <rect width="365" height="215" rx="10" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <rect width="365" height="44" rx="10" fill="#075433"/>
    <text x="182" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Path B: Retire at 62 &amp; Delay to FRA</text>

    <text x="25" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Bridge Strategy, 100% Payout</text>
    <text x="25" y="104" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• Stop work at 62 using 401(k), IRA, or cash</text>
    <text x="25" y="128" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• Let Social Security benefit grow to 100% at FRA</text>
    <text x="25" y="152" font-family="'Inter', sans-serif" font-size="12" fill="#042F2A">• Unlocks full unreduced benefit for life</text>

    <rect x="25" y="172" width="315" height="30" rx="4" fill="#E6F5EE"/>
    <text x="182" y="192" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">Result: $2,000/mo lifetime baseline (100% PIA)</text>
  </g>

  <!-- Bottom Clarification -->
  <g transform="translate(50, 350)">
    <rect width="760" height="44" rx="6" fill="#042F2A"/>
    <text x="380" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Key Rule: You don't have to claim Social Security just because you retire from your job.</text>
  </g>
</svg>