<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto">
  <rect width="900" height="420" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="850" height="380" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="65" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Understanding the Two-Month Phase-In Increment</text>
  <text x="50" y="90" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Why FRA was phased in gradually rather than leaping abruptly from 66 to 67</text>

  <!-- Step visualization -->
  <g transform="translate(55, 130)">
    <!-- Step 1: 1954 -->
    <rect x="0" y="140" width="90" height="80" rx="6" fill="#E6F5EE" stroke="#A3D9C2"/>
    <text x="45" y="170" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">1954</text>
    <text x="45" y="195" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A" text-anchor="middle">66 yrs</text>

    <!-- Step 2: 1955 -->
    <rect x="115" y="115" width="90" height="105" rx="6" fill="#E6F5EE" stroke="#A3D9C2"/>
    <text x="160" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">1955</text>
    <text x="160" y="170" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A" text-anchor="middle">66y + 2m</text>

    <!-- Step 3: 1956 -->
    <rect x="230" y="90" width="90" height="130" rx="6" fill="#E6F5EE" stroke="#A3D9C2"/>
    <text x="275" y="120" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">1956</text>
    <text x="275" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A" text-anchor="middle">66y + 4m</text>

    <!-- Step 4: 1957 -->
    <rect x="345" y="65" width="90" height="155" rx="6" fill="#E6F5EE" stroke="#A3D9C2"/>
    <text x="390" y="95" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">1957</text>
    <text x="390" y="120" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A" text-anchor="middle">66y + 6m</text>

    <!-- Step 5: 1958 -->
    <rect x="460" y="40" width="90" height="180" rx="6" fill="#E6F5EE" stroke="#A3D9C2"/>
    <text x="505" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433" text-anchor="middle">1958</text>
    <text x="505" y="95" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A" text-anchor="middle">66y + 8m</text>

    <!-- Step 6: 1959 -->
    <rect x="575" y="15" width="90" height="205" rx="6" fill="#075433"/>
    <text x="620" y="45" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#9FE7BD" text-anchor="middle">1959</text>
    <text x="620" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">66y + 10m</text>

    <!-- Final: 1960+ -->
    <rect x="690" y="-10" width="90" height="230" rx="6" fill="#042F2A" stroke="#FF754D" stroke-width="2"/>
    <text x="735" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FF754D" text-anchor="middle">1960+</text>
    <text x="735" y="45" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">67 yrs</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(50, 360)">
    <text x="10" y="15" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">Source: Social Security Act Section 216(l). Individuals born January 1 use the prior calendar year statutory bracket.</text>
  </g>
</svg>