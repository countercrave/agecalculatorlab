<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="split-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="co-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="co-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow-soft" x="-5%" y="-5%" width="112%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#split-bg)" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1.2" />
    <text x="115" y="18" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CAREER TAXONOMY</text>
    <text x="0" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">One Career &#8212; Multiple Tenures</text>
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Total professional experience aggregates across employers, while tenure belongs to one.</text>
  </g>

  <!-- Big Comparison Architecture -->
  <g transform="translate(60, 165)">
    <!-- Top Master Bar: Cumulative Experience (11 Years) -->
    <g transform="translate(0, 0)" filter="url(#shadow-soft)">
      <rect x="0" y="0" width="680" height="85" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.8" />
      <text x="25" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TOTAL WORK EXPERIENCE (CAREER-WIDE)</text>
      <text x="25" y="64" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">&#8776; 11 Years Total Professional Experience</text>
      <text x="655" y="52" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="end">All Roles Combined</text>
    </g>

    <!-- Branching Downward Connecting Lines -->
    <path d="M 180,85 L 180,130" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4 3" />
    <path d="M 500,85 L 500,130" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" />

    <!-- Two Distinct Employer Tenures -->
    <g transform="translate(0, 130)">
      <!-- Employer A Card (Past Tenure) -->
      <g transform="translate(0, 0)" filter="url(#shadow-soft)">
        <rect x="0" y="0" width="325" height="235" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.6" />
        <rect x="0" y="0" width="325" height="6" rx="3" fill="url(#co-a)" />
        <text x="25" y="38" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PAST EMPLOYER A</text>
        <text x="25" y="68" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Company A (2015&#8211;2019)</text>
        
        <g transform="translate(25, 95)">
          <rect x="0" y="0" width="275" height="60" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
          <text x="18" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Completed Tenure:</text>
          <text x="18" y="48" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">4 Years of Service</text>
        </g>

        <text x="25" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">&#8226; Static historical tenure</text>
        <text x="25" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">&#8226; Service clock ended on departure</text>
      </g>

      <!-- Employer B Card (Current Tenure) -->
      <g transform="translate(355, 0)" filter="url(#shadow-soft)">
        <rect x="0" y="0" width="325" height="235" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <rect x="0" y="0" width="325" height="6" rx="3" fill="url(#co-b)" />
        <text x="25" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURRENT EMPLOYER B</text>
        <text x="25" y="68" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Company B (2019&#8211;2026)</text>
        
        <g transform="translate(25, 95)">
          <rect x="0" y="0" width="275" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
          <text x="18" y="26" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">Active Tenure:</text>
          <text x="18" y="48" fill="#34d399" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">7 Years, 3M, 11D</text>
        </g>

        <text x="25" y="185" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">&#8226; Current organization tenure</text>
        <text x="25" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">&#8226; Used for vesting &amp; PTO tiers</text>
      </g>
    </g>
  </g>
</svg>