<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="nb-desk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="nb-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f7f3eb" />
    </linearGradient>
    <filter id="nb-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Executive Desk Background -->
  <rect width="1200" height="675" fill="url(#nb-desk)" />

  <!-- Pen resting beside notebook -->
  <g transform="translate(1075, 160) rotate(14)">
    <rect x="-6" y="0" width="12" height="340" rx="6" fill="#1e293b" />
    <rect x="-4" y="20" width="8" height="45" fill="#d97706" />
    <path d="M-6,340 L6,340 L0,370 Z" fill="#94a3b8" />
    <path d="M-2,360 L2,360 L0,370 Z" fill="#0f172a" />
    <rect x="5" y="30" width="4" height="80" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Notebook Sheet -->
  <g transform="translate(120, 45)" filter="url(#nb-shadow)">
    <rect width="900" height="585" rx="8" fill="url(#nb-paper)" stroke="#e2d9cc" stroke-width="1.5" />

    <!-- Spiral Holes on Left Margin -->
    <g fill="#475569" opacity="0.3">
      <circle cx="28" cy="40" r="7" />
      <circle cx="28" cy="95" r="7" />
      <circle cx="28" cy="150" r="7" />
      <circle cx="28" cy="205" r="7" />
      <circle cx="28" cy="260" r="7" />
      <circle cx="28" cy="315" r="7" />
      <circle cx="28" cy="370" r="7" />
      <circle cx="28" cy="425" r="7" />
      <circle cx="28" cy="480" r="7" />
      <circle cx="28" cy="535" r="7" />
    </g>

    <!-- Red Margin Line -->
    <line x1="95" y1="0" x2="95" y2="585" stroke="#f87171" stroke-width="1.5" opacity="0.7" />

    <!-- Horizontal Notebook Ruled Lines -->
    <g stroke="#93c5fd" stroke-width="0.8" opacity="0.55">
      <line x1="95" y1="70" x2="880" y2="70" />
      <line x1="95" y1="110" x2="880" y2="110" />
      <line x1="95" y1="150" x2="880" y2="150" />
      <line x1="95" y1="190" x2="880" y2="190" />
      <line x1="95" y1="230" x2="880" y2="230" />
      <line x1="95" y1="270" x2="880" y2="270" />
      <line x1="95" y1="310" x2="880" y2="310" />
      <line x1="95" y1="350" x2="880" y2="350" />
      <line x1="95" y1="390" x2="880" y2="390" />
      <line x1="95" y1="430" x2="880" y2="430" />
      <line x1="95" y1="470" x2="880" y2="470" />
      <line x1="95" y1="510" x2="880" y2="510" />
      <line x1="95" y1="550" x2="880" y2="550" />
    </g>

    <!-- Title Handwritten in Blue Ink -->
    <text x="130" y="60" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="24" font-weight="bold">Service Calculation</text>

    <!-- Joining & Evaluation Dates -->
    <g transform="translate(130, 85)">
      <text x="0" y="22" fill="#0f172a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold">Joined:</text>
      <text x="110" y="22" fill="#1d4ed8" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">15 Mar 2018</text>

      <text x="0" y="62" fill="#0f172a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold">As of:</text>
      <text x="110" y="62" fill="#1d4ed8" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">23 Sep 2026</text>
    </g>

    <!-- Breakdown Steps -->
    <g transform="translate(130, 195)">
      <text x="0" y="24" fill="#475569" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">CALENDAR INTERVAL DECOMPOSITION:</text>
      
      <text x="20" y="65" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18">1) 15 Mar 2018 &#8594; 15 Mar 2026</text>
      <text x="370" y="65" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 8 years</text>
      <text x="590" y="65" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>

      <text x="20" y="105" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18">2) 15 Mar 2026 &#8594; 15 Sep 2026</text>
      <text x="370" y="105" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 6 months</text>
      <text x="590" y="105" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>

      <text x="20" y="145" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="18">3) 15 Sep 2026 &#8594; 23 Sep 2026</text>
      <text x="370" y="145" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">= 8 days</text>
      <text x="590" y="145" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">&#10003;</text>
    </g>

    <!-- Total Result with Circled "Calendar Service" -->
    <g transform="translate(130, 375)">
      <rect x="0" y="0" width="670" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="30" y="40" fill="#1e40af" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">RESULT SUMMARY:</text>
      <text x="30" y="74" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="28" font-weight="bold">TOTAL: 8Y 6M 8D</text>

      <!-- Circled "Calendar Service" -->
      <g transform="translate(430, 16)">
        <ellipse cx="100" cy="30" rx="95" ry="26" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="250 8" transform="rotate(-3 100 30)" />
        <ellipse cx="102" cy="32" rx="93" ry="24" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" transform="rotate(-2 100 30)" />
        <text x="100" y="36" fill="#b91c1c" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Calendar Service</text>
      </g>
    </g>

    <!-- Bottom verification stamp -->
    <text x="130" y="515" fill="#047857" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold">&#10003; Verified exact calendar anniversary logic (Age Calculator Lab)</text>
  </g>
</svg>