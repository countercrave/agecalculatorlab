<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="cm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cm-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="cm-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#cm-bg)" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CAREER TENURE ROADMAP</text>
    <text x="0" y="68" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Employment Service Milestones Across a Career</text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">Recognizing professional dedication from 1-year onboarding to 20-year master service</text>
  </g>

  <!-- Horizontal Milestone Track -->
  <g transform="translate(80, 310)">
    <!-- Base track line -->
    <line x1="50" y1="0" x2="990" y2="0" stroke="url(#cm-track)" stroke-width="8" stroke-linecap="round" />

    <!-- 1 Year -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="16" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#cm-shadow)" />
      <g transform="translate(-65, -95)">
        <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#cm-shadow)" />
        <text x="65" y="24" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1 YEAR</text>
        <text x="65" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Inaugural Anniv.</text>
      </g>
      <text x="0" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Foundation</text>
    </g>

    <!-- 3 Years -->
    <g transform="translate(285, 0)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="3.5" filter="url(#cm-shadow)" />
      <g transform="translate(-65, -95)">
        <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#cm-shadow)" />
        <text x="65" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 YEARS</text>
        <text x="65" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Core Mastery</text>
      </g>
      <text x="0" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Domain Lead</text>
    </g>

    <!-- 5 Years -->
    <g transform="translate(520, 0)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4" filter="url(#cm-shadow)" />
      <g transform="translate(-75, -105)">
        <rect width="150" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#cm-shadow)" />
        <text x="75" y="24" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">5 YEARS</text>
        <text x="75" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Major Vesting</text>
        <text x="75" y="64" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Gratuity / Bonus</text>
      </g>
      <text x="0" y="38" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Senior Tier</text>
    </g>

    <!-- 10 Years -->
    <g transform="translate(755, 0)">
      <circle cx="0" cy="0" r="16" fill="#8b5cf6" stroke="#ffffff" stroke-width="4" filter="url(#cm-shadow)" />
      <g transform="translate(-75, -105)">
        <rect width="150" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#cm-shadow)" />
        <text x="75" y="24" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">10 YEARS</text>
        <text x="75" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">A Decade of Service</text>
        <text x="75" y="64" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Honorary Sabbatical</text>
      </g>
      <text x="0" y="38" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Decade Mark</text>
    </g>

    <!-- 20 Years -->
    <g transform="translate(990, 0)">
      <circle cx="0" cy="0" r="16" fill="#ec4899" stroke="#ffffff" stroke-width="4" filter="url(#cm-shadow)" />
      <g transform="translate(-75, -105)">
        <rect width="150" height="75" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#cm-shadow)" />
        <text x="75" y="24" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">20 YEARS</text>
        <text x="75" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Master Service</text>
        <text x="75" y="64" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Lifetime Legacy</text>
      </g>
      <text x="0" y="38" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Silver Jubilee</text>
    </g>
  </g>

  <!-- Bottom Quote -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="1080" height="85" rx="10" fill="#13233a" stroke="#334155" stroke-width="1" />
    <text x="540" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">&#8220;Anniversaries mark calendar milestones; dedication creates organizational culture.&#8221;</text>
    <text x="540" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Age Calculator Lab Career Architecture &#8226; Exact Calendar Decomposition Model</text>
  </g>
</svg>