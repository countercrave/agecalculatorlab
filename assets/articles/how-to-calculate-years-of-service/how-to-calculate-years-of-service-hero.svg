<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="50%" stop-color="#112239" />
      <stop offset="100%" stop-color="#070e18" />
    </linearGradient>
    <linearGradient id="card-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3250" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#142338" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow-art" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-art)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="840" y1="0" x2="840" y2="675" />
    <line x1="1080" y1="0" x2="1080" y2="675" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Header Badge & Title -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="110" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">EMPLOYMENT TIMELINE</text>
    <text x="0" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">How to Calculate Years of Service</text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Exact calendar decomposition from start date to reference date</text>
  </g>

  <!-- Horizontal Timeline Progression -->
  <g transform="translate(80, 310)">
    <!-- Base track line -->
    <line x1="40" y1="0" x2="980" y2="0" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <!-- Elapsed service progress line -->
    <line x1="40" y1="0" x2="980" y2="0" stroke="url(#grad-emerald)" stroke-width="8" stroke-linecap="round" />

    <!-- Step 1: START DATE (15 March 2018) -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="16" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#shadow-art)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <g transform="translate(-75, -115)">
        <rect width="150" height="85" rx="10" fill="url(#card-art)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-art)" />
        <text x="75" y="24" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">START DATE</text>
        <text x="75" y="48" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">15 March 2018</text>
        <text x="75" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Onboarding Day 0</text>
      </g>
      <text x="0" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Joining</text>
    </g>

    <!-- Step 2: 1 YEAR MARK -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="0" r="13" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#shadow-art)" />
      <g transform="translate(-55, -80)">
        <rect width="110" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="55" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 YEAR</text>
        <text x="55" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">&#10003; 15 Mar 2019</text>
      </g>
      <text x="0" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1st Anniv.</text>
    </g>

    <!-- Step 3: 5 YEARS MARK -->
    <g transform="translate(540, 0)">
      <circle cx="0" cy="0" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#shadow-art)" />
      <g transform="translate(-65, -95)">
        <rect width="130" height="66" rx="8" fill="url(#card-art)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-art)" />
        <text x="65" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">MAJOR MILESTONE</text>
        <text x="65" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5 Full Years</text>
        <text x="65" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">&#10003; 15 Mar 2023</text>
      </g>
      <text x="0" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5 Years</text>
    </g>

    <!-- Step 4: 8 YEARS MARK -->
    <g transform="translate(780, 0)">
      <circle cx="0" cy="0" r="13" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#shadow-art)" />
      <g transform="translate(-55, -80)">
        <rect width="110" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="55" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">8 YEARS</text>
        <text x="55" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">&#10003; 15 Mar 2026</text>
      </g>
      <text x="0" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">8th Anniv.</text>
    </g>

    <!-- Step 5: REFERENCE DATE (23 September 2026) -->
    <g transform="translate(980, 0)">
      <circle cx="0" cy="0" r="18" fill="url(#grad-amber)" stroke="#ffffff" stroke-width="4" filter="url(#shadow-art)" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" />
      <g transform="translate(-95, -125)">
        <rect width="190" height="95" rx="10" fill="#0f2038" stroke="#fbbf24" stroke-width="2" filter="url(#shadow-art)" />
        <text x="95" y="24" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">REFERENCE DATE</text>
        <text x="95" y="48" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" text-anchor="middle">23 September 2026</text>
        <text x="95" y="70" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ 6 Months + 8 Days</text>
      </g>
      <text x="0" y="42" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">&#9650; EVALUATION</text>
    </g>
  </g>

  <!-- Bottom Result Banner: 8 Years · 6 Months · 8 Days -->
  <g transform="translate(180, 520)">
    <rect x="0" y="0" width="840" height="105" rx="14" fill="#13233a" stroke="#10b981" stroke-width="2" filter="url(#shadow-art)" />
    <text x="420" y="36" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">FINAL EXACT SERVICE TENURE</text>
    <text x="420" y="72" fill="#ffffff" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" text-anchor="middle">8 Years &#8226; 6 Months &#8226; 8 Days</text>
    <text x="420" y="94" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Total: 3,114 Calendar Days (8.53 Decimal Years) &#8212; Exact Anniversary Arithmetic</text>
  </g>
</svg>