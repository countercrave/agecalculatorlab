<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="rec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="active-pillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="rec-shadow" x="-5%" y="-5%" width="112%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#rec-bg)" />

  <!-- Header -->
  <g transform="translate(100, 55)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#059669" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="120" y="19" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ANNUAL RECURRENCE</text>
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="800">The Work Anniversary Cycle Across Career Years</text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">The calendar date remains fixed on September 14 each year while the completed tenure advances by exactly +1 year.</text>
  </g>

  <!-- 7 Step Milestones Horizon Grid -->
  <g transform="translate(100, 210)">
    <!-- Base Timeline Rail -->
    <line x1="40" y1="180" x2="960" y2="180" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="180" x2="810" y2="180" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Node 0: Hire Date (2021) -->
    <g transform="translate(40, 180)">
      <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#rec-shadow)" />
      <text x="0" y="6" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">HIRE</text>
      <!-- Label Below -->
      <text x="0" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">14 Sep 2021</text>
      <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Start Day</text>
    </g>

    <!-- Node 1: 1st Anniversary (2022) -->
    <g transform="translate(195, 180)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#rec-shadow)" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1Y</text>
      <text x="0" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">14 Sep 2022</text>
      <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">1 Year</text>
    </g>

    <!-- Node 2: 2nd Anniversary (2023) -->
    <g transform="translate(350, 180)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#rec-shadow)" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2Y</text>
      <text x="0" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">14 Sep 2023</text>
      <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">2 Years</text>
    </g>

    <!-- Node 3: 3rd Anniversary (2024) -->
    <g transform="translate(505, 180)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#rec-shadow)" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3Y</text>
      <text x="0" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">14 Sep 2024</text>
      <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">3 Years</text>
    </g>

    <!-- Node 4: 5th Milestone (2026) -->
    <g transform="translate(660, 180)">
      <circle cx="0" cy="0" r="24" fill="#065f46" stroke="#fbbf24" stroke-width="3.5" filter="url(#rec-shadow)" />
      <text x="0" y="7" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5Y &#9733;</text>
      <text x="0" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">14 Sep 2026</text>
      <text x="0" y="70" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Vesting Tier</text>
    </g>

    <!-- Node 5: Next Upcoming (2027) -->
    <g transform="translate(815, 180)">
      <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="4" filter="url(#rec-shadow)" />
      <text x="0" y="7" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">NEXT</text>
      <!-- Big Card Above -->
      <g transform="translate(0, -90)">
        <rect x="-85" y="0" width="170" height="60" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
        <text x="0" y="24" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">UPCOMING MILESTONE</text>
        <text x="0" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">14 Sep 2027 (6Y)</text>
      </g>
      <text x="0" y="50" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">14 Sep 2027</text>
      <text x="0" y="70" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">6th Anniversary</text>
    </g>

    <!-- Node 6: 10th Decade (2031) -->
    <g transform="translate(960, 180)">
      <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 2" />
      <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">10Y</text>
      <text x="0" y="45" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">14 Sep 2031</text>
      <text x="0" y="65" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Decade Mark</text>
    </g>
  </g>
</svg>