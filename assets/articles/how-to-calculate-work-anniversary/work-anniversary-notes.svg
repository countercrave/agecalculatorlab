<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="desk-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="notepad-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf8f5" />
    </linearGradient>
    <filter id="desk-shadow" x="-5%" y="-5%" width="112%" height="115%">
      <feDropShadow dx="6" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#desk-surface)" />

  <!-- Desktop Calendar Outline in Top-Right Corner -->
  <g transform="translate(860, 40) rotate(6)" opacity="0.4">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="0" y="0" width="280" height="40" rx="10" fill="#dc2626" />
    <text x="140" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEPTEMBER 2026</text>
    <g fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">
      <text x="35" y="80">14</text>
      <circle cx="42" cy="76" r="16" fill="none" stroke="#fbbf24" stroke-width="2" />
      <text x="85" y="80">15</text>
      <text x="135" y="80">16</text>
      <text x="185" y="80">17</text>
      <text x="235" y="80">18</text>
    </g>
  </g>

  <!-- Large Clean White Notepad Sheet in Center -->
  <g transform="translate(140, 50)" filter="url(#desk-shadow)">
    <!-- Binder Cover Edge -->
    <rect x="-10" y="-8" width="820" height="576" rx="12" fill="#475569" />
    <!-- White Lined Sheet -->
    <rect width="800" height="560" rx="8" fill="url(#notepad-paper)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Red Margin Line -->
    <line x1="90" y1="0" x2="90" y2="560" stroke="#f87171" stroke-width="1.6" opacity="0.65" />

    <!-- Ruled Blue Lines -->
    <g stroke="#cbd5e1" stroke-width="0.8" opacity="0.55">
      <line x1="90" y1="65" x2="760" y2="65" />
      <line x1="90" y1="115" x2="760" y2="115" />
      <line x1="90" y1="165" x2="760" y2="165" />
      <line x1="90" y1="215" x2="760" y2="215" />
      <line x1="90" y1="265" x2="760" y2="265" />
      <line x1="90" y1="315" x2="760" y2="315" />
      <line x1="90" y1="365" x2="760" y2="365" />
      <line x1="90" y1="415" x2="760" y2="415" />
      <line x1="90" y1="465" x2="760" y2="465" />
      <line x1="90" y1="515" x2="760" y2="515" />
    </g>

    <!-- Spiral Binder Holes on Left Edge -->
    <g fill="#334155" opacity="0.3">
      <circle cx="35" cy="50" r="7" />
      <circle cx="35" cy="110" r="7" />
      <circle cx="35" cy="170" r="7" />
      <circle cx="35" cy="230" r="7" />
      <circle cx="35" cy="290" r="7" />
      <circle cx="35" cy="350" r="7" />
      <circle cx="35" cy="410" r="7" />
      <circle cx="35" cy="470" r="7" />
      <circle cx="35" cy="530" r="7" />
    </g>

    <!-- Handwritten Personal Content in Natural Blue Ink -->
    <g transform="translate(115, 25)">
      <!-- Title -->
      <text x="0" y="32" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="26" font-weight="bold">WORK ANNIVERSARY</text>
      <path d="M 0,44 Q 160,48 340,42" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" />

      <!-- Step Entries with arrows -->
      <g transform="translate(10, 85)" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif">
        <text x="0" y="0" fill="#0f172a" font-size="20" font-weight="bold">&#8226; Joined:</text>
        <text x="180" y="0" fill="#1d4ed8" font-size="20" font-weight="bold">14 September 2021</text>

        <!-- Connecting Arrow 1 -->
        <path d="M 90,15 C 90,32 100,42 120,45" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        <polygon points="120,45 110,40 112,48" fill="#2563eb" />

        <text x="0" y="55" fill="#0f172a" font-size="20" font-weight="bold">&#8226; Annual anniversary:</text>
        <text x="240" y="55" fill="#059669" font-size="20" font-weight="bold">14 September (Every Year)</text>

        <!-- Connecting Arrow 2 -->
        <path d="M 90,70 C 90,88 100,98 120,102" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        <polygon points="120,102 110,97 112,105" fill="#2563eb" />

        <text x="0" y="110" fill="#0f172a" font-size="20" font-weight="bold">&#8226; Next:</text>
        <text x="180" y="110" fill="#2563eb" font-size="20" font-weight="bold">14 September 2027</text>

        <text x="0" y="165" fill="#0f172a" font-size="20" font-weight="bold">&#8226; Milestone:</text>
        <text x="180" y="165" fill="#b45309" font-size="22" font-weight="bold">6 Years Completed</text>
      </g>

      <!-- Circled Callout: Reminder Note -->
      <g transform="translate(10, 310)">
        <rect x="0" y="0" width="580" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 4" />
        <text x="20" y="34" fill="#1e40af" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="17" font-weight="bold">&#128221; Remember:</text>
        <text x="20" y="64" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16">Check anniversary date against official HR appointment record.</text>
      </g>

      <!-- Bottom Sign-off -->
      <text x="10" y="475" fill="#64748b" font-family="'Segoe Print', cursive, sans-serif" font-size="14">Calculated via Age Calculator Lab &#8226; Exact Calendar Decomposition</text>
    </g>
  </g>
</svg>