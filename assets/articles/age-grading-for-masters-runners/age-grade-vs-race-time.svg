<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#FDFCF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="compareShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B233A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="navyCompare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B233A" />
      <stop offset="100%" stop-color="#042F2A" />
    </linearGradient>
    <linearGradient id="mintBadgeComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F0" />
      <stop offset="100%" stop-color="#D3E5DE" />
    </linearGradient>
    <linearGradient id="coralCompare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF754D" />
      <stop offset="100%" stop-color="#E05730" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive, sans-serif; }
    </style>
  </defs>

  <!-- Editorial Architectural Blueprint Grid -->
  <g opacity="0.32">
    <line x1="60" y1="0" x2="60" y2="675" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1140" y1="0" x2="1140" y2="675" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="615" x2="1200" y2="615" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Header Category & Title -->
  <rect x="80" y="50" width="280" height="30" rx="15" fill="url(#mintBadgeComp)" />
  <text x="220" y="70" font-size="11.5" font-weight="700" fill="#075433" letter-spacing="1.2" text-anchor="middle">METRIC COMPARISON AUDIT</text>
  <text x="80" y="116" font-size="27" font-weight="800" fill="#0B233A" letter-spacing="-0.5">Personal Best (Clock PR) vs Age-Graded PR</text>
  <text x="80" y="144" font-size="14.5" fill="#52796F">Two complementary lenses for evaluating a masters runner's lifelong athletic journey</text>

  <!-- Main Visual Comparison Grid -->
  <g transform="translate(80, 170)">
    
    <!-- Left Column: Clock Personal Best -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="500" height="444" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#compareShadow)" />

      <!-- Header Banner -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 484 0 C 492.84 0 500 7.16 500 16 L 500 68 L 0 68 Z" fill="#0B233A" />
      <text x="28" y="34" font-size="11.5" font-weight="700" fill="#9FE7BD" text-transform="uppercase" letter-spacing="1">CHRONOLOGICAL RECORD</text>
      <text x="28" y="55" font-size="18" font-weight="800" fill="#FFFFFF">Lifetime Personal Best (Clock PR)</text>

      <!-- Key Characteristics -->
      <g transform="translate(28, 90)">
        <!-- Characteristic 1 -->
        <g>
          <circle cx="12" cy="12" r="12" fill="#F1F5F9" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#0B233A" text-anchor="middle">⏱</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#0B233A">What It Measures</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Absolute physical speed regardless of age or biological decay.</text>
        </g>

        <!-- Characteristic 2 -->
        <g transform="translate(0, 52)">
          <circle cx="12" cy="12" r="12" fill="#F1F5F9" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#0B233A" text-anchor="middle">📅</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#0B233A">Timing in Lifespan</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Typically achieved during younger peak years (20s to early 30s).</text>
        </g>

        <!-- Characteristic 3 -->
        <g transform="translate(0, 104)">
          <circle cx="12" cy="12" r="12" fill="#F1F5F9" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#0B233A" text-anchor="middle">🔒</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#0B233A">Status Over Time</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Fixed in stone; nearly impossible to break once past mid-40s.</text>
        </g>

        <!-- Characteristic 4 -->
        <g transform="translate(0, 156)">
          <circle cx="12" cy="12" r="12" fill="#F1F5F9" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#0B233A" text-anchor="middle">🎯</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#0B233A">Primary Purpose</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">All-time personal record and historical high-water mark.</text>
        </g>
      </g>

      <!-- Bottom Highlight -->
      <g transform="translate(24, 320)">
        <rect x="0" y="0" width="452" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="18" y="28" font-size="13" font-weight="700" fill="#0B233A">Example (5K Lifetime Record):</text>
        <text x="18" y="56" font-size="24" font-weight="900" fill="#0B233A">17:45 <tspan font-size="13" font-weight="500" fill="#52796F">(Set at age 26)</tspan></text>
        <text x="18" y="80" font-size="12" fill="#64748B">A permanent personal monument, but static for future motivation.</text>
      </g>
    </g>

    <!-- Right Column: Age-Graded PR -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="500" height="444" rx="16" fill="#FFFFFF" stroke="#075433" stroke-width="2" filter="url(#compareShadow)" />

      <!-- Header Banner -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 484 0 C 492.84 0 500 7.16 500 16 L 500 68 L 0 68 Z" fill="#075433" />
      <text x="28" y="34" font-size="11.5" font-weight="700" fill="#9FE7BD" text-transform="uppercase" letter-spacing="1">AGE-ADJUSTED EXCELLENCE</text>
      <text x="28" y="55" font-size="18" font-weight="800" fill="#FFFFFF">Age-Graded Personal Best (AG-PR)</text>

      <!-- Key Characteristics -->
      <g transform="translate(28, 90)">
        <!-- Characteristic 1 -->
        <g>
          <circle cx="12" cy="12" r="12" fill="#EBF5F0" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#075433" text-anchor="middle">📊</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#075433">What It Measures</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Performance quality relative to world standards for your exact age.</text>
        </g>

        <!-- Characteristic 2 -->
        <g transform="translate(0, 52)">
          <circle cx="12" cy="12" r="12" fill="#EBF5F0" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#075433" text-anchor="middle">🌱</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#075433">Timing in Lifespan</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Achievable at any point in life: age 42, 55, 68, or even 80.</text>
        </g>

        <!-- Characteristic 3 -->
        <g transform="translate(0, 104)">
          <circle cx="12" cy="12" r="12" fill="#EBF5F0" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#075433" text-anchor="middle">🔄</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#075433">Status Over Time</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Dynamic and renewable; resets and adjusts with every year older.</text>
        </g>

        <!-- Characteristic 4 -->
        <g transform="translate(0, 156)">
          <circle cx="12" cy="12" r="12" fill="#EBF5F0" />
          <text x="12" y="17" font-size="13" font-weight="800" fill="#075433" text-anchor="middle">🚀</text>
          <text x="36" y="12" font-size="13.5" font-weight="700" fill="#075433">Primary Purpose</text>
          <text x="36" y="28" font-size="12.5" fill="#52796F">Active motivation, seasonal goals, and fair peer comparison.</text>
        </g>
      </g>

      <!-- Bottom Highlight -->
      <g transform="translate(24, 320)">
        <rect x="0" y="0" width="452" height="96" rx="10" fill="#F4F8F6" stroke="#B7E3CA" stroke-width="1" />
        <text x="18" y="28" font-size="13" font-weight="700" fill="#075433">Example (5K Masters Benchmark):</text>
        <text x="18" y="56" font-size="24" font-weight="900" fill="#075433">74.2% <tspan font-size="13" font-weight="500" fill="#52796F">(Achieved at age 58 with 21:40)</tspan></text>
        <text x="18" y="80" font-size="12" fill="#042F2A">Exceeds the athlete's 26-year-old relative grade (72.8%)!</text>
      </g>
    </g>

  </g>
</svg>
