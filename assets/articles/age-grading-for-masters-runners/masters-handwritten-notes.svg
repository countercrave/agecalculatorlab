<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#FDFCF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B233A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="deskNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B233A" />
      <stop offset="100%" stop-color="#042F2A" />
    </linearGradient>
    <linearGradient id="accentBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="mintBadgeDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F0" />
      <stop offset="100%" stop-color="#D3E5DE" />
    </linearGradient>
    <linearGradient id="sageBadgeDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F8F5" />
      <stop offset="100%" stop-color="#E1EFE8" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive, sans-serif; }
    </style>
  </defs>

  <!-- Editorial Architectural Blueprint Grid -->
  <g opacity="0.32">
    <line x1="60" y1="0" x2="60" y2="675" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1140" y1="0" x2="1140" y2="675" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="615" x2="1200" y2="615" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Header Category & Title -->
  <rect x="80" y="50" width="270" height="30" rx="15" fill="url(#mintBadgeDesk)" />
  <text x="215" y="70" font-size="11.5" font-weight="700" fill="#075433" letter-spacing="1.2" text-anchor="middle">MASTERS PERFORMANCE AUDIT</text>
  <text x="80" y="116" font-size="27" font-weight="800" fill="#0B233A" letter-spacing="-0.5">Analyst Desk: Longitudinal Masters Evaluation</text>
  <text x="80" y="144" font-size="14.5" fill="#52796F">Reviewing training log data, race times, and age-adjusted indices across ages 48 to 56</text>

  <!-- Left Main Card: Athlete Performance Log Sheet -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="560" height="444" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#deskShadow)" />
    
    <!-- Top Clipboard Clip -->
    <rect x="210" y="-12" width="140" height="24" rx="6" fill="#0B233A" />
    <circle cx="280" cy="0" r="4" fill="#9FE7BD" />

    <!-- Sheet Header -->
    <rect x="24" y="24" width="512" height="46" rx="8" fill="#F4F8F6" />
    <text x="44" y="52" font-size="13.5" font-weight="700" fill="#075433">LOGBOOK #M52 • 5K ROAD RACING LOG</text>
    <text x="516" y="52" font-size="12" font-weight="600" fill="#52796F" text-anchor="end">WMA DEMOGRAPHIC FACTORING</text>

    <!-- Table Header -->
    <g transform="translate(24, 82)">
      <rect x="0" y="0" width="512" height="32" rx="6" fill="#0B233A" />
      <text x="16" y="21" font-size="12" font-weight="700" fill="#FFFFFF">AGE / YEAR</text>
      <text x="140" y="21" font-size="12" font-weight="700" fill="#FFFFFF">CLOCK TIME</text>
      <text x="270" y="21" font-size="12" font-weight="700" fill="#FFFFFF">AGE FACTOR</text>
      <text x="496" y="21" font-size="12" font-weight="700" fill="#9FE7BD" text-anchor="end">AGE GRADE %</text>
    </g>

    <!-- Row 1: Age 48 -->
    <g transform="translate(24, 122)">
      <rect x="0" y="0" width="512" height="44" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="16" y="27" font-size="13" font-weight="700" fill="#0B233A">Age 48 (2020)</text>
      <text x="140" y="27" font-size="13.5" font-weight="600" fill="#52796F">20:15</text>
      <text x="270" y="27" font-size="13" font-weight="600" fill="#52796F">0.8924</text>
      <rect x="424" y="10" width="76" height="24" rx="4" fill="#EBF5F0" />
      <text x="462" y="26" font-size="13.5" font-weight="800" fill="#075433" text-anchor="middle">71.8%</text>
    </g>

    <!-- Row 2: Age 52 -->
    <g transform="translate(24, 174)">
      <rect x="0" y="0" width="512" height="44" rx="6" fill="#FFFFFF" stroke="#E5EFEA" stroke-width="1" />
      <text x="16" y="27" font-size="13" font-weight="700" fill="#0B233A">Age 52 (2024)</text>
      <text x="140" y="27" font-size="13.5" font-weight="600" fill="#52796F">20:58</text>
      <text x="270" y="27" font-size="13" font-weight="600" fill="#52796F">0.8650</text>
      <rect x="424" y="10" width="76" height="24" rx="4" fill="#EBF5F0" />
      <text x="462" y="26" font-size="13.5" font-weight="800" fill="#075433" text-anchor="middle">72.3%</text>
    </g>

    <!-- Row 3: Age 56 -->
    <g transform="translate(24, 226)">
      <rect x="0" y="0" width="512" height="44" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
      <text x="16" y="27" font-size="13" font-weight="700" fill="#0B233A">Age 56 (2028)</text>
      <text x="140" y="27" font-size="13.5" font-weight="600" fill="#0284C7">21:30</text>
      <text x="270" y="27" font-size="13" font-weight="600" fill="#52796F">0.8375</text>
      <rect x="424" y="10" width="76" height="24" rx="4" fill="#2563EB" />
      <text x="462" y="26" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">73.5%</text>
    </g>

    <!-- Cursive Handwritten Sticky Note Overlay -->
    <g transform="translate(30, 286)">
      <rect x="0" y="0" width="500" height="136" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
      <!-- Pushpin top -->
      <circle cx="250" cy="12" r="5" fill="#EF4444" />
      
      <text x="24" y="38" font-size="20" font-weight="700" fill="#B45309" class="handwritten">Key Observation from the field data:</text>
      <text x="24" y="66" font-size="19" font-weight="600" fill="#78350F" class="handwritten">→ Clock slowed by 1:15 (20:15 to 21:30) over 8 competitive years</text>
      <text x="24" y="92" font-size="19" font-weight="600" fill="#78350F" class="handwritten">→ Yet Age Grade rose from 71.8% to 73.5% (+1.7% relative gain!)</text>
      <text x="24" y="118" font-size="19" font-weight="700" fill="#047857" class="handwritten">Conclusion: Aerobic quality outpaced the standard biological decay curve!</text>
    </g>
  </g>

  <!-- Right Side Column: Visual Artifacts & Analytical Cards -->
  <g transform="translate(670, 170)">
    
    <!-- Top Right Card: Digital Stopwatch Analysis -->
    <g>
      <rect x="0" y="0" width="450" height="206" rx="16" fill="url(#deskNavy)" filter="url(#deskShadow)" />
      
      <rect x="24" y="20" width="160" height="24" rx="12" fill="rgba(159,231,189,0.18)" stroke="#9FE7BD" stroke-width="1" />
      <text x="104" y="36" font-size="11" font-weight="700" fill="#9FE7BD" text-anchor="middle">DUAL-METRIC SPLIT</text>

      <g transform="translate(24, 60)">
        <!-- Stopwatch screen -->
        <rect x="0" y="0" width="180" height="120" rx="12" fill="#042F2A" stroke="#10B981" stroke-width="1.5" />
        <circle cx="90" cy="18" r="4" fill="#EF4444" />
        <text x="90" y="66" font-size="28" font-weight="900" fill="#9FE7BD" font-family="Courier, monospace" text-anchor="middle">20:58</text>
        <text x="90" y="92" font-size="11.5" font-weight="700" fill="#D3E5DE" text-anchor="middle">RAW CHRONO TIME</text>
        <text x="90" y="108" font-size="10.5" fill="#52796F" text-anchor="middle">Biological Pace</text>
      </g>

      <g transform="translate(224, 60)">
        <!-- Age grade meter -->
        <rect x="0" y="0" width="202" height="120" rx="12" fill="#075433" stroke="#9FE7BD" stroke-width="1.5" />
        <text x="101" y="44" font-size="12" font-weight="700" fill="#D3E5DE" text-anchor="middle">WMA FACTORED LEVEL</text>
        <text x="101" y="84" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">72.3%</text>
        <text x="101" y="106" font-size="11.5" font-weight="700" fill="#9FE7BD" text-anchor="middle">REGIONAL COMPETITIVE</text>
      </g>
    </g>

    <!-- Bottom Right Card: Masters Progression Principles -->
    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="450" height="218" rx="16" fill="#FFFFFF" stroke="#D3E5DE" stroke-width="1.5" filter="url(#deskShadow)" />
      
      <text x="24" y="32" font-size="15" font-weight="800" fill="#0B233A">Why Clock Time Alone Misleads Masters</text>
      
      <g transform="translate(24, 48)">
        <circle cx="10" cy="10" r="10" fill="#FEE2E2" />
        <text x="10" y="14" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">✕</text>
        <text x="32" y="14" font-size="13" font-weight="700" fill="#0B233A">Clock View:</text>
        <text x="110" y="14" font-size="13" fill="#52796F">"I am 43 seconds slower than 4 years ago."</text>
      </g>

      <g transform="translate(24, 88)">
        <circle cx="10" cy="10" r="10" fill="#EBF5F0" />
        <text x="10" y="14" font-size="11" font-weight="800" fill="#075433" text-anchor="middle">✓</text>
        <text x="32" y="14" font-size="13" font-weight="700" fill="#075433">Age Grade View:</text>
        <text x="142" y="14" font-size="13" fill="#52796F">"Relative to age, efficiency increased by +0.5%."</text>
      </g>

      <line x1="24" y1="126" x2="426" y2="126" stroke="#E5EFEA" stroke-width="1" />

      <!-- Handwritten Analyst Annotation -->
      <g transform="translate(24, 136)">
        <text x="0" y="24" font-size="19" font-weight="700" fill="#2563EB" class="handwritten">"Age grading shifts the baseline so aging isn't penalty—</text>
        <text x="0" y="48" font-size="19" font-weight="700" fill="#2563EB" class="handwritten">it turns every birthday into a fresh athletic baseline!"</text>
      </g>
    </g>

  </g>
</svg>
