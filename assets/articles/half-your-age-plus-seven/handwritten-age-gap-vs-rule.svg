<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">AGE GAP vs. DATING AGE RULE: TWO DISTINCT FORMULAS</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">CONCEPT CLARIFICATION</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(85, 130)">
    <!-- Column 1: Age Gap -->
    <rect x="0" y="0" width="295" height="215" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1.5"/>
    <text x="24" y="32" fill="#075433" font-size="14" font-weight="700">1. AGE GAP FORMULA</text>
    <text x="24" y="60" fill="#042f2a" font-size="16" font-family="'Courier New', monospace" font-weight="700">Older Age − Younger Age</text>
    
    <rect x="24" y="78" width="247" height="65" rx="4" fill="#ffffff" stroke="#cfe2d8" stroke-width="1"/>
    <text x="36" y="105" fill="#042f2a" font-size="18" font-family="'Courier New', monospace" font-weight="700">40 − 30 = 10 Years</text>
    <text x="36" y="128" fill="#52796f" font-size="11">Numerical difference between two people</text>
    
    <text x="24" y="165" fill="#2d5244" font-size="12">• Purely descriptive</text>
    <text x="24" y="185" fill="#2d5244" font-size="12">• Does not set social boundaries</text>
    
    <!-- Column 2: Dating Age Rule -->
    <rect x="335" y="0" width="295" height="215" rx="6" fill="#fdf6f3" stroke="#f2cfc2" stroke-width="1.5"/>
    <text x="359" y="32" fill="#a83f21" font-size="14" font-weight="700">2. DATING AGE RULE</text>
    <text x="359" y="60" fill="#a83f21" font-size="16" font-family="'Courier New', monospace" font-weight="700">(Your Age ÷ 2) + 7</text>
    
    <rect x="359" y="78" width="247" height="65" rx="4" fill="#ffffff" stroke="#ebd2c8" stroke-width="1"/>
    <text x="371" y="105" fill="#a83f21" font-size="18" font-family="'Courier New', monospace" font-weight="700">40 ÷ 2 + 7 = 27 Years</text>
    <text x="371" y="128" fill="#66463c" font-size="11">Minimum suggested partner age</text>
    
    <text x="359" y="165" fill="#66463c" font-size="12">• Prescriptive social rule of thumb</text>
    <text x="359" y="185" fill="#66463c" font-size="12">• Yields an age range, not a difference</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>