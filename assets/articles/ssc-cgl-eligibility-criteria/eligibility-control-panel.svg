<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#021F1C; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042F2A"/>
      <stop offset="100%" stop-color="#021A17"/>
    </linearGradient>
    <linearGradient id="cardPass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3C35"/>
      <stop offset="100%" stop-color="#072C27"/>
    </linearGradient>
    <linearGradient id="cardPending" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2B05"/>
      <stop offset="100%" stop-color="#241903"/>
    </linearGradient>
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#panelBg)"/>

  <!-- Top Dashboard Bar -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="70" rx="12" fill="#063D36" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="45" cy="35" r="16" fill="#10B981"/>
    <text x="45" y="42" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="80" y="32" fill="#FFFFFF" font-size="18" font-weight="800">SSC CGL 2026 CANDIDATE ELIGIBILITY AUDIT PANEL</text>
    <text x="80" y="52" fill="#A7F3D0" font-size="12">Evaluation Reference Date: 01 August 2026 &#8226; Framework: Staff Selection Commission Gazette</text>

    <!-- Status Badge -->
    <rect x="890" y="18" width="165" height="34" rx="17" fill="#065F46" stroke="#34D399" stroke-width="1"/>
    <circle cx="910" cy="35" r="5" fill="#34D399"/>
    <text x="925" y="40" fill="#ECFDF5" font-size="12" font-weight="700">STATUS: AUDITED</text>
  </g>

  <!-- 6 Dashboard Cards Grid (2 rows x 3 columns) -->

  <!-- Card 1: Age Ceiling -->
  <g transform="translate(60, 140)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPass)" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="36" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1">FACTOR 01 &#8226; AGE LIMIT</text>
    <circle cx="300" cy="32" r="14" fill="#065F46"/>
    <text x="300" y="38" fill="#34D399" font-size="14" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">26 Yrs, 4 Mos, 12 Days</text>
    <text x="24" y="96" fill="#A7F3D0" font-size="13">Computed as on 01 August 2026</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#10B981" opacity="0.3"/>
    
    <text x="24" y="140" fill="#E2E8F0" font-size="12">Target Cadre: <tspan fill="#34D399" font-weight="700">Inspectors (CBIC / CBDT)</tspan></text>
    <text x="24" y="160" fill="#E2E8F0" font-size="12">Statutory Band: <tspan fill="#FFFFFF" font-weight="700">18&#8211;30 Years (Base UR)</tspan></text>
    <text x="24" y="186" fill="#34D399" font-size="12" font-weight="700">&#10004; Passed: Safely inside statutory bracket</text>
  </g>

  <!-- Card 2: DOB Window -->
  <g transform="translate(432, 140)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPass)" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="36" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1">FACTOR 02 &#8226; DATE OF BIRTH</text>
    <circle cx="300" cy="32" r="14" fill="#065F46"/>
    <text x="300" y="38" fill="#34D399" font-size="14" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">DOB: 20-March-2000</text>
    <text x="24" y="96" fill="#A7F3D0" font-size="13">Matriculation Certificate Proof</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#10B981" opacity="0.3"/>
    
    <text x="24" y="140" fill="#E2E8F0" font-size="12">Earliest Allowed: <tspan fill="#FFFFFF" font-weight="700">02 August 1996</tspan></text>
    <text x="24" y="160" fill="#E2E8F0" font-size="12">Latest Allowed: <tspan fill="#FFFFFF" font-weight="700">01 August 2008</tspan></text>
    <text x="24" y="186" fill="#34D399" font-size="12" font-weight="700">&#10004; Passed: Falls inside permissible window</text>
  </g>

  <!-- Card 3: Educational Qualification -->
  <g transform="translate(805, 140)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPass)" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="36" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1">FACTOR 03 &#8226; GRADUATION</text>
    <circle cx="300" cy="32" r="14" fill="#065F46"/>
    <text x="300" y="38" fill="#34D399" font-size="14" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">B.Tech / B.Sc / B.Com</text>
    <text x="24" y="96" fill="#A7F3D0" font-size="13">Recognized UGC University Degree</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#10B981" opacity="0.3"/>
    
    <text x="24" y="140" fill="#E2E8F0" font-size="12">Result Declared: <tspan fill="#34D399" font-weight="700">15 May 2024</tspan></text>
    <text x="24" y="160" fill="#E2E8F0" font-size="12">Cutoff Boundary: <tspan fill="#FFFFFF" font-weight="700">&#8804; 01 August 2026</tspan></text>
    <text x="24" y="186" fill="#34D399" font-size="12" font-weight="700">&#10004; Passed: Acquired before crucial cutoff</text>
  </g>

  <!-- Card 4: Nationality / Citizenship -->
  <g transform="translate(60, 370)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPass)" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="36" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1">FACTOR 04 &#8226; NATIONALITY</text>
    <circle cx="300" cy="32" r="14" fill="#065F46"/>
    <text x="300" y="38" fill="#34D399" font-size="14" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">Citizen of India</text>
    <text x="24" y="96" fill="#A7F3D0" font-size="13">Para 5 Official Notification Standard</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#10B981" opacity="0.3"/>
    
    <text x="24" y="140" fill="#E2E8F0" font-size="12">Clause: <tspan fill="#FFFFFF" font-weight="700">Para 5(a) Natural Citizen</tspan></text>
    <text x="24" y="160" fill="#E2E8F0" font-size="12">GoI Cert: <tspan fill="#34D399" font-weight="700">Not required for Indian citizens</tspan></text>
    <text x="24" y="186" fill="#34D399" font-size="12" font-weight="700">&#10004; Passed: Complete nationality clearance</text>
  </g>

  <!-- Card 5: Post Specifics -->
  <g transform="translate(432, 370)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPass)" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="36" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1">FACTOR 05 &#8226; POST SPECIFICS</text>
    <circle cx="300" cy="32" r="14" fill="#065F46"/>
    <text x="300" y="38" fill="#34D399" font-size="14" font-weight="900" text-anchor="middle">&#10004;</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">Physical Standards</text>
    <text x="24" y="96" fill="#A7F3D0" font-size="13">Mandatory for CBIC / CBI Cadres</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#10B981" opacity="0.3"/>
    
    <text x="24" y="140" fill="#E2E8F0" font-size="12">Height Required: <tspan fill="#FFFFFF" font-weight="700">&#8805; 157.5 cm (Male)</tspan></text>
    <text x="24" y="160" fill="#E2E8F0" font-size="12">Chest: <tspan fill="#FFFFFF" font-weight="700">81 cm (expanded 5 cm)</tspan></text>
    <text x="24" y="186" fill="#34D399" font-size="12" font-weight="700">&#10004; Passed: Satisfies CBIC physical norm</text>
  </g>

  <!-- Card 6: Documents & Category Proof (PENDING VERIFICATION) -->
  <g transform="translate(805, 370)" filter="url(#panelShadow)">
    <rect width="335" height="205" rx="12" fill="url(#cardPending)" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="24" y="36" fill="#FCD34D" font-size="11" font-weight="700" letter-spacing="1">FACTOR 06 &#8226; DOCUMENTS</text>
    <circle cx="300" cy="32" r="14" fill="#78350F"/>
    <text x="300" y="38" fill="#FBBF24" font-size="13" font-weight="900" text-anchor="middle">?</text>
    
    <text x="24" y="74" fill="#FFFFFF" font-size="20" font-weight="800">Caste / EWS Certificate</text>
    <text x="24" y="96" fill="#FDE68A" font-size="13">Format &amp; Validity Audit Required</text>
    
    <rect x="24" y="115" width="287" height="1" fill="#F59E0B" opacity="0.3"/>
    
    <text x="24" y="140" fill="#FEF3C7" font-size="12">Category Claim: <tspan fill="#FFFFFF" font-weight="700">OBC (Non-Creamy Layer)</tspan></text>
    <text x="24" y="160" fill="#FEF3C7" font-size="12">Mandate: <tspan fill="#FCD34D" font-weight="700">Central Govt format (3 Yrs)</tspan></text>
    <text x="24" y="186" fill="#FBBF24" font-size="12" font-weight="700">&#9888; Action: Verify certificate valid for 2026</text>
  </g>

  <!-- Bottom Bar Indicator -->
  <g transform="translate(60, 605)">
    <rect width="1080" height="35" rx="8" fill="#06352E" stroke="#10B981" stroke-width="1"/>
    <text x="20" y="22" fill="#6EE7B7" font-size="12" font-weight="700">&#9656; System Conclusion:</text>
    <text x="160" y="22" fill="#E2E8F0" font-size="12">Candidate qualifies across all substantive statutory criteria. Final verification will be confirmed upon physical document presentation at DV stage.</text>
  </g>
</svg>