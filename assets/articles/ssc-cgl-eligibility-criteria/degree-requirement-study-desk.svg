<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="background:#0F2922; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143A31"/>
      <stop offset="100%" stop-color="#0B201B"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="deskShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#deskGrad)"/>

  <!-- Top Title -->
  <text x="50" y="48" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1">EDUCATIONAL QUALIFICATION AUDIT</text>
  <text x="50" y="82" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="700">Degree &amp; Cutoff Date Verification</text>
  <text x="50" y="106" fill="#A7F3D0" font-size="13.5">The candidate must possess the essential degree on or before 01 August 2026</text>

  <!-- Laptop Display (Generic Application Interface) -->
  <g transform="translate(50, 140)" filter="url(#deskShadow)">
    <!-- Screen Bezel -->
    <rect width="360" height="240" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Screen Content -->
    <rect x="10" y="10" width="340" height="220" rx="6" fill="#F8FAFC"/>
    <!-- Browser Top Bar -->
    <rect x="10" y="10" width="340" height="28" fill="#E2E8F0"/>
    <circle cx="26" cy="24" r="4" fill="#EF4444"/>
    <circle cx="38" cy="24" r="4" fill="#F59E0B"/>
    <circle cx="50" cy="24" r="4" fill="#10B981"/>
    <rect x="70" y="17" width="200" height="14" rx="4" fill="#FFFFFF"/>
    <text x="80" y="28" fill="#64748B" font-size="9">online-application.portal/cgl2026/step-3</text>
    
    <!-- Portal Content -->
    <text x="24" y="62" fill="#0F172A" font-size="13" font-weight="700">Step 3: Educational Qualifications</text>
    <rect x="24" y="74" width="312" height="34" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="34" y="90" fill="#1E40AF" font-size="10" font-weight="600">Essential Qualification Status:</text>
    <text x="34" y="102" fill="#2563EB" font-size="9">Passed Bachelor&#8217;s Degree from Recognized University</text>

    <!-- Cutoff Date Check Box -->
    <rect x="24" y="118" width="312" height="42" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <text x="34" y="134" fill="#065F46" font-size="10" font-weight="700">&#10004; Crucial Qualification Cutoff Date: 01-08-2026</text>
    <text x="34" y="148" fill="#047857" font-size="9">Result Declared Date on Marksheet must be &#8804; 01-08-2026</text>

    <!-- Additional Cadre Dropdown -->
    <text x="24" y="180" fill="#475569" font-size="10" font-weight="600">Applying for JSO (Statistical Cadre)?</text>
    <rect x="24" y="188" width="312" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="34" y="205" fill="#334155" font-size="9.5">Yes &#8212; Studied Statistics / 60% Math in Class 12</text>
  </g>

  <!-- Laptop Base -->
  <polygon points="30,380 430,380 450,395 10,395" fill="#94A3B8" opacity="0.8"/>
  <rect x="180" y="380" width="100" height="5" rx="2" fill="#64748B"/>

  <!-- University Graduation Certificate Folder -->
  <g transform="translate(440, 140)" filter="url(#deskShadow)">
    <!-- Blue Certificate Folder -->
    <rect width="310" height="400" rx="8" fill="url(#folderGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="10" y="10" width="290" height="380" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- White Certificate Document inside -->
    <rect x="22" y="22" width="266" height="356" rx="4" fill="url(#paperGrad)"/>
    <rect x="28" y="28" width="254" height="344" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Gold University Crest Badge -->
    <circle cx="155" cy="65" r="20" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="155" y="70" fill="#B45309" font-size="14" font-weight="800" text-anchor="middle">&#127891;</text>
    
    <text x="155" y="106" fill="#1E293B" font-family="'Fraunces', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">CENTRAL UNIVERSITY</text>
    <text x="155" y="122" fill="#64748B" font-size="8.5" text-anchor="middle">ESTABLISHED UNDER SECTION 3 OF UGC ACT 1956</text>
    <line x1="60" y1="130" x2="250" y2="130" stroke="#E2E8F0" stroke-width="1"/>

    <text x="155" y="154" fill="#334155" font-size="10" text-anchor="middle">This is to certify that candidate has been awarded</text>
    <text x="155" y="174" fill="#0F172A" font-size="13" font-weight="800" text-anchor="middle">BACHELOR OF SCIENCE / ARTS</text>
    <text x="155" y="192" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">First Class with Distinction</text>

    <!-- Result Declaration Date Highlight -->
    <rect x="40" y="210" width="230" height="48" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="155" y="228" fill="#1E40AF" font-size="9" font-weight="700" text-anchor="middle">CRUCIAL DECLARATION DATE</text>
    <text x="155" y="246" fill="#1D4ED8" font-size="12" font-weight="800" text-anchor="middle">Date of Declaration: 12 June 2026</text>

    <!-- Stamp & Seal -->
    <circle cx="80" cy="305" r="22" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="80" y="302" fill="#059669" font-size="7.5" font-weight="800" text-anchor="middle">VALID PROOF</text>
    <text x="80" y="312" fill="#059669" font-size="7" text-anchor="middle">&#8804; 01-AUG-2026</text>

    <line x1="170" y1="315" x2="250" y2="315" stroke="#94A3B8" stroke-width="1"/>
    <text x="210" y="328" fill="#64748B" font-size="8" text-anchor="middle">Controller of Exams</text>
  </g>

  <!-- Final-Year Student Rule Note Card -->
  <g transform="translate(50, 420)" filter="url(#deskShadow)">
    <rect width="360" height="120" rx="8" fill="#1E3A34" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="28" fill="#FCD34D" font-size="12" font-weight="700">&#9888; CRITICAL RULE FOR FINAL-YEAR STUDENTS</text>
    <text x="18" y="52" fill="#ECFDF5" font-size="11" line-height="1.5">Appearing final-year students are eligible to apply</text>
    <text x="18" y="70" fill="#ECFDF5" font-size="11"><strong>ONLY IF</strong> their final degree result is officially declared</text>
    <text x="18" y="88" fill="#34D399" font-size="11.5" font-weight="700">on or before 01 August 2026.</text>
    <text x="18" y="106" fill="#A7F3D0" font-size="9.5">Merely giving final exams without result declaration causes rejection.</text>
  </g>
</svg>