<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#FFFDF7; font-family:'Caveat', 'Comic Sans MS', cursive, sans-serif;">
  <defs>
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Lined Notebook Page -->
  <g filter="url(#paperShadow)">
    <rect x="30" y="20" width="740" height="460" rx="10" fill="#FFFDF7" stroke="#E2D9C8" stroke-width="2"/>
    
    <!-- Red Margin Line -->
    <line x1="120" y1="20" x2="120" y2="480" stroke="#F87171" stroke-width="2" opacity="0.6"/>

    <!-- Blue Horizontal Notebook Lines -->
    <g stroke="#93C5FD" stroke-width="1" opacity="0.45">
      <line x1="30" y1="70" x2="770" y2="70"/>
      <line x1="30" y1="110" x2="770" y2="110"/>
      <line x1="30" y1="150" x2="770" y2="150"/>
      <line x1="30" y1="190" x2="770" y2="190"/>
      <line x1="30" y1="230" x2="770" y2="230"/>
      <line x1="30" y1="270" x2="770" y2="270"/>
      <line x1="30" y1="310" x2="770" y2="310"/>
      <line x1="30" y1="350" x2="770" y2="350"/>
      <line x1="30" y1="390" x2="770" y2="390"/>
      <line x1="30" y1="430" x2="770" y2="430"/>
    </g>

    <!-- Spiral Notebook Rings -->
    <g fill="#CBD5E1">
      <circle cx="50" cy="50" r="5"/>
      <circle cx="50" cy="110" r="5"/>
      <circle cx="50" cy="170" r="5"/>
      <circle cx="50" cy="230" r="5"/>
      <circle cx="50" cy="290" r="5"/>
      <circle cx="50" cy="350" r="5"/>
      <circle cx="50" cy="410" r="5"/>
    </g>
  </g>

  <!-- Handwritten Text Content in Blue Ink -->
  <g fill="#1E3A8A">
    <!-- Header with highlighter -->
    <rect x="140" y="45" width="310" height="34" fill="#FEF08A" opacity="0.6" rx="4" transform="rotate(-1 295 62)"/>
    <text x="145" y="70" font-size="30" font-weight="700">Before I Apply (SSC CGL 2026)</text>
    
    <!-- Checklist items with green checkmarks -->
    <text x="145" y="112" font-size="22">&#10004; <tspan font-weight="700">Graduation Degree:</tspan> Result declared &#8804; 01 August 2026</text>
    <text x="145" y="152" font-size="22">&#10004; <tspan font-weight="700">Date of Birth (DOB):</tspan> Exactly as printed on 10th Certificate</text>
    <text x="145" y="192" font-size="22">&#10004; <tspan font-weight="700">Age on 01-Aug-2026:</tspan> Checked against target post band (e.g. 18-30)</text>
    <text x="145" y="232" font-size="22">&#10004; <tspan font-weight="700">Nationality / Citizenship:</tspan> Citizen of India (Para 5 of notice)</text>
    <text x="145" y="272" font-size="22">&#10004; <tspan font-weight="700">Post-Specific Requirements:</tspan> 60% Math (JSO) / Physical (Excise)</text>
    <text x="145" y="312" font-size="22">&#10004; <tspan font-weight="700">Category Proof:</tspan> Valid OBC (NCL) / SC / ST / EWS in Central Govt Format</text>
    <text x="145" y="352" font-size="22">&#10004; <tspan font-weight="700">Original Documents:</tspan> Marksheets, degree, photo &amp; signature scanned</text>

    <!-- Red Circle / Underline Rule -->
    <path d="M 140 375 C 280 372, 450 378, 620 374" stroke="#DC2626" stroke-width="2.5" fill="none"/>
    <text x="145" y="415" font-size="24" font-weight="700" fill="#B91C1C">&#10140; ALL 7 MUST MATCH &#8594; THEN SUBMIT APPLICATION!</text>
  </g>

  <!-- Realistic Sticky Note at Bottom-Right -->
  <g transform="translate(560, 290) rotate(4)" filter="url(#paperShadow)">
    <rect width="180" height="150" fill="#FEF08A" rx="4" stroke="#FDE047" stroke-width="1"/>
    <text x="20" y="34" fill="#854D0E" font-size="16" font-weight="700">REMINDER:</text>
    <text x="15" y="62" fill="#713F12" font-size="15">Aadhaar DOB is NOT</text>
    <text x="15" y="86" fill="#713F12" font-size="15">accepted for age.</text>
    <text x="15" y="112" fill="#B45309" font-size="15" font-weight="700">Only 10th certificate!</text>
  </g>
</svg>