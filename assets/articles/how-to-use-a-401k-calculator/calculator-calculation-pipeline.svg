<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="auto" role="img" aria-label="How a 401(k) Calculator Estimates Retirement Savings">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="360" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">The 401(k) Calculator Calculation Pipeline</text>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">How personal user inputs are processed through compounding engines to generate retirement estimates.</text>

  <!-- Step 1: Inputs -->
  <g transform="translate(45, 110)">
    <rect width="165" height="230" fill="#f8faf9" rx="6" stroke="#d5e6dc"/>
    <rect width="165" height="30" fill="#042f2a" rx="6 6 0 0"/>
    <text x="82" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. User Inputs</text>
    <text x="15" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Current &amp; Target Age</text>
    <text x="15" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Starting Balance</text>
    <text x="15" y="101" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Gross Annual Salary</text>
    <text x="15" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Contribution Rate (%)</text>
    <text x="15" y="147" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Employer Match Formula</text>
    <text x="15" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Return Assumption</text>
    <text x="15" y="193" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Salary Growth Rate</text>
  </g>

  <!-- Arrow -->
  <text x="225" y="230" font-family="'Inter', sans-serif" font-size="24" fill="#075433" text-anchor="middle">→</text>

  <!-- Step 2: Engine -->
  <g transform="translate(245, 110)">
    <rect width="170" height="230" fill="#f8faf9" rx="6" stroke="#075433" stroke-width="1.5"/>
    <rect width="170" height="30" fill="#075433" rx="6 6 0 0"/>
    <text x="85" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. Annual Engine</text>
    <text x="15" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Calculate Annual Salary</text>
    <text x="15" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Compute Employee Deferral</text>
    <text x="15" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Compute Match Match Cap</text>
    <text x="15" y="130" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Compound Existing Pool</text>
    <text x="15" y="155" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Apply Monthly Rate r/12</text>
    <text x="15" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Iterate for Each Horizon Year</text>
  </g>

  <!-- Arrow -->
  <text x="430" y="230" font-family="'Inter', sans-serif" font-size="24" fill="#075433" text-anchor="middle">→</text>

  <!-- Step 3: Analysis -->
  <g transform="translate(450, 110)">
    <rect width="170" height="230" fill="#f8faf9" rx="6" stroke="#d5e6dc"/>
    <rect width="170" height="30" fill="#042f2a" rx="6 6 0 0"/>
    <text x="85" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. Scenarios &amp; Curves</text>
    <text x="15" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• 5%, 7%, 9% Sensitivity</text>
    <text x="15" y="85" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Auto-Escalation Model</text>
    <text x="15" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Discount Inflation (Real $)</text>
    <text x="15" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Age Milestones (40, 50, 60)</text>
    <text x="15" y="175" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">• Dynamic SVG Chart Engine</text>
  </g>

  <!-- Arrow -->
  <text x="635" y="230" font-family="'Inter', sans-serif" font-size="24" fill="#075433" text-anchor="middle">→</text>

  <!-- Step 4: Results -->
  <g transform="translate(650, 110)">
    <rect width="150" height="230" fill="#eaf5ee" rx="6" stroke="#075433" stroke-width="2"/>
    <rect width="150" height="30" fill="#075433" rx="6 6 0 0"/>
    <text x="75" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. Final Results</text>
    <text x="15" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#042f2a">Total Nest Egg</text>
    <text x="15" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">Your Cash In</text>
    <text x="15" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">Employer Match</text>
    <text x="15" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#2e4b3f">Compound Gains</text>
    <text x="15" y="145" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d">Today's Value</text>
    <text x="15" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#5a7368">(Real Buying Power)</text>
  </g>
</svg>