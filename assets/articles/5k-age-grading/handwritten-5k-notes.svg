<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Handwritten 5K Age Grading Calculation Notes and Formula Breakdown">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE"/>
      <stop offset="100%" stop-color="#ECE7DB"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="2" dy="14" stdDeviation="18" flood-color="#0B233A" flood-opacity="0.12"/>
    </filter>
    <filter id="bibShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="3" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Desk Surface Background -->
  <rect width="1200" height="675" fill="url(#deskBg)"/>

  <!-- Subtle Mat Grid -->
  <g opacity="0.08" stroke="#52796F" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- 5K Race Bib in Top Right Corner -->
  <g transform="translate(860, 40) rotate(3)" filter="url(#bibShadow)">
    <rect width="280" height="185" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#042F2A"/>
    <text x="140" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#9FE7BD" text-anchor="middle" letter-spacing="1.2">PARKRUN &amp; 5K SERIES</text>
    <text x="140" y="112" font-family="'Fraunces', serif" font-size="64" font-weight="900" fill="#075433" text-anchor="middle">5024</text>
    <text x="140" y="148" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">DIVISION: M50 · CHIP TIMED</text>
    <circle cx="20" cy="20" r="4" fill="#94A3B8"/>
    <circle cx="260" cy="20" r="4" fill="#94A3B8"/>
  </g>

  <!-- Printed Calculation Worksheet (Center Left) -->
  <g transform="translate(80, 50)" filter="url(#sheetShadow)">
    <rect width="740" height="575" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header -->
    <g transform="translate(44, 40)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#64748B" letter-spacing="1.5">AGE CALCULATOR LAB · ATHLETIC LAB NOTES</text>
      <text x="0" y="32" font-family="'Fraunces', serif" font-size="26" font-weight="700" fill="#0B233A">5K Age-Grade Step-by-Step Calculation Audit</text>
      <text x="0" y="56" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Runner Profile: Male, Age 50 · Actual 5K Chip Time: 25:00 (1,500.00 seconds)</text>
      <line x1="0" y1="74" x2="652" y2="74" stroke="#E2E8F0" stroke-width="1.5"/>
    </g>

    <!-- Step 1: Time in Seconds -->
    <g transform="translate(44, 140)">
      <rect width="36" height="36" rx="18" fill="#075433"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="50" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0B233A">Convert 5K Chip Time to Total Seconds</text>
      <text x="50" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#475569">25 minutes × 60 = 1,500 seconds (Net Elapsed Chip Time)</text>
    </g>

    <!-- Step 2: WMA Benchmark Factor Lookup -->
    <g transform="translate(44, 215)">
      <rect width="36" height="36" rx="18" fill="#075433"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="50" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0B233A">Determine WMA 2025 Age-50 Standard Time</text>
      <text x="50" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#475569">WMA Standard for 50yo Male = 14:18.9 (approx. 858.9 seconds) [Factor: 0.8790]</text>
    </g>

    <!-- Step 3: Division Formula Execution -->
    <g transform="translate(44, 290)">
      <rect width="36" height="36" rx="18" fill="#075433"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="50" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0B233A">Execute Division &amp; Scale to Percentage</text>
      <text x="50" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#475569">Age Grade (%) = (858.9 / 1500) × 100 = 57.26%</text>
    </g>

    <!-- Step 4: Theoretical Age-Graded Time -->
    <g transform="translate(44, 365)">
      <rect width="36" height="36" rx="18" fill="#075433"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="50" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0B233A">Calculate Theoretical Open Equivalent Time</text>
      <text x="50" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#475569">Open Equivalent = 1,500s × 0.8790 = 1,318.5s → 21:58 (Theoretical 20-30yo time)</text>
    </g>

    <!-- Hand-Drawn Style Annotations (Navy / Emerald ink) -->
    <g transform="translate(44, 440)">
      <rect width="652" height="100" rx="10" fill="#F4F9F6" stroke="#9FE7BD" stroke-width="1.5" stroke-dasharray="6 4"/>
      
      <!-- Handwritten style notes -->
      <text x="24" y="35" font-family="'Caveat', cursive, sans-serif" font-size="24" font-weight="700" fill="#075433">Takeaway: The 25:00 clock time is equal to a 21:58 open performance!</text>
      <text x="24" y="68" font-family="'Caveat', cursive, sans-serif" font-size="21" font-weight="600" fill="#0B233A">→ Natural aerobic baseline intact: 57.26% places runner securely in solid local tier.</text>
      <circle cx="560" cy="52" r="32" fill="none" stroke="#FF754D" stroke-width="2.5" stroke-dasharray="140 20"/>
      <text x="560" y="59" font-family="'Inter', sans-serif" font-size="17" font-weight="900" fill="#FF754D" text-anchor="middle">57.26%</text>
    </g>
  </g>

  <!-- Sticky Note in Bottom Right Corner -->
  <g transform="translate(860, 260) rotate(-2)" filter="url(#bibShadow)">
    <rect width="280" height="230" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <g transform="translate(24, 28)">
      <text x="0" y="0" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#92400E">Rule of Thumb:</text>
      <text x="0" y="32" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="600" fill="#78350F">• 50% = Typical healthy runner</text>
      <text x="0" y="62" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="600" fill="#78350F">• 60% = Consistent local trainer</text>
      <text x="0" y="92" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="600" fill="#78350F">• 70% = Regional podium contender</text>
      <text x="0" y="122" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="600" fill="#78350F">• 80% = National master class</text>
      <text x="0" y="152" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="600" fill="#9A3412">Never compare times across ages without WMA tables!</text>
    </g>
  </g>
</svg>
