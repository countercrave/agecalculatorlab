<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="5K Multi-Year Progression and Performance Timeline">
  <defs>
    <linearGradient id="timelineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B233A"/>
      <stop offset="60%" stop-color="#075433"/>
      <stop offset="100%" stop-color="#042F2A"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#timelineBg)"/>

  <!-- Background Graph Lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="300" x2="1120" y2="300"/>
    <line x1="80" y1="400" x2="1120" y2="400"/>
    <line x1="80" y1="500" x2="1120" y2="500"/>
  </g>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="250" height="30" rx="15" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
    <circle cx="16" cy="15" r="5" fill="#9FE7BD"/>
    <text x="32" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D3E5DE" letter-spacing="1">LONGITUDINAL TRACKING</text>
    
    <text x="0" y="70" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">15-Year 5K Performance Progression</text>
    <text x="0" y="98" font-family="'Inter', sans-serif" font-size="16" fill="#D3E5DE">Why raw clock times slow down, but physiological age grades climb or remain stable</text>
  </g>

  <!-- Timeline Cards Across 4 Life Stages -->
  <g transform="translate(80, 180)">
    <!-- Stage 1: Age 45 -->
    <g transform="translate(0, 0)" filter="url(#tileShadow)">
      <rect width="245" height="360" rx="14" fill="#0D3B35" stroke="rgba(159, 231, 189, 0.25)" stroke-width="1.5"/>
      <rect x="20" y="20" width="70" height="24" rx="6" fill="rgba(255,255,255,0.1)"/>
      <text x="55" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#9FE7BD" text-anchor="middle">AGE 45</text>
      
      <text x="20" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#A7F3D0">SPRING 5K</text>
      <text x="20" y="115" font-family="'Fraunces', serif" font-size="32" font-weight="800" fill="#FFFFFF">21:30</text>
      <text x="20" y="140" font-family="'Inter', sans-serif" font-size="13" fill="#D3E5DE">Pace: 6:55 / mi</text>
      
      <line x1="20" y1="165" x2="225" y2="165" stroke="rgba(255,255,255,0.15)"/>
      
      <text x="20" y="200" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9FE7BD">CALCULATED AGE GRADE</text>
      <text x="20" y="240" font-family="'Fraunces', serif" font-size="36" font-weight="800" fill="#5EEAD4">63.57%</text>
      
      <rect x="20" y="270" width="205" height="65" rx="8" fill="rgba(0,0,0,0.2)"/>
      <text x="30" y="295" font-family="'Inter', sans-serif" font-size="11.5" fill="#D3E5DE">Competitive local level.</text>
      <text x="30" y="315" font-family="'Inter', sans-serif" font-size="11.5" fill="#9FE7BD">High baseline speed.</text>
    </g>

    <!-- Stage 2: Age 50 -->
    <g transform="translate(270, 0)" filter="url(#tileShadow)">
      <rect width="245" height="360" rx="14" fill="#0D3B35" stroke="rgba(159, 231, 189, 0.25)" stroke-width="1.5"/>
      <rect x="20" y="20" width="70" height="24" rx="6" fill="rgba(255,255,255,0.1)"/>
      <text x="55" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#9FE7BD" text-anchor="middle">AGE 50</text>
      
      <text x="20" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#A7F3D0">FALL 5K</text>
      <text x="20" y="115" font-family="'Fraunces', serif" font-size="32" font-weight="800" fill="#FFFFFF">22:15</text>
      <text x="20" y="140" font-family="'Inter', sans-serif" font-size="13" fill="#D3E5DE">Pace: 7:10 / mi</text>
      
      <line x1="20" y1="165" x2="225" y2="165" stroke="rgba(255,255,255,0.15)"/>
      
      <text x="20" y="200" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9FE7BD">CALCULATED AGE GRADE</text>
      <text x="20" y="240" font-family="'Fraunces', serif" font-size="36" font-weight="800" fill="#5EEAD4">64.34%</text>
      
      <rect x="20" y="270" width="205" height="65" rx="8" fill="rgba(0,0,0,0.2)"/>
      <text x="30" y="295" font-family="'Inter', sans-serif" font-size="11.5" fill="#D3E5DE">Clock slowed by 45s.</text>
      <text x="30" y="315" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#9FE7BD">Grade gained +0.77%!</text>
    </g>

    <!-- Stage 3: Age 55 -->
    <g transform="translate(540, 0)" filter="url(#tileShadow)">
      <rect width="245" height="360" rx="14" fill="#0D3B35" stroke="rgba(159, 231, 189, 0.25)" stroke-width="1.5"/>
      <rect x="20" y="20" width="70" height="24" rx="6" fill="rgba(255,255,255,0.1)"/>
      <text x="55" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#9FE7BD" text-anchor="middle">AGE 55</text>
      
      <text x="20" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#A7F3D0">SUMMER 5K</text>
      <text x="20" y="115" font-family="'Fraunces', serif" font-size="32" font-weight="800" fill="#FFFFFF">23:05</text>
      <text x="20" y="140" font-family="'Inter', sans-serif" font-size="13" fill="#D3E5DE">Pace: 7:26 / mi</text>
      
      <line x1="20" y1="165" x2="225" y2="165" stroke="rgba(255,255,255,0.15)"/>
      
      <text x="20" y="200" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9FE7BD">CALCULATED AGE GRADE</text>
      <text x="20" y="240" font-family="'Fraunces', serif" font-size="36" font-weight="800" fill="#5EEAD4">64.77%</text>
      
      <rect x="20" y="270" width="205" height="65" rx="8" fill="rgba(0,0,0,0.2)"/>
      <text x="30" y="295" font-family="'Inter', sans-serif" font-size="11.5" fill="#D3E5DE">Clock slowed by 50s.</text>
      <text x="30" y="315" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#9FE7BD">Grade gained +0.43%!</text>
    </g>

    <!-- Stage 4: Age 60 -->
    <g transform="translate(810, 0)" filter="url(#tileShadow)">
      <rect width="245" height="360" rx="14" fill="#0B233A" stroke="#FF754D" stroke-width="2"/>
      <rect x="20" y="20" width="70" height="24" rx="6" fill="#FF754D"/>
      <text x="55" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AGE 60</text>
      
      <text x="20" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFA07A">AUTUMN 5K</text>
      <text x="20" y="115" font-family="'Fraunces', serif" font-size="32" font-weight="800" fill="#FFFFFF">23:50</text>
      <text x="20" y="140" font-family="'Inter', sans-serif" font-size="13" fill="#D3E5DE">Pace: 7:40 / mi</text>
      
      <line x1="20" y1="165" x2="225" y2="165" stroke="rgba(255,255,255,0.15)"/>
      
      <text x="20" y="200" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFA07A">CALCULATED AGE GRADE</text>
      <text x="20" y="240" font-family="'Fraunces', serif" font-size="36" font-weight="800" fill="#FF754D">65.73%</text>
      
      <rect x="20" y="270" width="205" height="65" rx="8" fill="rgba(0,0,0,0.3)"/>
      <text x="30" y="295" font-family="'Inter', sans-serif" font-size="11.5" fill="#D3E5DE">Highest lifetime grade!</text>
      <text x="30" y="315" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#FF9A77">+2.16% above Age 45.</text>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(80, 580)">
    <rect width="1055" height="48" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Key Insight: <tspan font-weight="400" fill="#D3E5DE">Although raw clock time slowed from 21:30 to 23:50 (+2:20), the runner's demographic grade increased from 63.57% to 65.73%, reflecting outstanding aerobic preservation.</tspan></text>
  </g>
</svg>
