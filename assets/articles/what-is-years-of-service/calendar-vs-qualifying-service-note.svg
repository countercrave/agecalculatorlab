<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="slate-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="sticky-shadow" x="-5%" y="-5%" width="115%" height="118%">
      <feDropShadow dx="6" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Office Surface Background -->
  <rect width="800" height="600" fill="url(#slate-bg)" />

  <!-- Technical Post-It / Memo Sheet -->
  <g transform="translate(110, 50)" filter="url(#sticky-shadow)">
    <!-- Memo Sheet Body with Slight Tilt -->
    <rect x="0" y="0" width="580" height="490" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.5" transform="rotate(-1 290 245)" />

    <!-- Top Pin / Tape Element -->
    <rect x="230" y="-12" width="120" height="26" rx="4" fill="#fde68a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1" />

    <!-- Memo Content -->
    <g transform="translate(45, 40)">
      <!-- Caution Badge -->
      <rect x="0" y="0" width="165" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" />
      <text x="82" y="18" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&#9888; CRITICAL HR DISTINCTION</text>

      <!-- Main Headline in Bold Hand-Style -->
      <text x="0" y="65" fill="#78350f" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="23" font-weight="bold">Calendar Service &#8800; Always Qualifying Service</text>
      <!-- Double Underline -->
      <path d="M 0,76 Q 240,82 485,76" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 5,82 Q 240,88 475,82" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />

      <!-- Side-by-side comparison boxes -->
      <g transform="translate(0, 110)">
        <!-- Box 1: Calendar Service -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="230" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <rect x="0" y="0" width="230" height="6" rx="3" fill="#2563eb" />
          <text x="15" y="32" fill="#1e3a8a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">Calendar Tenure:</text>
          <text x="15" y="62" fill="#0f172a" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold">8Y 6M 8D</text>
          <text x="15" y="90" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">&#8226; Start: 15 Mar 2018</text>
          <text x="15" y="110" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">&#8226; End: 23 Sept 2026</text>
          <text x="15" y="132" fill="#16a34a" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">&#10003; 100% Mathematically exact</text>
          <text x="15" y="150" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Elapsed calendar days</text>
        </g>

        <!-- Box 2: Formal Qualifying Service -->
        <g transform="translate(255, 0)">
          <rect x="0" y="0" width="230" height="170" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
          <rect x="0" y="0" width="230" height="6" rx="3" fill="#dc2626" />
          <text x="15" y="32" fill="#991b1b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">Formal Credit:</text>
          <text x="15" y="62" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold">Check Rules</text>
          <text x="15" y="90" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">&#8226; Unpaid leave deducted?</text>
          <text x="15" y="110" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">&#8226; Part-time prorated?</text>
          <text x="15" y="132" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">&#9888; Policy &amp; Statute Dependent</text>
          <text x="15" y="150" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pension, vesting, gratuity</text>
        </g>
      </g>

      <!-- Bottom Hand Annotation & Arrow -->
      <g transform="translate(10, 310)">
        <path d="M 230,0 C 230,25 240,40 255,50" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
        <polygon points="255,50 245,45 250,38" fill="#b45309" />
        <rect x="0" y="55" width="465" height="52" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" />
        <text x="14" y="76" fill="#991b1b" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold">&#128308; E-E-A-T Disclaimer:</text>
        <text x="14" y="96" fill="#7f1d1d" font-family="-apple-system, sans-serif" font-size="12">Online calculators measure calendar duration. Consult HR/pension administrators for statutory eligibility.</text>
      </g>
    </g>
  </g>
</svg>