<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%" role="img" aria-label="4 Percent Rule Withdrawal Matrix">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="340" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">How Much Annual Income Does a 401(k) Provide?</text>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">Illustrative annual sustainable income generated by various portfolio sizes under the classic 4% withdrawal framework.</text>

  <g transform="translate(45, 110)">
    <!-- 500k -->
    <rect x="0" y="0" width="170" height="210" fill="#f8faf9" rx="8" stroke="#d5e6dc"/>
    <text x="85" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a" text-anchor="middle">$500,000</text>
    <text x="85" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Modest Portfolio</text>
    <line x1="20" y1="70" x2="150" y2="70" stroke="#d5e6dc"/>
    <text x="85" y="105" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#075433" text-anchor="middle">$20,000</text>
    <text x="85" y="125" font-family="'Inter', sans-serif" font-size="11" fill="#5a7368" text-anchor="middle">Annual Income (4%)</text>
    <text x="85" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#2e4b3f" text-anchor="middle">~$1,666 / month</text>
    <rect x="15" y="170" width="140" height="24" fill="#eaf3ee" rx="4"/>
    <text x="85" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#075433" text-anchor="middle">Requires Low Expenses</text>

    <!-- 1M -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="170" height="210" fill="#f8faf9" rx="8" stroke="#075433" stroke-width="1.5"/>
      <text x="85" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a" text-anchor="middle">$1,000,000</text>
      <text x="85" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Standard Milestone</text>
      <line x1="20" y1="70" x2="150" y2="70" stroke="#d5e6dc"/>
      <text x="85" y="105" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#075433" text-anchor="middle">$40,000</text>
      <text x="85" y="125" font-family="'Inter', sans-serif" font-size="11" fill="#5a7368" text-anchor="middle">Annual Income (4%)</text>
      <text x="85" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#2e4b3f" text-anchor="middle">~$3,333 / month</text>
      <rect x="15" y="170" width="140" height="24" fill="#eaf3ee" rx="4"/>
      <text x="85" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#075433" text-anchor="middle">Comfortable with SS</text>
    </g>

    <!-- 1.5M -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="170" height="210" fill="#f8faf9" rx="8" stroke="#d5e6dc"/>
      <text x="85" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a" text-anchor="middle">$1,500,000</text>
      <text x="85" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Upper Middle Tier</text>
      <line x1="20" y1="70" x2="150" y2="70" stroke="#d5e6dc"/>
      <text x="85" y="105" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#075433" text-anchor="middle">$60,000</text>
      <text x="85" y="125" font-family="'Inter', sans-serif" font-size="11" fill="#5a7368" text-anchor="middle">Annual Income (4%)</text>
      <text x="85" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#2e4b3f" text-anchor="middle">~$5,000 / month</text>
      <rect x="15" y="170" width="140" height="24" fill="#eaf3ee" rx="4"/>
      <text x="85" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#075433" text-anchor="middle">High Lifestyle Security</text>
    </g>

    <!-- 2M -->
    <g transform="translate(585, 0)">
      <rect x="0" y="0" width="170" height="210" fill="#f8faf9" rx="8" stroke="#ff754d" stroke-width="1.5"/>
      <text x="85" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#042f2a" text-anchor="middle">$2,000,000</text>
      <text x="85" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5a7368" text-anchor="middle">Affluent Horizon</text>
      <line x1="20" y1="70" x2="150" y2="70" stroke="#fcdad1"/>
      <text x="85" y="105" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#ff754d" text-anchor="middle">$80,000</text>
      <text x="85" y="125" font-family="'Inter', sans-serif" font-size="11" fill="#5a7368" text-anchor="middle">Annual Income (4%)</text>
      <text x="85" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#2e4b3f" text-anchor="middle">~$6,666 / month</text>
      <rect x="15" y="170" width="140" height="24" fill="#ff754d" rx="4"/>
      <text x="85" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Maximum Flexibility</text>
    </g>
  </g>
</svg>