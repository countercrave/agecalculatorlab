<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">MINIMUM DATING AGE vs. AGE GAP vs. LEGAL ADULTHOOD</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">THREE DISTINCT CONCEPTS</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(80, 130)">
    <!-- Column 1: Minimum Dating Age -->
    <rect x="0" y="0" width="195" height="215" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="18" y="28" fill="#075433" font-size="12" font-weight="700">1. MINIMUM DATING AGE</text>
    <text x="18" y="55" fill="#042f2a" font-size="15" font-family="'Courier New', monospace" font-weight="700">Age ÷ 2 + 7</text>
    <text x="18" y="85" fill="#52796f" font-size="11">Concept: Social rule-of-thumb lower boundary.</text>
    <text x="18" y="140" fill="#2d5244" font-size="11">• Subjective cultural guideline</text>
    <text x="18" y="165" fill="#2d5244" font-size="11">• Not legally binding</text>
    <text x="18" y="190" fill="#2d5244" font-size="11">• Widens as age increases</text>
    
    <!-- Column 2: Age Gap -->
    <rect x="215" y="0" width="195" height="215" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1"/>
    <text x="233" y="28" fill="#075433" font-size="12" font-weight="700">2. AGE GAP</text>
    <text x="233" y="55" fill="#042f2a" font-size="15" font-family="'Courier New', monospace" font-weight="700">Older − Younger</text>
    <text x="233" y="85" fill="#52796f" font-size="11">Concept: Neutral chronological difference.</text>
    <text x="233" y="140" fill="#2d5244" font-size="11">• Pure arithmetic interval</text>
    <text x="233" y="165" fill="#2d5244" font-size="11">• Calendar or whole years</text>
    <text x="233" y="190" fill="#2d5244" font-size="11">• No compatibility rating</text>
    
    <!-- Column 3: Legal Age -->
    <rect x="430" y="0" width="205" height="215" rx="6" fill="#fdf2ef" stroke="#f5cfc4" stroke-width="1"/>
    <text x="448" y="28" fill="#a83f21" font-size="12" font-weight="700">3. LEGAL STATUTES</text>
    <text x="448" y="55" fill="#a83f21" font-size="15" font-family="'Courier New', monospace" font-weight="700">Majority Law (18+)</text>
    <text x="448" y="85" fill="#66463c" font-size="11">Concept: Statutory legal thresholds.</text>
    <text x="448" y="140" fill="#a83f21" font-size="11" font-weight="600">• Strictly binding by law</text>
    <text x="448" y="165" fill="#66463c" font-size="11">• Overrides all social formulas</text>
    <text x="448" y="190" fill="#66463c" font-size="11">• Jurisdiction specific</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>