<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#fdfcf9;border-radius:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ede9" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2a"/>
      <stop offset="100%" stop-color="#075433"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Grid Background -->
  <rect width="800" height="450" fill="#fdfcf9"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="418" rx="10" fill="none" stroke="#d5e2dc" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="36" y="32" width="728" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="56" y="62" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">MINIMUM DATING AGE: FORMULA STEPS &amp; ADULT FLOOR</text>
  <text x="744" y="62" text-anchor="end" fill="#9fe7bd" font-size="12" font-weight="600">LOWER BOUND CALCULATION</text>
  
  <!-- Content Area -->
  
  <rect x="60" y="105" width="680" height="275" rx="8" fill="#ffffff" stroke="#cde0d7" stroke-width="1.5"/>
  
  <g transform="translate(85, 130)">
    <!-- Formula Ribbon -->
    <rect x="0" y="0" width="630" height="50" rx="6" fill="#042f2a"/>
    <text x="315" y="32" text-anchor="middle" fill="#9fe7bd" font-size="16" font-family="'Courier New', monospace" font-weight="700">Minimum Dating Age = (Your Age ÷ 2) + 7</text>
    
    <!-- 2 Comparison Tracks -->
    <!-- Track 1: Standard Adult Age 40 -->
    <rect x="0" y="65" width="300" height="145" rx="6" fill="#f4f9f6" stroke="#b8d9cc" stroke-width="1.5"/>
    <text x="20" y="92" fill="#075433" font-size="13" font-weight="700">EXAMPLE: AGE 40</text>
    <text x="20" y="122" fill="#042f2a" font-size="18" font-family="'Courier New', monospace" font-weight="700">40 ÷ 2 + 7 = 27 Yrs</text>
    <text x="20" y="150" fill="#2d5244" font-size="12">• Both parties are adult peers</text>
    <text x="20" y="172" fill="#2d5244" font-size="12">• Satisfies social rule and legal criteria</text>
    
    <!-- Track 2: The Critical Adult Floor -->
    <rect x="330" y="65" width="300" height="145" rx="6" fill="#fbf2ef" stroke="#f5cfc4" stroke-width="1.5"/>
    <text x="350" y="92" fill="#a83f21" font-size="13" font-weight="700">CRITICAL ADULT FLOOR (18+)</text>
    <text x="350" y="122" fill="#a83f21" font-size="18" font-family="'Courier New', monospace" font-weight="700">Age 20: 20 ÷ 2 + 7 = 17 ❌</text>
    <text x="350" y="150" fill="#66463c" font-size="12">Mathematical output (17) is below 18.</text>
    <text x="350" y="172" fill="#a83f21" font-size="12" font-weight="700">Legal adulthood (18) STRICTLY overrides!</text>
  </g>
  
  
  <!-- Footer Note -->
  <text x="40" y="415" fill="#6a877c" font-size="11">Age Calculator Lab • Verified Mathematical Reference &amp; Chronology Model</text>
  <text x="760" y="415" text-anchor="end" fill="#6a877c" font-size="11">Social Guideline • Not Legal Counsel</text>
</svg>