<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#FFFFFF" rx="16" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="50" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700" fill="#042F2A">Claiming Milestones: Age 62 vs 66 vs 67 vs 70</text>
  <text x="40" y="76" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Side-by-side strategic comparison of the four primary Social Security claiming ages</text>

  <!-- 4 Cards -->
  <!-- Age 62 -->
  <g transform="translate(40, 110)">
    <rect width="190" height="340" rx="8" fill="#F8F9FA" stroke="#D3E5DE" stroke-width="1.5"/>
    <rect width="190" height="50" rx="8" fill="#E6F5EE"/>
    <text x="95" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#075433" text-anchor="middle">Age 62</text>
    
    <text x="15" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Status:</text>
    <text x="15" y="98" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">Earliest Claim Age</text>

    <text x="15" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Monthly Payout:</text>
    <text x="15" y="148" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C82333">70% to 75% of PIA</text>

    <text x="15" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Earnings Test:</text>
    <text x="15" y="198" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Full wage limits apply</text>

    <text x="15" y="230" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Best Suited For:</text>
    <text x="15" y="248" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Immediate cash need</text>
    <text x="15" y="266" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Shorter life expectancy</text>
    <text x="15" y="284" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Transition out of work</text>
  </g>

  <!-- Age 66 -->
  <g transform="translate(250, 110)">
    <rect width="190" height="340" rx="8" fill="#F8F9FA" stroke="#D3E5DE" stroke-width="1.5"/>
    <rect width="190" height="50" rx="8" fill="#E6F5EE"/>
    <text x="95" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#075433" text-anchor="middle">Age 66</text>
    
    <text x="15" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Status:</text>
    <text x="15" y="98" font-family="'Inter', sans-serif" font-size="12" fill="#4B6358">FRA for 1943–1954</text>

    <text x="15" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Monthly Payout:</text>
    <text x="15" y="148" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">100% (or ~93.3%)</text>

    <text x="15" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Earnings Test:</text>
    <text x="15" y="198" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Ends at FRA attainment</text>

    <text x="15" y="230" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Best Suited For:</text>
    <text x="15" y="248" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Cohorts born &lt;1955</text>
    <text x="15" y="266" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Moderate reduction</text>
    <text x="15" y="284" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Balance cash &amp; health</text>
  </g>

  <!-- Age 67 -->
  <g transform="translate(460, 110)">
    <rect width="190" height="340" rx="8" fill="#F8F9FA" stroke="#075433" stroke-width="2"/>
    <rect width="190" height="50" rx="8" fill="#075433"/>
    <text x="95" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 67</text>
    
    <text x="15" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Status:</text>
    <text x="15" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433">FRA for 1960+ Cohort</text>

    <text x="15" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Monthly Payout:</text>
    <text x="15" y="148" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#075433">100% of Full PIA</text>

    <text x="15" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Earnings Test:</text>
    <text x="15" y="198" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Completely eliminated</text>

    <text x="15" y="230" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#042F2A">Best Suited For:</text>
    <text x="15" y="248" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Full baseline benefit</text>
    <text x="15" y="266" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Continue active work</text>
    <text x="15" y="284" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">• Standard benchmark</text>
  </g>

  <!-- Age 70 -->
  <g transform="translate(670, 110)">
    <rect width="190" height="340" rx="8" fill="#042F2A" stroke="#075433" stroke-width="2"/>
    <rect width="190" height="50" rx="8" fill="#FF754D"/>
    <text x="95" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Age 70</text>
    
    <text x="15" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FF9A77">Status:</text>
    <text x="15" y="98" font-family="'Inter', sans-serif" font-size="12" fill="#D3E5DE">Max Credit Accrual</text>

    <text x="15" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FF9A77">Monthly Payout:</text>
    <text x="15" y="148" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#9FE7BD">124% to 132% of PIA</text>

    <text x="15" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FF9A77">Earnings Test:</text>
    <text x="15" y="198" font-family="'Inter', sans-serif" font-size="11" fill="#D3E5DE">None (no wage penalty)</text>

    <text x="15" y="230" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FF9A77">Best Suited For:</text>
    <text x="15" y="248" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Long life expectancy</text>
    <text x="15" y="266" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Surviving spouse protec.</text>
    <text x="15" y="284" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">• Maximizing monthly check</text>
  </g>
</svg>