<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="auto">
  <rect width="860" height="440" fill="#F8FCFA" rx="16"/>
  <rect x="25" y="20" width="810" height="400" fill="#FFFFFF" rx="12" stroke="#E2EBE6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="700" fill="#042F2A">Strategic Claiming Decision Framework</text>
  <text x="50" y="85" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#4B6358">Key factors to evaluate when deciding between early (62), standard (FRA), and delayed (70) claiming</text>

  <!-- 4 Decision Pillars -->
  <!-- Factor 1 -->
  <g transform="translate(50, 115)">
    <rect width="175" height="200" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#075433"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="52" y="33" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Current Cash</text>
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Do you have sufficient retirement savings or pensions to cover expenses without claiming early?</text>
    <rect x="15" y="150" width="145" height="36" rx="4" fill="#E6F5EE"/>
    <text x="87" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">Cash Need → 62</text>
  </g>

  <!-- Factor 2 -->
  <g transform="translate(245, 115)">
    <rect width="175" height="200" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#075433"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="52" y="33" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Health &amp; Longevity</text>
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Personal and family medical history. Delaying pays off if living past the break-even age (~78–82).</text>
    <rect x="15" y="150" width="145" height="36" rx="4" fill="#E6F5EE"/>
    <text x="87" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">High Longevity → 70</text>
  </g>

  <!-- Factor 3 -->
  <g transform="translate(440, 115)">
    <rect width="175" height="200" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#075433"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="52" y="33" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Working Status</text>
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">If you continue earning above the Retirement Earnings Test limit before FRA, benefits are withheld.</text>
    <rect x="15" y="150" width="145" height="36" rx="4" fill="#E6F5EE"/>
    <text x="87" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">Still Working → FRA</text>
  </g>

  <!-- Factor 4 -->
  <g transform="translate(635, 115)">
    <rect width="175" height="200" rx="8" fill="#F4F9F6" stroke="#C4DEC3" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#075433"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="52" y="33" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042F2A">Spousal Needs</text>
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#4B6358">Higher earner delaying to 70 locks in the highest possible surviving spouse survivor benefit protection.</text>
    <rect x="15" y="150" width="145" height="36" rx="4" fill="#042F2A"/>
    <text x="87" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FF754D" text-anchor="middle">Survivor Anchor → 70</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(50, 345)">
    <rect width="760" height="48" rx="6" fill="#075433"/>
    <text x="380" y="29" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Use the Social Security Age Calculator to pinpoint your precise milestone dates before claiming.</text>
  </g>
</svg>