<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="auto" role="img" aria-label="Average vs Median 401(k) Balance by Age">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="400" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="58" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">401(k) Balance by Age: Average vs. Median Skew</text>
  <text x="40" y="82" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">Source: Vanguard "How America Saves". Averages are pulled 2.5× to 3× higher by high-income participants.</text>

  <!-- Legend -->
  <rect x="520" y="44" width="14" height="14" fill="#075433" rx="3"/>
  <text x="540" y="56" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042f2a">Average Balance</text>
  <rect x="670" y="44" width="14" height="14" fill="#ff754d" rx="3"/>
  <text x="690" y="56" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042f2a">Median Balance</text>

  <!-- Group 1: 25-34 -->
  <g transform="translate(60, 110)">
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 25–34</text>
    <rect x="15" y="210" width="32" height="45" fill="#075433" rx="4"/>
    <text x="31" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">$37k</text>
    <rect x="55" y="237" width="32" height="18" fill="#ff754d" rx="4"/>
    <text x="71" y="230" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ff754d" text-anchor="middle">$15k</text>
  </g>

  <!-- Group 2: 35-44 -->
  <g transform="translate(200, 110)">
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 35–44</text>
    <rect x="15" y="145" width="32" height="110" fill="#075433" rx="4"/>
    <text x="31" y="137" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">$91k</text>
    <rect x="55" y="213" width="32" height="42" fill="#ff754d" rx="4"/>
    <text x="71" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ff754d" text-anchor="middle">$35k</text>
  </g>

  <!-- Group 3: 45-54 -->
  <g transform="translate(340, 110)">
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 45–54</text>
    <rect x="15" y="55" width="32" height="200" fill="#075433" rx="4"/>
    <text x="31" y="47" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">$168k</text>
    <rect x="55" y="182" width="32" height="73" fill="#ff754d" rx="4"/>
    <text x="71" y="174" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ff754d" text-anchor="middle">$61k</text>
  </g>

  <!-- Group 4: 55-64 -->
  <g transform="translate(480, 110)">
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 55–64</text>
    <rect x="15" y="0" width="32" height="255" fill="#075433" rx="4"/>
    <text x="31" y="-8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">$247k</text>
    <rect x="55" y="150" width="32" height="105" fill="#ff754d" rx="4"/>
    <text x="71" y="142" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ff754d" text-anchor="middle">$88k</text>
  </g>

  <!-- Group 5: 65+ -->
  <g transform="translate(620, 110)">
    <text x="50" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Age 65+</text>
    <rect x="15" y="-15" width="32" height="270" fill="#075433" rx="4"/>
    <text x="31" y="-23" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#075433" text-anchor="middle">$273k</text>
    <rect x="55" y="149" width="32" height="106" fill="#ff754d" rx="4"/>
    <text x="71" y="141" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ff754d" text-anchor="middle">$88k</text>
  </g>

  <!-- Key Insight Box -->
  <rect x="40" y="385" width="760" height="25" fill="#eaf3ee" rx="5"/>
  <text x="420" y="402" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#075433" text-anchor="middle">Key Takeaway: The median balance is the true statistical midpoint. Do not mistake top-heavy averages for personal targets.</text>
</svg>