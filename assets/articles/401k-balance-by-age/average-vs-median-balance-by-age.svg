<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" role="img" aria-label="Average vs Median 401(k) Balance by Age">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="420" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="40" y="56" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">401(k) Balance by Age: Average vs. Median Skew</text>
  <text x="40" y="80" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">Source: Vanguard "How America Saves". Averages are pulled 2.5× to 3× higher by high-income participants.</text>

  <!-- Legend (positioned top right with ample space) -->
  <g transform="translate(540, 42)">
    <rect x="0" y="0" width="14" height="14" fill="#075433" rx="3"/>
    <text x="20" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042f2a">Average Balance</text>
    <rect x="140" y="0" width="14" height="14" fill="#ff754d" rx="3"/>
    <text x="160" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#042f2a">Median Balance</text>
  </g>

  <!-- Baseline reference rule -->
  <line x1="40" y1="365" x2="800" y2="365" stroke="#e1ede6" stroke-width="1.5"/>

  <!-- Group 1: Ages 25-34 ($37k vs $15k) -->
  <g transform="translate(60, 0)">
    <rect x="15" y="336" width="34" height="29" fill="#075433" rx="4"/>
    <text x="32" y="328" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">$37k</text>
    
    <rect x="57" y="353" width="34" height="12" fill="#ff754d" rx="4"/>
    <text x="74" y="347" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d" text-anchor="middle">$15k</text>
    
    <text x="53" y="388" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 25–34</text>
  </g>

  <!-- Group 2: Ages 35-44 ($91k vs $35k) -->
  <g transform="translate(205, 0)">
    <rect x="15" y="294" width="34" height="71" fill="#075433" rx="4"/>
    <text x="32" y="286" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">$91k</text>
    
    <rect x="57" y="338" width="34" height="27" fill="#ff754d" rx="4"/>
    <text x="74" y="330" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d" text-anchor="middle">$35k</text>
    
    <text x="53" y="388" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 35–44</text>
  </g>

  <!-- Group 3: Ages 45-54 ($168k vs $61k) -->
  <g transform="translate(350, 0)">
    <rect x="15" y="234" width="34" height="131" fill="#075433" rx="4"/>
    <text x="32" y="226" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">$168k</text>
    
    <rect x="57" y="317" width="34" height="48" fill="#ff754d" rx="4"/>
    <text x="74" y="309" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d" text-anchor="middle">$61k</text>
    
    <text x="53" y="388" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 45–54</text>
  </g>

  <!-- Group 4: Ages 55-64 ($247k vs $88k) -->
  <g transform="translate(495, 0)">
    <rect x="15" y="172" width="34" height="193" fill="#075433" rx="4"/>
    <text x="32" y="164" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">$247k</text>
    
    <rect x="57" y="296" width="34" height="69" fill="#ff754d" rx="4"/>
    <text x="74" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d" text-anchor="middle">$88k</text>
    
    <text x="53" y="388" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Ages 55–64</text>
  </g>

  <!-- Group 5: Age 65+ ($273k vs $88k) - Top of bar is at y=152, label at y=144, legend is at y=42 -> OVER 100px GAP! -->
  <g transform="translate(640, 0)">
    <rect x="15" y="152" width="34" height="213" fill="#075433" rx="4"/>
    <text x="32" y="144" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#075433" text-anchor="middle">$273k</text>
    
    <rect x="57" y="296" width="34" height="69" fill="#ff754d" rx="4"/>
    <text x="74" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff754d" text-anchor="middle">$88k</text>
    
    <text x="53" y="388" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#042f2a" text-anchor="middle">Age 65+</text>
  </g>

  <!-- Key Insight Box at Bottom -->
  <rect x="40" y="408" width="760" height="24" fill="#eaf3ee" rx="5"/>
  <text x="420" y="424" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#075433" text-anchor="middle">Key Takeaway: The median balance is the true statistical midpoint. Do not mistake top-heavy averages for personal targets.</text>
</svg>