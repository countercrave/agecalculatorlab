<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%" role="img" aria-label="Why Income Dictates 401(k) Targets">
  <rect width="100%" height="100%" fill="#f4f9f6" rx="12"/>
  <rect x="20" y="20" width="800" height="360" fill="#ffffff" rx="10" stroke="#d5e6dc" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#042f2a">Same Age ($100k Balance), Different Financial Reality</text>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#5a7368">A fixed $100,000 balance represents completely different progress depending on your lifestyle income.</text>

  <!-- Person A Card -->
  <g transform="translate(50, 105)">
    <rect width="350" height="240" fill="#eaf5ee" rx="8" stroke="#075433" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#042f2a">Person A (Age 40)</text>
    <text x="24" y="62" font-family="'Inter', sans-serif" font-size="14" fill="#2e4b3f">Annual Salary: <tspan font-weight="700" fill="#042f2a">$50,000</tspan></text>
    <text x="24" y="86" font-family="'Inter', sans-serif" font-size="14" fill="#2e4b3f">Current 401(k): <tspan font-weight="700" fill="#075433">$100,000</tspan></text>
    <line x1="24" y1="105" x2="326" y2="105" stroke="#c0dbc9" stroke-width="1"/>
    <text x="24" y="132" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#042f2a">Salary Multiple: 2.0× Income</text>
    <text x="24" y="156" font-family="'Inter', sans-serif" font-size="13" fill="#2e4b3f">• Benchmark Target at 40: 3.0× ($150k)</text>
    <text x="24" y="178" font-family="'Inter', sans-serif" font-size="13" fill="#2e4b3f">• Moderate savings gap ($50,000)</text>
    <rect x="24" y="196" width="302" height="28" fill="#075433" rx="4"/>
    <text x="175" y="215" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Easily on Track with Standard 10% Contribution</text>
  </g>

  <!-- Person B Card -->
  <g transform="translate(440, 105)">
    <rect width="350" height="240" fill="#fef5f2" rx="8" stroke="#ff754d" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#042f2a">Person B (Age 40)</text>
    <text x="24" y="62" font-family="'Inter', sans-serif" font-size="14" fill="#2e4b3f">Annual Salary: <tspan font-weight="700" fill="#042f2a">$150,000</tspan></text>
    <text x="24" y="86" font-family="'Inter', sans-serif" font-size="14" fill="#2e4b3f">Current 401(k): <tspan font-weight="700" fill="#ff754d">$100,000</tspan></text>
    <line x1="24" y1="105" x2="326" y2="105" stroke="#fcdad1" stroke-width="1"/>
    <text x="24" y="132" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#042f2a">Salary Multiple: 0.67× Income</text>
    <text x="24" y="156" font-family="'Inter', sans-serif" font-size="13" fill="#2e4b3f">• Benchmark Target at 40: 3.0× ($450k)</text>
    <text x="24" y="178" font-family="'Inter', sans-serif" font-size="13" fill="#2e4b3f">• Substantial savings gap ($350,000)</text>
    <rect x="24" y="196" width="302" height="28" fill="#ff754d" rx="4"/>
    <text x="175" y="215" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Requires Aggressive 15%+ Catch-Up Rate</text>
  </g>
</svg>